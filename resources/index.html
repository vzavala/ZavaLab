","Title, abstract, and figures sell the paper. People do not have time to read papers; they will pick based on title, abstract, and a quick parse.","All contents must have a purpose. If a graph or equation is not used or referred to, eliminate it.","Avoid annoying reviewers. Reviewers have an adversarial mindset (they are asked to find errors). Typos, inconsistencies, poor explanations, and improper citations will get your paper rejected.","Bad grammar is bad taste. Typos and incoherent sentences send a bad message about yourself.","Minimize the number of acronyms and jargon. The brain can only keep track of a handful of acronyms. Even if the reader knows the topic, too much jargon makes things unintelligible.","Justify assumptions and main results. If you write a theorem or a graph, explain why it is there. A collection of theorems and graphs does not tell a story.","Reputation is everything. Papers and software are your ultimate products as a scientist (this is how you are measured). A bad paper of yours flying around Google damages your reputation.","Be honest. It is common for writers to massage the text or results to hide details from the reader in the hope that they go unnoticed. Someone will eventually find the flaw, so don't do it."]},{"title":"How technical writing helps you think","category":"Research Practice","type":"video","url":"https://www.youtube.com/watch?v=vtIzMaLkCaM"},{"title":"Group LaTeX template","category":"Research Practice","type":"template","url":"https://gitlab.che.wisc.edu/zavalab/workingpapers/-/blob/master/latex_template.zip","note":"Any documents generated by the group should follow this LaTeX template."},{"title":"Deep Learning (Bishop)","category":"Machine Learning","type":"book","url":"https://search.library.wisc.edu/catalog/9914061647402121"},{"title":"A Gentle Introduction to Graph Neural Networks","category":"Machine Learning","type":"course","url":"https://distill.pub/2021/gnn-intro/","note":"A high-level introduction to graph neural networks, with visualizations."},{"title":"Course on Optimization for Machine Learning (EPFL)","category":"Machine Learning","type":"course","url":"https://github.com/epfml/OptML_course"},{"title":"Mathematical Foundations of Geometric Deep Learning","category":"Machine Learning","type":"paper","url":"https://arxiv.org/abs/2508.02723","note":"Borde, H. S., and Bronstein, M. arXiv:2508.02723 (2025)."},{"title":"Self-supervised learning of graph neural networks: A unified review","category":"Machine Learning","type":"paper","note":"Xie, Y., et al. IEEE Transactions on Pattern Analysis and Machine Intelligence (2022)."},{"title":"A comprehensive survey on graph neural networks","category":"Machine Learning","type":"paper","note":"Wu, Z., et al. IEEE Transactions on Neural Networks and Learning Systems 32(1), 4–24 (2020)."},{"title":"Graph neural networks: A review of methods and applications","category":"Machine Learning","type":"paper","note":"Zhou, J., et al. AI Open 1, 57–81 (2020)."},{"title":"Deep learning on graphs: A survey","category":"Machine Learning","type":"paper","note":"Zhang, Z., Cui, P., and Zhu, W. IEEE Transactions on Knowledge and Data Engineering (2020)."},{"title":"MoleculeNet: a benchmark for molecular machine learning","category":"Machine Learning","type":"paper","note":"Wu, Z., et al. Chemical Science 9(2), 513–530 (2018)."},{"title":"How powerful are graph neural networks?","category":"Machine Learning","type":"paper","note":"Xu, K., et al. arXiv:1810.00826 (2018)."},{"title":"Neural message passing for quantum chemistry","category":"Machine Learning","type":"paper","note":"Gilmer, J., et al. International Conference on Machine Learning (ICML), PMLR (2017)."},{"title":"Semi-supervised classification with graph convolutional networks","category":"Machine Learning","type":"paper","note":"Kipf, T. N., and Welling, M. arXiv:1609.02907 (2016)."},{"title":"Sustainable Engineering: Principles and Practice","category":"Life Cycle Assessment","type":"book","url":"https://www.cambridge.org/highereducation/books/sustainable-engineering/E2A824B7ED29D4FFFE40CA56928384DE#overview","note":"Bakshi, B. R. Cambridge University Press (2019)."},{"title":"Life Cycle Assessment: Quantitative Approaches for Decisions That Matter","category":"Life Cycle Assessment","type":"book","url":"https://www.lcatextbook.com/","note":"Matthews, H. S., Hendrickson, C. T., and Matthews, D. H. (2015). Free online textbook."},{"title":"Life Cycle Assessment: A Metric for the Circular Economy","category":"Life Cycle Assessment","type":"book","url":"https://books.google.com/books/about/Life_Cycle_Assessment.html?id=v0AmEAAAQBAJ","note":"Borrion, A., Black, M. J., and Mwabonje, O. (Eds.). Royal Society of Chemistry (2021)."},{"title":"Life cycle environmental impacts of chemical recycling via pyrolysis of mixed plastic waste in comparison with mechanical recycling and energy recovery","category":"Life Cycle Assessment","type":"paper","url":"https://www.sciencedirect.com/science/article/pii/S0048969720380141","note":"Jeswani, H., et al. Science of the Total Environment 769, 144483 (2021)."},{"title":"Plastics to fuel or plastics: Life cycle assessment-based evaluation of different options for pyrolysis at end-of-life","category":"Life Cycle Assessment","type":"paper","url":"https://www.sciencedirect.com/science/article/pii/S0956053X22004238","note":"Das, S., Liang, C., and Dunn, J. B. Waste Management 153, 81–88 (2022)."},{"title":"openLCA","category":"Life Cycle Assessment","type":"software","url":"https://www.openlca.org/","note":"Free, open-source software for life cycle assessment."},{"title":"Algebra, Topology, Differential Calculus, and Optimization Theory for Computer Science and Machine Learning","category":"Math","type":"course","url":"https://www.cis.upenn.edu/~jean/math-deep.pdf","note":"Gallier, J., and Quaintance, J. (University of Pennsylvania). Free book-length notes."},{"title":"Mathematical Foundations of Geometric Deep Lea
