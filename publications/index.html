tic waste. Our analysis aims to determine the market size that the infrastructure can create, the degree of circularity that it can achieve, the prices for waste and derived products it can propagate, and the environmental benefits of diverting plastic waste from landfill and incineration facilities it can produce. We apply a computational framework that integrates techno-economic analysis, life cycle assessment, and value chain optimization. Our results demonstrate that the infrastructure generates an economy of nearly 20 billion USD and positive prices for plastic waste, opening opportunities for compensation to residents who provide plastic waste. Our analysis also indicates that the infrastructure can achieve a plastic-to-plastic degree of circularity of 34% and remains viable under various external factors (including technology efficiencies, capital investment budgets, and polymer market values). Finally, we present significant environmental benefits of upcycling over alternative landfill and incineration waste disposal methods, and comment on ongoing work expanding our modeling methodology to other chemical upcycling pathway case studies, including hydroformylation of specific plastics to chemicals."},{"id":"2024-biomanufacturing-in-space-new-concepts-and","title":"Biomanufacturing in Space: New Concepts and Paradigms for Process Design","year":2024,"type":"conference","venue":"Systems and Control Transactions","topics":["biological-systems"],"authors":["Brenda Cansino-Loeza","Vernon McIntosh","Krista L. Ternus","Ví­ctor M. Zavala"],"authorKeys":["lab:brenda-cansino","v-mcintosh","k-ternus","v-zavala"],"doi":"10.69997/sct.157136","preprint":null,"url":"https://doi.org/10.69997/sct.157136","pdf":"https://psecommunity.org/wp-content/plugins/wpor/includes/file/2408/LAPSE-2024.1592-1v2.pdf","citations":1,"abstract":"One of the main challenges to support life in space is the development of sustainable, circular processes that reduce the high cost of resupply missions. Space biomanufacturing is an emerging paradigm that aims to reduce the need for resources, enabling on-demand manufacture of products. The cost of installing biomanufacturing systems in space depends on the cost of transporting the system components, which is directly proportional to their mass/weight. From this perspective, the system mass is a critical factor that dictates process design, and this has important implications in how we can approach such design. For instance, mass constraints require circular use of resources and tight process integration (to minimize resupply) and restricts the type of resources and equipment needed. In this work, we evaluate the lactic acid bioproduction design using Escherichia coli, Saccharomyces cerevisiae, and Pichia pastoris. We use the Equivalent System Mass (ESM) metric as a key design measure. ESM allows the quantification of different physical properties of the system in a common mass basis. Our analysis reveals that 97.7 kg/year of lactic acid can be produced using Saccharomyces cerevisiae in a 10 L stainless steel fermenter. Furthermore, considering that stainless steel is the design material and quantifying the mass of 1 g/cm2 of shielding material, the total system mass was 19 kg. This modeling framework also identified the critical system elements responsible for the highest system mass and launch cost. Overall, our analysis reveals how focusing on system mass can bring new design perspectives that can aid the design of traditional manufacturing systems."},{"id":"2024-bois-bayesian-optimization-of-interconnected-systems","title":"BOIS: Bayesian Optimization of Interconnected Systems","year":2024,"type":"conference","venue":"IFAC-PapersOnLine","topics":["bayesian-optimization","graph-modeling"],"authors":["Leonardo D. González","Ví­ctor M. Zavala"],"authorKeys":["lab:leo-gonzalez","v-zavala"],"doi":"10.1016/j.ifacol.2024.08.377","preprint":"https://arxiv.org/abs/2311.11254","url":"https://doi.org/10.1016/j.ifacol.2024.08.377","pdf":"https://doi.org/10.1016/j.ifacol.2024.08.377","citations":6,"abstract":"Bayesian optimization (BO) has proven to be an effective paradigm for the global optimization of expensive-to-sample systems. One of the main advantages of BO is its use of Gaussian processes (GPs) to characterize model uncertainty which can be leveraged to guide the learning and search processes. However, BO typically treats systems as black-boxes and this limits the ability to exploit structural knowledge (e.g., physics and sparse interconnections). Composite functions of the form f(x,y(x)), wherein GP modeling is shifted from the performance function f to an intermediate function y, offer an avenue for exploiting structural knowledge. However, the use of composite functions in a BO framework is complicated by the need to generate a probability density for f from the Gaussian density of y calculated by the GP (e.g., when f is nonlinear it is not possible to obtain a closed-form expression). Previous work has handled this issue using sampling techniques; these are easy to implement and flexible but are computationally intensive. In this work, we introduce a new paradigm which allows for the efficient use of composite functions in BO; this uses adaptive linearizations of f to obtain closed-form expressions for the statistical moments of the composite function. We show that this simple approach (which we call BOIS) enables the exploitation of structural knowledge, such as that arising in interconnected systems as well as systems that embed multiple GP models and combinations of physics and GP models. Using a chemical process optimization case study, we benchmark the effectiveness of BOIS against standard BO and sampling approaches. Our results indicate that BOIS achieves performance gains and accurately captures the statistics of composite functions."},{"id":"2022-convolutional-neural-networks-basic-concepts-and","title":"Convolutional neural networks: Basic concepts and applications in manufacturing","year":2024,"type":"chapter-report","venue":"Elsevier eBooks","topics":["machine-learning"],"authors":["Shengli Jiang","Shiyi Qin","Joshua L. Pulsipher","Ví­ctor M. Zavala"],"authorKeys":["lab:shengli-jiang","lab:amy-qin","lab:joshua-pulsipher","v-zavala"],"doi":"10.1016/b978-0-323-99134-6.00007-4","preprint":"https://arxiv.org/abs/2210.07848","url":"https://arxiv.org/abs/2210.07848","pdf":"https://arxiv.org/pdf/2210.07848","citations":10,"abstract":null},{"id":"2024-dynamic-multiplexed-control-and-modeling-of","title":"Dynamic Multiplexed Control and Modeling of Optogenetic Systems Using the High-Throughput Optogenetic Platform, Lustro","year":2024,"type":"journal","venue":"ACS Synthetic Biology","topics":["biological-systems","bayesian-optimization"],"authors":["Zachary P. Harmer","Jaron C. Thompson","David L. Cole","Ophelia S. Venturelli","Ví­ctor M. Zavala","Megan N. McClean"],"authorKeys":["z-harmer","lab:jaron-thompson","lab:david-cole","o-venturelli","v-zavala","m-mcclean"],"doi":"10.1021/acssynbio.3c00761","preprint":"https://www.biorxiv.org/content/biorxiv/early/2023/12/20/2023.12.19.572411.full.pdf","url":"https://pubs.acs.org/doi/pdf/10.1021/acssynbio.3c00761","pdf":"https://doi.org/10.1021/acssynbio.3c00761","citations":9,"abstract":"Abstract The ability to control cellular processes using optogenetics is inducer-limited, with most optogenetic systems responding to blue light. To address this limitation we leverage an integrated framework combining Lustro, a powerful high-throughput optogenetics platform, and machine learning tools to enable multiplexed control over blue light-sensitive optogenetic systems. Specifically, we identify light induction conditions for sequential activation as well as preferential activation and switching between pairs of light-sensitive spit transcription factors in the budding yeast, Saccharomyces cerevisiae . We use the high-throughput data generated from Lustro to build a Bayesian optimization framework that incorporates data-driven learning, uncertainty quantification, and experimental design to enable the prediction of system behavior and the identification of optimal conditions for multiplexed control. This work lays the foundation for designing more advanced synthetic biological circuits incorporating optogenetics, where multiple circuit components can be controlled using designer light induction programs, with broad implications for biotechnology and bioengineering. Graphical abstract"},{"id":"2024-evaluating-the-economic-and-environmental-benefits","title":"Evaluating the economic and environmental benefits of deploying a national-scale, thermo-chemical plastic waste upcycling infrastructure in the United States","year":2024,"type":"journal","venue":"Computers & Chemical Engineering","topics":["plastics","supply-chains"],"authors":["Evan D. Erickson","Philip Tominac","Jiaze Ma","Horacio A. Aguirre-Villegas","Ví­ctor M. Zavala"],"authorKeys":["e-erickson","lab:philip-tominac","lab:jiaze-ma","h-aguirre","v-zavala"],"doi":"10.1016/j.compchemeng.2024.108800","preprint":"https://doi.org/10.26434/chemrxiv-2023-96xng","url":"https://doi.org/10.1016/j.compchemeng.2024.108800","pdf":"https://doi.org/10.1016/j.compchemeng.2024.108800","citations":24,"abstract":"Emerging chemical technologies can upcycle plastic waste by producing high-value polymers and other products. In this work, we study the economic and environmental benefits of deploying an upcycling infrastructure in the continental United States for producing low-density polyethylene (LDPE) and polypropylene (PP) from post-consumer plastic waste. Our analysis is based on a computational framework that integrates techno-economic analysis, life-cycle assessment, and value chain optimization. Our results demonstrate that the infrastructure could generate a market of nearly 20 billion USD per year and that this market is robust to various externalities. Our analysis also indicates that the infrastructure can achieve a plastic-to-plastic degree of circularity of 34% relative to residential plastic waste production, and leads to significant environmental benefits over alternative waste disposal methods, including 69%–75% lower greenhouse gas emissions than waste-to-energy systems and 38 million tonnes of avoided landfill waste per year."},{"id":"2024-exploiting-different-electricity-markets-via-highly","title":"Exploiting different electricity markets via highly rate-mismatched modular electrochemical synthesis","year":2024,"type":"journal","venue":"Nature Energy","topics":["energy-systems","markets-decisions"],"authors":["Rui Wang","Jiaze Ma","Hongyuan Sheng","Ví­ctor M. Zavala","Song Jin"],"authorKeys":["r-wang","lab:jiaze-ma","h-sheng","v-zavala","s-jin"],"doi":"10.1038/s41560-024-01578-8","preprint":null,"url":"https://doi.org/10.1038/s41560-024-01578-8","pdf":null,"citations":12,"abstract":null},{"id":"2024-from-process-to-systems-design-a","title":"From Process to Systems Design: A Perspective on the Future of Design Education","year":2024,"type":"conference","venue":"Systems and Control Transactions","topics":["education"],"authors":["Ví­ctor M. Zavala"],"authorKeys":["v-zavala"],"doi":"10.69997/sct.184659","preprint":null,"url":"https://doi.org/10.69997/sct.184659","pdf":"https://psecommunity.org/wp-content/plugins/wpor/includes/file/2408/LAPSE-2024.1513-1v2.pdf","citations":0,"abstract":"Chemical engineers are natural �systems-thinkers�; this is a skill that allows us to analyze highly complex processes that involve heterogeneous components, phenomena, and scales. Systems-thinking skills are fostered in the chemical engineering curriculum via integrative and project-based courses, such as process/product design and laboratories. However, existing curricula tends to focus scope to product/process boundaries, offering limited opportunities to capture connections to behavior occurring at small scales (e.g., atomistic and molecular) and at large scales (e.g., supply chains, policy, markets, and infrastructures). This limit in scope can hinder our ability to appreciate how products/processes that we develop impact society, markets, and the environment (e.g., the opioid addiction crisis, environmental impacts of forever chemicals and chemical fertilizers, and electricity markets). This limit in scope can also hinder our ability to appreciate how emerging tools from the molecular sciences can help us design better products/processes. Expanding the boundaries of our thinking is essential in overcoming these limitations. In this perspective, I discuss how emerging concepts and technologies from machine learning, data science, environmental sciences, molecular simulations, and mathematics provide powerful tools to help foster systems-thinking over a broad set of scales and to help establish connections with non-traditional disciplines (e.g., social sciences). In addition, I discuss the need to create new conceptual frameworks, case studies, and software that can help foster systems-thinking."},{"id":"2024-graph-neural-networks-for-co2-solubility","title":"Graph neural networks for CO2 solubility predictions in Deep Eutectic Solvents","year":2024,"type":"journal","venue":"Computers & Chemical Engineering","topics":["machine-learning","molecular-sensing"],"authors":["Gabriel Hernández-Morales","Edgar Iván Sánchez Medina","Arturo Jiménez-Gutiérrez","Ví­ctor M. Zavala"],"authorKeys":["g-hernandez","e-medina","a-jimenez","v-zavala"],"doi":"10.1016/j.compchemeng.2024.108750","preprint":"https://doi.org/10.26434/chemrxiv-2024-w04nm","url":"https://www.sciencedirect.com/science/article/pii/S0098135424001686?casa_token=wjbS816osHcAAAAA:O7ctcKURTwb-jw6AKBpGLPx39YQH7pdpTi_DHkxWB6iPKiHdlH5hnJH1Z6Pe5y_6tcI1T75n7AWu","pdf":"https://doi.org/10.1016/j.compchemeng.2024.108750","citations":19,"abstract":null},{"id":"2023-graph-based-optimization-for-technology-pathway","title":"Graph-Based Optimization for Technology Pathway Analysis: A Case Study in the Decarbonization of University Campuses","year":2024,"type":"journal","venue":"arXiv (Cornell University)","topics":["graph-modeling","energy-systems"],"authors":["Blake Lopez","Jiaze Ma","Ví­ctor M. Zavala"],"authorKeys":["lab:blake-lopez","lab:jiaze-ma","v-zavala"],"doi":"10.1021/acs.iecr.3c03244","preprint":"https://arxiv.org/abs/2311.00809","url":"https://arxiv.org/abs/2311.00809","pdf":"https://arxiv.org/pdf/2311.00809","citations":0,"abstract":"Industrial sectors such as urban centers, chemical companies, manufacturing facilities, and microgrids are actively exploring strategies to help reduce their carbon footprint. For instance, university campuses are complex urban districts (involving collections of buildings and utility systems) that are seeking to reduce carbon footprints that originate from diverse activities (e.g., transportation operations and production of heating, cooling, and power utilities). This work presents an optimization framework to identify technology pathways that enable decarbonization of complex industrial sectors. The framework uses a graph abstraction that compactly captures interdependencies between diverse products and technologies as well as diverse externalities (e.g., market, policy, and carbon prices). Duality analysis reveals that the formulation can be interpreted as an economy, market, or value chain that uses technologies to generate economic value (wealth) by transforming basic products into higher value products. This interpretation also reveals that the formulation identifies pathways that maximize the profit of stakeholders, helps reveal the inherent value (prices) of intermediate products, and helps analyze the impact of externalities and technology specifications on product values. Our developments are illustrated via a case study involving a prototypical university campus that seeks to identify pathways that reduce its carbon footprint (e.g., via electrification and deployment of hydrogen technologies). We use the framework to determine carbon tax values, technology specifications, and investment budgets that activate different technology pathways and that achieve different levels of decarbonization."},{"id":"2024-graph-based-representations-and-applications-to","title":"Graph-Based Representations and Applications to Process Simulation","year":2024,"type":"conference","venue":"Systems and Control Transactions","topics":["graph-modeling"],"authors":["Yoel R. Cortes-Pena","Ví­ctor M. Zavala","Yoel R. Cortés-Peña"],"authorKeys":["lab:yoel-cortes","v-zavala","lab:yoel-cortes"],"doi":"10.69997/sct.184650","preprint":null,"url":"https://doi.org/10.69997/sct.184650","pdf":"https://psecommunity.org/wp-content/plugins/wpor/includes/file/2408/LAPSE-2024.1518-1v2.pdf","citations":2,"abstract":"Rapid and robust convergence of a process flowsheet is critical to enable large-scale simulations that address core scientific questions related to process design, optimization, and sustainability. However, due to the highly coupled and nonlinear nature of chemical processes, efficiently solving a flowsheet remains a challenge. In this work, we show that graph representations of the underlying physical phenomena in unit operations may help identify potential avenues to systematically reformulate the network of equations and enable more robust topology-based convergence of flowsheets. To this end, we developed graph abstractions of the governing equations of vapor-liquid and liquid-liquid equilibrium separation equipment. These graph abstractions consist of a mesh of interconnected variable nodes and equation nodes that are systematically generated through PhenomeNode, a new open-source library in Python developed in this study. We show that partitioning the graph into separate mass, energy, and equilibrium subgraphs can help decouple nonlinearities and guide decomposition algorithms. By employing the graph abstraction on an industrial separation process for separating glacial acetic acid from water, we implemented a new block decomposition scheme in BioSTEAM and demonstrated that this can accelerate convergence over a traditional sequential modular approach."},{"id":"2024-identifying-green-solvent-mixtures-for-bioproduct","title":"Identifying Green Solvent Mixtures for Bioproduct Separation Using Bayesian Experimental Design","year":2024,"type":"journal","venue":"ACS Sustainable Chemistry & Engineering","topics":["bayesian-optimization","molecular-sensing"],"authors":["Shiyi Qin","Surajudeen Omolabake","Aminata Diaby","Jianping Li","Leonardo D. González","Christopher M. Holland","Ví­ctor M. Zavala","Shannon S. Stahl","Reid C. Van Lehn"],"authorKeys":["lab:amy-qin","s-omolabake","a-diaby","j-li","lab:leo-gonzalez","c-holland","v-zavala","s-stahl","r-lehn"],"doi":"10.1021/acssuschemeng.4c07423","preprint":"https://doi.org/10.26434/chemrxiv-2024-12h5f","url":"https://doi.org/10.1021/acssuschemeng.4c07423","pdf":"https://doi.org/10.26434/chemrxiv-2024-12h5f","citations":14,"abstract":"Liquid-liquid extraction (LLE) is a widely used technique for the separation and purification of liquid-phase products with applications in various industries, including pharmaceuticals, petrochemicals, and renewable chemistry. A critical step in the design of a LLE process is the selection of appropriate solvents. This study presents a new methodology for identifying solvent mixtures for bioproduct separation using Bayesian Experimental Design (BED). Motivated by the need for environmentally-friendly and effective separation methods, we address the challenge of selecting solvent systems that balance separation efficiency, selectivity, and environmental impact, while also tackling the difficulty of separating multiple bioproducts using complex solvent systems. Our approach specifically seeks to predict product partition coefficients as thermodynamic parameters underlying solvent selection. The iterative approach integrates Bayesian optimization with experimental measurements to guide solvent selection, and leverages COSMO-RS simulations to enhance high-throughput experimentation. Using the design of solvent systems for the separation of lignin-derived aromatic products via centrifugal partition chromatography (CPC) as a case study, we show that within seven iterations/cycles of the methodology, we can identify new mixtures of green solvents that align with CPC design principles. These results demonstrate the efficacy of the BED framework in optimizing green solvent systems for complex separations, highlighting the potential of this method to advance the field of green chemistry and contribute to the development of sustainable industrial processes."},{"id":"2024-optimal-design-of-food-packaging-considering","title":"Optimal Design of Food Packaging Considering Waste Management Technologies to Achieve Circular Economy","year":2024,"type":"conference","venue":"Systems and Control Transactions","topics":["plastics"],"authors":["Paola Muñoz Briones","Aurora del Carmen Munguía-López","Kevin L. Sánchez-Rivera","Ví­ctor M. Zavala","George W. Huber","Styliani Avraamidou"],"authorKeys":["p-briones","lab:aurora-munguia","k-sanchez","v-zavala","g-huber","s-avraamidou"],"doi":"10.69997/sct.154335","preprint":null,"url":"https://doi.org/10.69997/sct.154335","pdf":"https://psecommunity.org/wp-content/plugins/wpor/includes/file/2408/LAPSE-2024.1613-1v2.pdf","citations":6,"abstract":"Plastic packaging plays a fundamental role in the food industry, avoiding food waste and facilitating food access. The increasing plastic production and the lack of appropriate plastic waste management technologies represent a threat to the environmental and human welfare. Therefore, there is an urgent need to identify sustainable packaging solutions. Circular economy (CE) promotes reducing waste and increasing recycling practices to achieve sustainability. In this work, we propose a CE framework based on multi-objective optimization, considering both economic and environmental impacts, to identify optimal packaging designs and waste management technologies. Using mixed-integer linear programming (MILP), techno-economic analysis (TEA), and life cycle assessment (LCA), this work aims to build the first steps in packaging design, informing about the best packaging alternatives and the optimal technology or technologies to process packaging waste. For the economic analysis, we consider the minimum increase in price (MIP) when adding recycling to the cost of each packaging solution, while for the environmental analysis, the greenhouse gas emissions impact was considered. A case study on ground coffee packaging is used to illustrate the proposed framework. The results demonstrate that the multilayer bag option is the most convenient when considering both the chosen economic and environmental impacts."},{"id":"2024-plasmodata-jl-a-julia-framework-for","title":"PlasmoData.jl — A Julia framework for modeling and analyzing complex data as graphs","year":2024,"type":"journal","venue":"Computers & Chemical Engineering","topics":["topology-geometry","software","graph-modeling"],"authors":["David L. Cole","Ví­ctor M. Zavala"],"authorKeys":["lab:david-cole","v-zavala"],"doi":"10.1016/j.compchemeng.2024.108679","preprint":"https://arxiv.org/abs/2401.11404","url":"https://www.sciencedirect.com/science/article/pii/S0098135424000978","pdf":"https://www.sciencedirect.com/science/article/am/pii/S0098135424000978","citations":3,"abstract":null},{"id":"2024-robust-plastic-waste-classification-using-wavelet","title":"Robust plastic waste classification using wavelet transform multi-resolution analysis and convolutional neural networks","year":2024,"type":"journal","venue":"Computers & Chemical Engineering","topics":["plastics","machine-learning"],"authors":["Fei Long","Shengli Jiang","Ezra Bar-Ziv","Ví­ctor M. Zavala"],"authorKeys":["f-long","lab:shengli-jiang","e-bar","v-zavala"],"doi":"10.1016/j.compchemeng.2023.108516","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2023.108516","pdf":"https://doi.org/10.1016/j.compchemeng.2023.108516","citations":12,"abstract":null},{"id":"2024-screening-green-solvents-for-multilayer-plastic","title":"Screening Green Solvents for Multilayer Plastic Films Separation","year":2024,"type":"conference","venue":"Systems and Control Transactions","topics":["plastics","molecular-sensing"],"authors":["Ugochukwu M. Ikegwu","Ví­ctor M. Zavala","Reid C. Van Lehn"],"authorKeys":["lab:ugochukwu-ikegwu","v-zavala","r-lehn"],"doi":"10.69997/sct.162050","preprint":null,"url":"https://doi.org/10.69997/sct.162050","pdf":"https://psecommunity.org/wp-content/plugins/wpor/includes/file/2408/LAPSE-2024.1605-1v2.pdf","citations":4,"abstract":"This paper introduces a computational framework for selecting green solvents to separate multilayer plastic films, particularly those challenging to recycle through mechanical means. The framework prioritizes the selective dissolution of polymers while considering solvent toxicity. Initial screening relies on temperature-solubility dependence, utilizing octanol-water partition coefficients (LogP) to identify non-toxic solvents (LogP = 3). Additionally, guidelines from GlaxoSmithKline (GSK), Registration, Evaluation, Authorization, and Restriction of Chemical Regulation (REACH), and the US Environmental Protection Agency (EPA) are employed to screen for green solvents. Molecular-scale models predict temperature-dependent solubilities and LogP values for polymers and solvents. The framework is applied to identify green solvents for separating a multilayer plastic film composed of polyethylene (PE), ethylene vinyl alcohol (EVOH), and polyethylene terephthalate (PET). The case study demonstrates the framework's effectiveness in identifying environmentally friendly solvents and balancing trade-offs between solvent toxicity and solubility. Furthermore, the framework informs process design by screening for suitable green solvents in selective dissolution processes, potentially leading to the development of more sustainable dissolution processes and the identification of easily recyclable polymer blends in multilayer plastic films."},{"id":"2024-sustainable-production-of-fertilizers-via-photosynthetic","title":"Sustainable Production of Fertilizers via Photosynthetic Recovery of Nutrients in Livestock Waste","year":2024,"type":"conference","venue":"Systems and Control Transactions","topics":["waste-nutrients","biological-systems"],"authors":["Leonardo D. Gonz�lez","Celeste Mills","Aurora del Carmen Munguía-López","Ví­ctor M. Zavala","Leonardo D. González"],"authorKeys":["l-gonzlez","c-mills","lab:aurora-munguia","v-zavala","lab:leo-gonzalez"],"doi":"10.69997/sct.147417","preprint":null,"url":"https://doi.org/10.69997/sct.147417","pdf":"https://psecommunity.org/wp-content/plugins/wpor/includes/file/2408/LAPSE-2024.1602-1v2.pdf","citations":0,"abstract":"Increases in population and improvements in living standards have significantly increased the demand for animal products worldwide. However, modern livestock agriculture exerts significant pressure on the environment due to high material and energy requirements. These systems also generate significant amounts of waste that can cause severe environmental damage when not handled properly. Thus, if we wish to enable farmers to meet this increased demand in a sustainable way, technology pathways must be developed to convert livestock agriculture into a more circular economy. With this end in mind, we propose a novel framework (which we call ReNuAl) for the recovery of nutrients from livestock waste. ReNuAl integrates existing technologies with a novel biotechnology approach that uses cyanobacteria (CB) as a multi-functional component for nutrient capture and balancing, purifying biogas, and capturing carbon. The CB can be applied to crops, reducing the need for synthetic fertilizers like diammonium phosphate. Using manure profiles obtained from dairy farms in the Upper Yahara region of Wisconsin, we construct a case study to analyze the environmental and economic impacts of ReNuAl. Our results illustrate that the minimum selling price (MSP) of CB fertilizer produced from deploying ReNuAl at a 1000 animal unit (AU) farm is significantly higher than the cost of synthetic fertilizers. We also observe that ReNuAl can return environmental benefits in areas such as climate change and nutrient runoff when compared to current practices. As a result, we see that consideration of environmental incentives can significantly increase the economic viability of the process."},{"id":"2024-techno-economic-analysis-and-life-cycle","title":"Techno-Economic Analysis and Life Cycle Assessment of the Production of Biodegradable Polyaliphatic–Polyaromatic Polyesters","year":2024,"type":"journal","venue":"ACS Sustainable Chemistry & Engineering","topics":["plastics"],"authors":["Bo-Xun Wang","Yoel Rene Cortes-Pena","Brian P. Grady","George W. Huber","Ví­ctor M. Zavala"],"authorKeys":["lab:bo-xun-wang","lab:yoel-cortes","b-grady","g-huber","v-zavala"],"doi":"10.1021/acssuschemeng.4c01842","preprint":null,"url":"https://doi.org/10.1021/acssuschemeng.4c01842","pdf":null,"citations":34,"abstract":"Poly(butylene-adipate terephthalate) (PBAT) is a polyaliphatic–polyaromatic polyester that is biodegradable and has found application in several markets, making it a widely produced biodegradable polymer worldwide. However, the production of PBAT is carbon-intensive, as it relies on the use of petroleum-based monomers. There is, thus, significant interest in identifying polyesters that are biodegradable and less carbon-intensive (e.g., use of biomass-derived monomers). In this work, we develop a detailed process model (and an associated database) for the production of polyaliphatic–polyaromatic polyesters including petroleum-based PBAT and biomass-derived alternatives including poly(pentylene-adipate terephthalate) and poly(pentylene-adipate furandicarboxylate). Techno-economic analysis (TEA) reveals that the production costs of these polyesters strongly depend on monomer costs (accounting for over 90% of the total production cost) and identifies market conditions under which biomass-based polyesters can be cost-competitive to petroleum-based PBAT. Life cycle assessment (LCA) shows that biomass-derived polyesters can reduce the global warming impact of PBAT by half. Overall, the proposed TEA/LCA model aims to provide guidance into polyesters that are most promising and help assess their overall economic and environmental performance."},{"id":"2024-the-shape-of-complex-systems","title":"The shape of complex systems","year":2024,"type":"journal","venue":"Nature Chemical Engineering","topics":["topology-geometry"],"authors":["Ví­ctor M. Zavala","Alexander D. S. Smith"],"authorKeys":["v-zavala","lab:alexander-smith"],"doi":"10.1038/s44286-024-00101-w","preprint":null,"url":"https://www.nature.com/articles/s44286-024-00101-w","pdf":null,"citations":1,"abstract":null},{"id":"2024-the-waste-to-biomethane-logistic-problem","title":"The Waste-to-Biomethane Logistic Problem: A Mathematical Optimization Approach","year":2024,"type":"journal","venue":"ACS Sustainable Chemistry & Engineering","topics":["supply-chains","waste-nutrients"],"authors":["Víctor Blanco","Yolanda Hinojosa","Ví­ctor M. Zavala"],"authorKeys":["v-blanco","y-hinojosa","v-zavala"],"doi":"10.1021/acssuschemeng.4c01429","preprint":"https://arxiv.org/abs/2312.01995","url":"https://pubs.acs.org/doi/pdf/10.1021/acssuschemeng.4c01429","pdf":"https://pubs.acs.org/doi/pdf/10.1021/acssuschemeng.4c01429","citations":11,"abstract":"In this paper, we propose a new mathematical optimization approach to make decisions on the optimal design of the complex logistic system required to produce biogas from waste. We provide a novel and flexible decision-aid tool that allows decision makers to optimally determine the locations of different types of plants (pretreatment, anaerobic digestion, and biomethane liquefaction plants) and pipelines involved in the logistic process, according to a given budget, as well as the most efficient distribution of the products (from waste to biomethane) along the supply chain. The method is based on a mathematical optimization model that we further analyze and that, after reducing the number of variables and constraints without affecting the solutions, is able to solve real-size instances in reasonable CPU times. The proposed methodology is designed to be versatile and adaptable to different situations that arise in the transformation of waste to biogas. The results of our computational experiments, both in synthetic and in a case study instance, prove the validity of our proposal in practical applications. Synthetic instances with up to 200 farms and potential locations for pretreatment plants and 100 potential locations for anaerobic digestion and biomethane liquefaction plants were solved, exactly, within <20 min, whereas the larger instances with 500 farms were solved within <2 h. The CPU times required to solve the real-world instance range from 2 min to 6 h, being highly affected by the given budget to install the plants and the percent of biomethane that is required to be injected in the existing gas network."},{"id":"2024-topological-data-analysis-for-particulate-gels","title":"Topological Data Analysis for Particulate Gels","year":2024,"type":"journal","venue":"ACS Nano","topics":["topology-geometry","molecular-sensing"],"authors":["Alexander D. S. Smith","Gavin J. Donley","Emanuela Del Gado","Ví­ctor M. Zavala"],"authorKeys":["lab:alexander-smith","g-donley","e-gado","v-zavala"],"doi":"10.1021/acsnano.4c04969","preprint":"https://arxiv.org/abs/2404.02991","url":"https://doi.org/10.1021/acsnano.4c04969","pdf":"https://arxiv.org/pdf/2404.02991","citations":20,"abstract":"Soft gels, formed via the self-assembly of particulate materials, exhibit intricate multiscale structures that provide them with flexibility and resilience when subjected to external stresses. This work combines particle simulations and topological data analysis (TDA) to characterize the complex multiscale structure of soft gels. Our TDA analysis focuses on the use of the Euler characteristic, which is an interpretable and computationally scalable topological descriptor that is combined with filtration operations to obtain information on the geometric (local) and topological (global) structure of soft gels. We reduce the topological information obtained with TDA using principal component analysis (PCA) and show that this provides an informative low-dimensional representation of the gel structure. We use the proposed computational framework to investigate the influence of gel preparation (e.g., quench rate, volume fraction) on soft gel structure and to explore dynamic deformations that emerge under oscillatory shear in various response regimes (linear, nonlinear, and flow). Our analysis provides evidence of the existence of hierarchical structures in soft gels, which are not easily identifiable otherwise. Moreover, our analysis reveals direct correlations between topological changes of the gel structure under deformation and mechanical phenomena distinctive of gel materials, such as stiffening and yielding. In summary, we show that TDA facilitates the mathematical representation, quantification, and analysis of soft gel structures, extending traditional network analysis methods to capture both local and global organization."},{"id":"2024-uncertainty-quantification-for-molecular-property-predictions","title":"Uncertainty quantification for molecular property predictions with graph neural architecture search","year":2024,"type":"journal","venue":"Digital Discovery","topics":["machine-learning","molecular-sensing","uncertainty"],"authors":["Shengli Jiang","Shiyi Qin","Reid C. Van Lehn","Prasanna Balaprakash","Victor M. Zavala"],"authorKeys":["lab:shengli-jiang","lab:amy-qin","r-lehn","p-balaprakash","v-zavala"],"doi":"10.1039/d4dd00088a","preprint":"https://arxiv.org/abs/2307.10438","url":"https://doi.org/10.1039/d4dd00088a","pdf":"https://pubs.rsc.org/en/content/articlepdf/2024/dd/d4dd00088a","citations":37,"abstract":"AutoGNNUQ employs neural architecture search to enhance uncertainty quantification for molecular property prediction via graph neural networks."},{"id":"2024-understanding-the-interplay-between-electrocatalytic-fragmentation","title":"Understanding the interplay between electrocatalytic fragmentation and oxygenation reactions","year":2024,"type":"journal","venue":"Nature Catalysis","topics":["molecular-sensing"],"authors":["Christine Lucky","Shengli Jiang","Chien-Rung Shih","Ví­ctor M. Zavala","Marcel Schreier"],"authorKeys":["c-lucky","lab:shengli-jiang","c-shih","v-zavala","m-schreier"],"doi":"10.1038/s41929-024-01218-0","preprint":null,"url":"https://doi.org/10.1038/s41929-024-01218-0","pdf":null,"citations":13,"abstract":null},{"id":"2023-a-graph-based-modeling-framework-for","title":"A Graph-Based Modeling Framework for Tracing Hydrological Pollutant Transport in Surface Waters","year":2023,"type":"journal","venue":"Computers & Chemical Engineering","topics":["graph-modeling","waste-nutrients"],"authors":["David L. Cole","Gerardo J. Ruiz-Mercado","Ví­ctor M. Zavala"],"authorKeys":["lab:david-cole","g-ruiz","v-zavala"],"doi":"10.1016/j.compchemeng.2023.108457","preprint":"https://arxiv.org/abs/2302.04991","url":"https://doi.org/10.1016/j.compchemeng.2023.108457","pdf":"https://arxiv.org/pdf/2302.04991","citations":12,"abstract":null},{"id":"2023-a-spatial-superstructure-approach-to-the","title":"A spatial superstructure approach to the optimal design of modular processes and supply chains","year":2023,"type":"journal","venue":"Computers & Chemical Engineering","topics":["supply-chains"],"authors":["Yue Shao","Jiaze Ma","Ví­ctor M. Zavala"],"authorKeys":["lab:yue-shao","lab:jiaze-ma","v-zavala"],"doi":"10.1016/j.compchemeng.2022.108102","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2022.108102","pdf":"https://doi.org/10.1016/j.compchemeng.2022.108102","citations":13,"abstract":null},{"id":"2023-accelerated-dual-dynamic-integer-programming-applied","title":"Accelerated dual dynamic integer programming applied to short-term power generation scheduling","year":2023,"type":"journal","venue":"International Journal of Electrical Power & Energy Systems","topics":["energy-systems","optimization-algorithms"],"authors":["Kenny Vinente dos Santos","Bruno Colonetti","Erlon Cristian Finardi","Ví­ctor M. Zavala"],"authorKeys":["k-santos","b-colonetti","e-finardi","v-zavala"],"doi":"10.1016/j.ijepes.2022.108689","preprint":null,"url":"https://doi.org/10.1016/j.ijepes.2022.108689","pdf":null,"citations":11,"abstract":null},{"id":"2023-bayesian-optimization-for-automatic-tuning-of","title":"Bayesian Optimization for Automatic Tuning of Model Predictive Controllers","year":2023,"type":"conference","venue":"Proceedings of FOCAPO/CPC 2023","topics":["bayesian-optimization","control"],"authors":["L.D. González","V.M Zavala"],"authorKeys":["lab:leo-gonzalez","v-zavala"],"doi":null,"preprint":null,"url":"https://drive.google.com/file/d/16LE4GfdnkprhlMFRMe6kTU5s_uxv0e2P/view?usp=share_link","pdf":null,"citations":null,"abstract":null},{"id":"2023-biogas-production-in-united-states-dairy","title":"Biogas production in United States dairy farms incentivized by electricity policy changes","year":2023,"type":"journal","venue":"Nature Sustainability","topics":["waste-nutrients","energy-systems"],"authors":["Evan D. Erickson","Philip Tominac","Ví­ctor M. Zavala"],"authorKeys":["e-erickson","lab:philip-tominac","v-zavala"],"doi":"10.1038/s41893-022-01038-9","preprint":null,"url":"https://doi.org/10.1038/s41893-022-01038-9","pdf":null,"citations":29,"abstract":null},{"id":"2022-capturing-molecular-interactions-in-graph-neural","title":"Capturing molecular interactions in graph neural networks: a case study in multi-component phase equilibrium","year":2023,"type":"journal","venue":"Digital Discovery","topics":["machine-learning","molecular-sensing"],"authors":["Shiyi Qin","Shengli Jiang","Jianping Li","Prasanna Balaprakash","Reid C. Van Lehn","Ví­ctor M. Zavala"],"authorKeys":["lab:amy-qin","lab:shengli-jiang","j-li","p-balaprakash","r-lehn","v-zavala"],"doi":"10.1039/d2dd00045h","preprint":"https://doi.org/10.26434/chemrxiv-2022-3tq4c","url":"https://doi.org/10.26434/chemrxiv-2022-3tq4c","pdf":"https://doi.org/10.1039/d2dd00045h","citations":64,"abstract":"Graph neural networks (GNNs) have been widely used for predicting molecular properties, especially for single molecules. However, when treating multi-component systems, GNNs have mostly used simple data representations (concatenation, averaging, or self-attention on features of individual components) that might fail to capture molecular interactions and potentially limit prediction accuracy. In this work, we propose a GNN architecture that captures molecular interactions in an explicit manner by combining atomic-level (local) graph convolution and molecular-level (global) message passing through a molecular interaction network. We tested the architecture (which we call SolvGNN) on a comprehensive phase equilibrium case study that aims to predict activity coefficients for a wide range of binary and ternary mixtures; we built this large dataset using the COnductor-like Screening MOdel for Real Solvation (COSMO-RS). We show that SolvGNN can predict composition-dependent activity coefficients with high accuracy and show that it Outperforms a previously developed GNN used for predicting infinite-dilution activity coefficients. We performed counterfactual analysis on the SolvGNN model that allowed us to explore the impact of functional groups and composition on equilibrium behavior. We also used the SolvGNN model for the development of a computational framework that automatically creates phase diagrams for a diverse set of complex mixtures. All scripts needed to reproduce the results are shared as open-source code."},{"id":"2023-comparative-techno-economic-analysis-and-life","title":"Comparative Techno-economic Analysis and Life Cycle Assessment of Producing High-Value Chemicals and Fuels from Waste Plastic via Conventional Pyrolysis and Thermal Oxo-degradation","year":2023,"type":"journal","venue":"Energy & Fuels","topics":["plastics"],"authors":["Olumide O. Olafasakin","Jiaze Ma","Ví­ctor M. Zavala","Robert C. Brown","George W. Huber","Mark Mba Wright"],"authorKeys":["o-olafasakin","lab:jiaze-ma","v-zavala","r-brown","g-huber","m-wright"],"doi":"10.1021/acs.energyfuels.3c02321","preprint":null,"url":"https://doi.org/10.1021/acs.energyfuels.3c02321","pdf":"https://www.osti.gov/servlets/purl/2475807","citations":52,"abstract":"The rapid rise in global plastic production in recent decades has resulted in the massive generation of plastic waste. Over 75% of the plastic waste generated in the United States was sent to landfills, with a meager 8.7% recycled. Plastics are valuable feedstocks for platform chemicals and fuels. Chemical upcycling of waste high-density polyethylene (HDPE) is gaining more attention as a potentially feasible and environmentally friendly plastic waste management technology. Conventional pyrolysis (CPY) and thermal oxo-degradation (TOD) are two chemical upcycling technologies actively researched for decomposing waste HDPE into valuable chemicals and fuels. However, there are few studies on the techno-economic analysis (TEA) and life cycle assessment (LCA) of these technologies for converting waste HDPE to valuable products. This study conducts a comparative TEA and LCA study of the thermochemical decomposition of waste HDPE to produce gaseous (ethylene and propylene) and liquid (naphtha, diesel, and wax) products by CPY and TOD. The study elucidates and compares the impact of hydrocracking longer chain hydrocarbons to produce more valuable products on the TEA and LCA. The TEA showed that the fixed capital investment could range from $32.5 million for TOD without hydrocracking to $244 million for CPY with hydrocracking scenarios. Annual revenues range from $28.1 million to $71.5 million in favor of scenarios with hydrocracking. However, the net present value ranges from $1.4 million to $265.8 million in favor of scenarios without hydrocracking. Sensitivity analysis showed that fixed capital cost, facility capacity, and product prices have the biggest impact on the process economics of the facilities, while utilities and waste transportation to refineries have the biggest impact on environmental impacts. The LCA showed that primary products from scenarios without hydrocracking can be more environmentally friendly than virgin products from petroleum processes. However, TOD and CPY with hydrocracking primary products have more emissions than those of virgin products."},{"id":"2023-decoding-optical-responses-of-contact-printed","title":"Decoding Optical Responses of Contact-Printed Arrays of Thermotropic Liquid Crystals Using Machine Learning: Detection and Reporting of Aqueous Amphiphiles with Enhanced Sensitivity and Selectivity","year":2023,"type":"journal","venue":"ACS Applied Materials & Interfaces","topics":["molecular-sensing","machine-learning"],"authors":["Fengrui Wang","Shiyi Qin","Claribel Acevedo-Vélez","Reid C. Van Lehn","Ví­ctor M. Zavala","David M. Lynn"],"authorKeys":["f-wang","lab:amy-qin","c-acevedo","r-lehn","v-zavala","d-lynn"],"doi":"10.1021/acsami.3c12905","preprint":"https://doi.org/10.26434/chemrxiv-2023-ns10h","url":"https://doi.org/10.1021/acsami.3c12905","pdf":"https://chemrxiv.org/engage/api-gateway/chemrxiv/assets/orp/resource/item/63f7b6e7897b18336f04fe02/original/decoding-optical-responses-of-contact-printed-arrays-of-thermotropic-liquid-crystals-using-machine-learning-detection-and-reporting-of-aqueous-amphiphiles-with-enhanced-sensitivity-and-selectivity.pdf","citations":7,"abstract":"Surfactants and other amphiphilic molecules are used extensively in household products, industrial processes, and biological applications and are also common environmental contaminants; as such, methods that can detect, sense, or quantify them are of great practical relevance. Aqueous emulsions of thermotropic liquid crystals (LCs) can exhibit distinctive optical responses in the presence of surfactants and have thus emerged as sensitive, rapid, and inexpensive sensors or reporters of environmental amphiphiles. However, many existing LC-in-water emulsions require the use of complicated or expensive instrumentation for quantitative characterization owing to variations in optical responses among individual LC droplets. In many cases, the responses of LC droplets are also analyzed by human inspection, which can miss subtle color or topological changes encoded in LC birefringence patterns. Here, we report an LC-based surfactant sensing platform that takes a step toward addressing several of these issues and can reliably predict concentrations and types of surfactants in aqueous solutions. Our approach uses surface-immobilized, microcontact-printed arrays of micrometer-scale droplets of thermotropic LCs and hierarchical convolutional neural networks (CNNs) to automatically extract and decode rich information about topological defects and color patterns available in optical micrographs of LC droplets to classify and quantify adsorbed surfactants. In addition, we report computational capabilities to determine relevant optical features extracted by the CNN from LC micrographs, which can provide insights into surfactant adsorption phenomena at LC-water interfaces. Overall, the combination of microcontact-printed LC arrays and machine learning provides a convenient and robust platform that could prove useful for developing high-throughput sensors for on-site testing of environmentally or biologically relevant amphiphiles."},{"id":"2022-economic-evaluation-of-infrastructures-for-thermochemical","title":"Economic evaluation of infrastructures for thermochemical upcycling of post-consumer plastic waste","year":2023,"type":"journal","venue":"Green Chemistry","topics":["plastics","supply-chains"],"authors":["Jiaze Ma","Philip Tominac","Horacio A. Aguirre-Villegas","Olumide O. Olafasakin","Mark Mba Wright","Craig H. Benson","George W. Huber","Ví­ctor M. Zavala"],"authorKeys":["lab:jiaze-ma","lab:philip-tominac","h-aguirre","o-olafasakin","m-wright","c-benson","g-huber","v-zavala"],"doi":"10.1039/d2gc04005k","preprint":"https://doi.org/10.26434/chemrxiv-2022-v838h","url":"https://chemrxiv.org/engage/chemrxiv/article-details/6349a490de2a213e57a5771d","pdf":"https://chemrxiv.org/engage/api-gateway/chemrxiv/assets/orp/resource/item/6349a490de2a213e57a5771d/original/economic-evaluation-of-infrastructures-for-thermochemical-upcycling-of-post-consumer-plastic-waste.pdf","citations":59,"abstract":"Thermochemical technologies, such as pyrolysis, offer a potentially scalable pathway for upcycling diverse types of plastic waste (PW) into value-added chemicals. However, deploying these technologies in waste management infrastructures is not straightforward because such systems involve a wide range of interdependent stakeholders, processing facilities, and products. In this work, we present a holistic optimization framework that integrates value-chain analysis, techno-economic analysis, and life-cycle analysis for investigating the economic viability and environmental benefits of upcycling infrastructures that collect, sort, clean, and process post-consumer PW for producing virgin polymer resins. The framework is applied to a case study in the upper Midwest region of the US. Our analysis reveals that the infrastructures are economically viable and could activate a regional circular economy that generates over 1 billion USD in annual profit. Moreover, our analysis reveals that this economy can reduce the carbon footprint of PW incineration by half. Our framework also determines the inherent values of post-consumer PW and of derived products such as plastic bales and pyrolysis oil; we find that, in these infrastructures, PW becomes a highly valuable feedstock with a market value of 500 USD/tonne. We discuss how this market value can generate incentives that foster more effective waste pre-sorting practices by consumers that can help bypass material recycling facilities and increase total system profit."},{"id":"2023-elucidating-molecular-scale-principles-governing-the","title":"Elucidating Molecular-Scale Principles Governing the Anchoring of Liquid Crystal Mixtures on Solid Surfaces","year":2023,"type":"journal","venue":"ACS Nano","topics":["molecular-sensing"],"authors":["Jake I. Gold","Jonathan K. Sheavly","Nanqi Bao","Huaizhe Yu","Juriti Rajbangshi","James Jay Schauer","Ví­ctor M. Zavala","Nicholas Lawrence Abbott","Reid C. Van Lehn","Manos Mavrikakis"],"authorKeys":["j-gold","j-sheavly","n-bao","h-yu","j-rajbangshi","j-schauer","v-zavala","n-abbott","r-lehn","m-mavrikakis"],"doi":"10.1021/acsnano.3c06735","preprint":null,"url":"https://doi.org/10.1021/acsnano.3c06735","pdf":null,"citations":9,"abstract":"Computational chemistry calculations are broadly useful for guiding the atom-scale design of hard–soft material interfaces including how molecular interactions of single-component liquid crystals (LCs) at inorganic surfaces lead to preferred orientations of the LC far from the surface. The majority of LCs, however, are not single-component phases but comprise of mixtures, such as a mixture of mesogens, added to provide additional functions such as responsiveness to the presence of targeted organic compounds (for chemical sensing). In such LC mixtures, little is understood about the near-surface composition and organization of molecules and how that organization propagates into the far-field LC orientation. Here, we address this broad question by using a multiscale computational approach that combines density functional theory (DFT)-based calculations and classical molecular dynamics (MD) simulations to predict the interfacial composition and organization of a binary LC mixture of 4′-cyano-4-biphenylcarbolxylic acid (CBCA) and 4′- n -pentyl-4-biphenylcarbonitrile (5CB) supported on anatase (101) titania surfaces. DFT calculations determine the surface composition and atomic-scale organization of CBCA and 5CB at the titania surface, and classical MD simulations build upon the DFT description to describe the evolution of the near-surface order into the bulk LC. A surprising finding is that the 5CB and CBCA molecules adopt orthogonal orientations at the anatase surface and that, above a threshold concentration of CBCA, this mixture of orientations evolves away from the surface to define a uniform far-field homeotropic orientation. These results demonstrate that molecular-level knowledge achieved through a combination of computational techniques permits the design and understanding of functional LC mixtures at interfaces."},{"id":"2023-exploiting-electricity-market-dynamics-using-flexible","title":"Exploiting electricity market dynamics using flexible electrolysis units for retrofitting methanol synthesis","year":2023,"type":"journal","venue":"Energy & Environmental Science","topics":["energy-systems","markets-decisions"],"authors":["Jiaze Ma","Michael Rebarchik","Saurabh Bhandari","Manos Mavrikakis","George W. Huber","Ví­ctor M. Zavala"],"authorKeys":["lab:jiaze-ma","m-rebarchik","s-bhandari","m-mavrikakis","g-huber","v-zavala"],"doi":"10.1039/d3ee00568b","preprint":"https://doi.org/10.26434/chemrxiv-2023-fx947","url":"https://doi.org/10.1039/d3ee00568b","pdf":"https://chemrxiv.org/engage/api-gateway/chemrxiv/assets/orp/resource/item/640b3bfd7290f69f8ec25c00/original/exploiting-electricity-market-dynamics-using-flexible-electrolysis-units-for-retrofitting-methanol-synthesis.pdf","citations":25,"abstract":"Exploiting the dynamics of electricity markets can make hydrogen production cost-competitive and this can lead to viable alternatives to electrify methanol production."},{"id":"2023-exploiting-gpu-simd-architectures-for-solving","title":"Exploiting GPU/SIMD Architectures for Solving Linear-Quadratic MPC Problems","year":2023,"type":"conference","venue":"Proceedings of the ... American Control Conference/Proceedings of the American Control Conference","topics":["control","optimization-algorithms"],"authors":["David Cole","Sungho Shin","François Pacaud","Ví­ctor M. Zavala","Mihai Anitescu"],"authorKeys":["lab:david-cole","lab:sungho-shin","f-pacaud","v-zavala","m-anitescu"],"doi":"10.23919/acc55779.2023.10155791","preprint":"https://arxiv.org/abs/2209.13049","url":"https://ieeexplore.ieee.org/document/10155791","pdf":"https://arxiv.org/pdf/2209.13049","citations":7,"abstract":"We report numerical results on solving linear-quadratic model predictive control (MPC) problems by exploiting graphics processing units (GPUs). The presented method reduces the MPC problem by eliminating the state variables and applies a condensed-space interior-point method to remove the inequality constraints in the KKT system. The final condensed matrix is positive definite and can be efficiently factorized in parallel on GPU/SIMD architectures. In addition, the size of the condensed matrix depends only on the number of controls in the problem, rendering the method particularly effective when the problem has many states but few inputs and moderate horizon length. Our numerical results for PDE-constrained problems show that the approach is an order of magnitude faster than a standard CPU implementation. We also provide an open-source Julia framework that facilitates modeling (DynamicNLPModels.jl) and solution (MadNLP.jl) of MPC problems on GPUs."},{"id":"2023-hierarchical-graph-modeling-for-multi-scale","title":"Hierarchical Graph Modeling for Multi-Scale Optimization of Power Systems","year":2023,"type":"chapter-report","venue":"arXiv (Cornell University)","topics":["graph-modeling","energy-systems"],"authors":["David L. Cole","Harsha Gangammanavar","Ví­ctor M. Zavala"],"authorKeys":["lab:david-cole","h-gangammanavar","v-zavala"],"doi":"10.48550/arXiv.2309.10568","preprint":null,"url":"https://arxiv.org/abs/2309.10568","pdf":"https://arxiv.org/pdf/2309.10568","citations":0,"abstract":"Hierarchical optimization architectures are used in power systems to manage disturbances and phenomena that arise at multiple spatial and temporal scales. We present a graph modeling abstraction for representing such architectures and an implementation in the ${\\tt Julia}$ package ${\\tt Plasmo.jl}$. We apply this framework to a tri-level hierarchical framework arising in wholesale market operations that involves day-ahead unit commitment, short-term unit commitment, and economic dispatch. We show that graph abstractions facilitate the construction, visualization, and solution of these complex problems."},{"id":"2022-high-purity-polypropylene-from-disposable-face","title":"High-purity Polypropylene from Disposable Face Masks via Solvent-Targeted Recovery and Precipitation","year":2023,"type":"journal","venue":"Green Chemistry","topics":["plastics"],"authors":["Jiuling Yu","Aurora del Carmen Munguía-López","Victor Sanfins Cecon","Kevin L. Sánchez-Rivera","Kevin Nelson","Jiayang Wu","Shreyas S. Kolapkar","Ví­ctor M. Zavala","Greg W. Curtzwiler","Keith Vorst","Ezra Bar-Ziv","George W. Huber"],"authorKeys":["j-yu","lab:aurora-munguia","v-cecon","k-sanchez","k-nelson","j-wu","s-kolapkar","v-zavala","g-curtzwiler","k-vorst","e-bar","g-huber"],"doi":"10.1039/d3gc00205e","preprint":null,"url":"https://pubs.rsc.org/en/Content/ArticleLanding/2023/GC/D3GC00205E","pdf":"https://www.osti.gov/servlets/purl/1975230","citations":37,"abstract":"The high-purity polypropylene could be produced from the waste disposable face masks via an efficient solvent-targeted recovery and precipitation (STRAP) method, combined with a simple decolorization step."},{"id":"2023-hydroformylation-of-pyrolysis-oils-to-aldehydes","title":"Hydroformylation of pyrolysis oils to aldehydes and alcohols from polyolefin waste","year":2023,"type":"journal","venue":"Science","topics":["plastics"],"authors":["Houqian Li","Jiayang Wu","Zhen Wei Jiang","Jiaze Ma","Ví­ctor M. Zavala","Clark R. Landis","Manos Mavrikakis","George W. Huber"],"authorKeys":["h-li","j-wu","z-jiang","lab:jiaze-ma","v-zavala","c-landis","m-mavrikakis","g-huber"],"doi":"10.1126/science.adh1853","preprint":null,"url":"https://doi.org/10.1126/science.adh1853","pdf":null,"citations":195,"abstract":"Waste plastics are an abundant feedstock for the production of renewable chemicals. Pyrolysis of waste plastics produces pyrolysis oils with high concentrations of olefins (>50 weight %). The traditional petrochemical industry uses several energy-intensive steps to produce olefins from fossil feedstocks such as naphtha, natural gas, and crude oil. In this work, we demonstrate that pyrolysis oil can be used to produce aldehydes through hydroformylation, taking advantage of the olefin functionality. These aldehydes can then be reduced to mono- and dialcohols, oxidized to mono- and dicarboxylic acids, or aminated to mono- and diamines by using homogeneous and heterogeneous catalysis. This route produces high-value oxygenated chemicals from low-value postconsumer recycled polyethylene. We project that the chemicals produced by this route could lower greenhouse gas emissions ~60% compared with their production through petroleum feedstocks."},{"id":"2023-integrating-a-tailored-recurrent-neural-network","title":"Integrating a tailored recurrent neural network with Bayesian experimental design to optimize microbial community functions","year":2023,"type":"journal","venue":"PLoS Computational Biology","topics":["biological-systems","machine-learning","bayesian-optimization"],"authors":["Jaron C. Thompson","Ví­ctor M. Zavala","Ophelia S. Venturelli"],"authorKeys":["lab:jaron-thompson","v-zavala","o-venturelli"],"doi":"10.1371/journal.pcbi.1011436","preprint":"https://www.biorxiv.org/content/biorxiv/early/2022/11/15/2022.11.12.516271.full.pdf","url":"https://doi.org/10.1371/journal.pcbi.1011436","pdf":"https://journals.plos.org/ploscompbiol/article/file?id=10.1371/journal.pcbi.1011436&type=printable","citations":53,"abstract":"Abstract Microbiomes interact dynamically with their environment to perform exploitable functions such as production of valuable metabolites and degradation of toxic metabolites for a wide range of applications in human health, agriculture, and environmental cleanup. Developing computational models to predict the key bacterial species and environmental factors to build and optimize such functions are crucial to accelerate microbial community engineering. However, there is an unknown web of interactions that determine the highly complex and dynamic behaviors of these systems, which precludes the development of models based on known mechanisms. By contrast, entirely data-driven machine learning models can produce physically unrealistic predictions and often require significant amounts of experimental data to learn system behavior. We develop a physically constrained recurrent neural network that preserves model flexibility but is constrained to produce physically consistent predictions and show that it outperforms existing machine learning methods in the prediction of experimentally measured species abundance and metabolite concentrations. Further, we present an experimental design algorithm to select a set of experimental conditions that simultaneously maximize the expected gain in information and target microbial community functions. Using a bioreactor case study, we demonstrate how the proposed framework can be used to efficiently navigate a large design space to identify optimal operating conditions. The proposed methodology offers a flexible machine learning approach specifically tailored to optimize microbiome target functions through the sequential design of informative experiments that seek to explore and exploit community functions. 1 Author summary The functions performed by microbiomes hold tremendous promise to address grand challenges facing society ranging from improving human health to promoting plant growth. To design their properties, flexible computational models that can predict the temporally changing behaviors of microbiomes in response to key environmental parameters are needed. When considering bottom-up design of microbiomes, the number of possible communities grows exponentially with the number of organisms and environmental factors, which makes it challenging to navigate the microbiome function landscape. To overcome these challenges, we present a physically constrained machine learning model for microbiomes and a Bayesian experimental design framework to efficiently navigate the space of possible communities and environmental factors."},{"id":"2023-kinetic-modeling-and-parameter-estimation-of","title":"Kinetic modeling and parameter estimation of a prebiotic peptide reaction network","year":2023,"type":"journal","venue":"Journal of Molecular Evolution","topics":["molecular-sensing"],"authors":["Hayley Boigenzahn","Leonardo D. González","Jaron C. Thompson","Ví­ctor M. Zavala","John Yin"],"authorKeys":["h-boigenzahn","lab:leo-gonzalez","lab:jaron-thompson","v-zavala","j-yin"],"doi":"10.1007/s00239-023-10132-1","preprint":null,"url":"https://doi.org/10.1007/s00239-023-10132-1","pdf":null,"citations":2,"abstract":null},{"id":"2023-multi-site-multi-pollutant-atmospheric-data","title":"Multi-site, multi-pollutant atmospheric data analysis using Riemannian geometry","year":2023,"type":"journal","venue":"The Science of The Total Environment","topics":["topology-geometry"],"authors":["Alexander D. S. Smith","Jinxi Hua","B. de Foy","James Jay Schauer","Ví­ctor M. Zavala"],"authorKeys":["lab:alexander-smith","j-hua","b-foy","j-schauer","v-zavala"],"doi":"10.1016/j.scitotenv.2023.164064","preprint":null,"url":"https://www.sciencedirect.com/science/article/pii/S0048969723026852?casa_token=DfPGVTeorgMAAAAA:26MgkzFSvG4XNz1POOxixx44naU6Da5toRVhWLOXxxUz0ljGSjIvq7oSMs0_SAZ1rCSYsCIpruQ","pdf":"https://doi.org/10.1016/j.scitotenv.2023.164064","citations":8,"abstract":null},{"id":"2023-municipal-solid-waste-management-using-a","title":"Municipal Solid Waste Management Using a Coordinated Market Framework","year":2023,"type":"conference","venue":"Proceedings of FOCAPO/CPC 2023","topics":["waste-nutrients","markets-decisions"],"authors":["A.C. Munguía-López","V.M. Zavala","J.M Ponce-Ortega"],"authorKeys":["lab:aurora-munguia","v-zavala","j-ponce"],"doi":null,"preprint":null,"url":"https://drive.google.com/file/d/1Qyqc1hHOmFwq2iD1PgCSbpZgTNuCByIO/view?usp=sharing","pdf":null,"citations":null,"abstract":null},{"id":"2023-new-paradigms-for-exploiting-parallel-experiments","title":"New paradigms for exploiting parallel experiments in Bayesian optimization","year":2023,"type":"journal","venue":"Computers & Chemical Engineering","topics":["bayesian-optimization"],"authors":["Leonardo D. González","Ví­ctor M. Zavala"],"authorKeys":["lab:leo-gonzalez","v-zavala"],"doi":"10.1016/j.compchemeng.2022.108110","preprint":"https://arxiv.org/abs/2210.01071","url":"https://arxiv.org/abs/2210.01071","pdf":"https://arxiv.org/pdf/2210.01071","citations":46,"abstract":null},{"id":"2023-outlook-how-i-learned-to-love","title":"Outlook: How I Learned to Love Machine Learning (A Personal Perspective on Machine Learning in Process Systems Engineering)","year":2023,"type":"journal","venue":"Industrial & Engineering Chemistry Research","topics":["machine-learning","education"],"authors":["Ví­ctor M. Zavala"],"authorKeys":["v-zavala"],"doi":"10.1021/acs.iecr.3c01565","preprint":null,"url":"https://doi.org/10.1021/acs.iecr.3c01565","pdf":"https://pubs.acs.org/doi/pdf/10.1021/acs.iecr.3c01565","citations":12,"abstract":"ADVERTISEMENT RETURN TO ISSUEPREVCommentaryNEXTOutlook: How I Learned to Love Machine Learning (A Personal Per istry,Mathematical methods,Neural networks,Optimization Get e-Alerts"},{"id":"2023-pricing-and-remunerating-load-shifting-flexibility","title":"Pricing and Remunerating Load Shifting Flexibility in Electricity Markets","year":2023,"type":"conference","venue":"Proceedings of FOCAPO/CPC 2023","topics":["energy-systems","markets-decisions"],"authors":["W. Zhang","V.M Zavala"],"authorKeys":["lab:weiqi-zhang","v-zavala"],"doi":null,"preprint":null,"url":"https://drive.google.com/file/d/1MonrQIh6okpFQIBsmuBoxERp7H0kfXcQ/view?usp=share_link","pdf":null,"citations":null,"abstract":null},{"id":"2023-quantifying-space-time-load-shifting-flexibility","title":"Quantifying space-time load shifting flexibility in electricity markets","year":2023,"type":"journal","venue":"Computers & Chemical Engineering","topics":["energy-systems","markets-decisions"],"authors":["Weiqi Zhang","Ví­ctor M. Zavala"],"authorKeys":["lab:weiqi-zhang","v-zavala"],"doi":"10.1016/j.compchemeng.2023.108338","preprint":"https://arxiv.org/abs/2303.10217","url":"https://arxiv.org/abs/2303.10217","pdf":"https://doi.org/10.1016/j.compchemeng.2023.108338","citations":11,"abstract":null},{"id":"2022-quantifying-the-environmental-benefits-of-a","title":"Quantifying the Environmental Benefits of a Solvent-Based Separation Process for Multilayer Plastic Films","year":2023,"type":"journal","venue":"Green Chemistry","topics":["plastics"],"authors":["Aurora del Carmen Munguía-López","Dilara Göreke","Kevin L. Sánchez-Rivera","Horacio A. Aguirre-Villegas","Styliani Avraamidou","George W. Huber","Ví­ctor M. Zavala"],"authorKeys":["lab:aurora-munguia","lab:dilara-goreke","k-sanchez","h-aguirre","s-avraamidou","g-huber","v-zavala"],"doi":"10.1039/d2gc04262b","preprint":"https://doi.org/10.26434/chemrxiv-2022-r7f08","url":"https://pubs.rsc.org/en/content/articlelanding/2023/gc/d2gc04262b","pdf":"https://chemrxiv.org/engage/api-gateway/chemrxiv/assets/orp/resource/item/636ecf1fdeff977694e1259c/original/quantifying-the-environmental-benefits-of-a-solvent-based-separation-process-for-multilayer-plastic-films.pdf","citations":59,"abstract":"Food packaging often appears in the form of multilayer (ML) plastic films, which leverage the functional properties of different polymers to achieve specific food protection goals (e.g., oxygen, water, and temperature barriers). These properties are essential to enable long shelf lives, reduce refrigeration usage, mitigate food waste, and increase food accessibility. However, ML f film production processes generate large amounts of plastic waste that cannot be mechanically recycled. Recently, we have proposed a process, which we call solvent-targeted recovery and precipitation (STRAP), that enables the separation and recycling of the constituent polymers of ML films. This technology uses a series of solvent washes that selectively dissolve and precipitate target polymers. Quantifying the environmental benefits of STRAP over virgin resin production is essential for the commercial deployment of this technology. This work uses life cycle assessment (LCA) methods to evaluate these impacts in terms of carbon footprint, energy use, water use, and toxicity. We analyze three STRAP process variants that use anti-solvent and temperature-driven precipitation and that target different types of ML films. Our analysis reveals that a couple of STRAP process variants can provide environmental benefits over virgin film production and also provides valuable insight into the key components of ML films and of the STRAP process that are responsible for the highest impacts. Ultimately, we believe that the proposed analysis framework can lead to the design of more environmentally-friendly ML films and recycling processes."},{"id":"2023-recycling-of-a-post-industrial-printed","title":"Recycling of a post-industrial printed multilayer plastic film containing polyurethane inks by solvent-targeted recovery and precipitation","year":2023,"type":"journal","venue":"Resources Conservation and Recycling","topics":["plastics"],"authors":["Kevin L. Sánchez-Rivera","Aurora del Carmen Munguía-López","Panzheng Zhou","Victor Sanfins Cecon","Jiuling Yu","Kevin Nelson","Daniel L. Miller","Steve Grey","Zhuo Xu","Ezra Bar-Ziv","Keith Vorst","Greg W. Curtzwiler","Reid C. Van Lehn","Ví­ctor M. Zavala","George W. Huber"],"authorKeys":["k-sanchez","lab:aurora-munguia","p-zhou","v-cecon","j-yu","k-nelson","d-miller","s-grey","z-xu","e-bar","k-vorst","g-curtzwiler","r-lehn","v-zavala","g-huber"],"doi":"10.1016/j.resconrec.2023.107086","preprint":null,"url":"https://www.sciencedirect.com/science/article/pii/S0921344923002227","pdf":"https://doi.org/10.1016/j.resconrec.2023.107086","citations":66,"abstract":null},{"id":"2023-scalable-extraction-of-information-from-spatio","title":"Scalable Extraction of Information from Spatio-Temporal Patterns of Chemoresponsive Liquid Crystals Using Topological Data Analysis","year":2023,"type":"journal","venue":"The Journal of Physical Chemistry C","topics":["topology-geometry","molecular-sensing"],"authors":["Shengli Jiang","Nanqi Bao","Alexander D. S. Smith","Shraddha Byndoor","Reid C. Van Lehn","Manos Mavrikakis","Nicholas Lawrence Abbott","Ví­ctor M. Zavala"],"authorKeys":["lab:shengli-jiang","n-bao","lab:alexander-smith","s-byndoor","r-lehn","m-mavrikakis","n-abbott","v-zavala"],"doi":"10.1021/acs.jpcc.3c03076","preprint":"https://doi.org/10.26434/chemrxiv-2023-fjcxd","url":"https://chemrxiv.org/engage/undefined/article-details/644ac2cc80f4b75b5337ce4e","pdf":"https://chemrxiv.org/engage/api-gateway/chemrxiv/assets/orp/resource/item/6444443983fa35f8f6157069/original/scalable-extraction-of-information-from-spatio-temporal-patterns-of-chemoresponsive-liquid-crystals-using-topological-descriptors.pdf","citations":8,"abstract":"Chemoresponsive liquid crystals (LCs) can be engineered to generate information-rich optical responses (in the form of space-time color and brightness patterns) when exposed to target gas contaminants. We investigate the use of topological descriptors (Euler characteristic, lacunarity, and fractal dimension) for extracting different types of information from these complex optical responses and show that these tools can enable the design of sensors and help gain insights into physical phenomena governing sensor responses. We provide a holistic perspective of topological descriptors using theory of Minkowski functionals and fractal analysis, which allows us to understand specific information that each descriptor extracts. We also show how to use the topological descriptors in conjunction with space-time filtration operations and color representations to enrich the information extracted. We demonstrate how these capabilities can be used in flexible ways to facilitate unsupervised machine learning (ML) tasks (clustering and visualization) and supervised tasks (regression and classification). We demonstrate the developments using real, high-throughput experimental datasets for functionalized LC films that are exposed to different gaseous environments. We show that the topological descriptors encode significant information and can be used to detect outliers in high-throughput data and visualize the temporal evolution of topology. Moreover, we show that the topological descriptors can be used to predict contaminant concentrations using simple ML models such as support vector machines; notably, these ML models can achieve comparable accuracies to those of powerful convolutional neural networks but with a much lower computational cost (from hours to seconds) and using less sophisticated computing hardware (CPUs instead of GPUs). This scalability enables the analysis of space-time data at high resolutions."},{"id":"nd-techno-economic-and-life-cycle-assessment","title":"Techno-Economic and life cycle assessment of standalone Single-Stream material recovery facilities in the United states","year":2023,"type":"journal","venue":"Waste Management","topics":["plastics","waste-nutrients"],"authors":["Olumide O. Olafasakin","Jiaze Ma","Sabrina L. Bradshaw","Horacio A. Aguirre-Villegas","Craig H. Benson","George W. Huber","Ví­ctor M. Zavala","Mark Mba Wright"],"authorKeys":["o-olafasakin","lab:jiaze-ma","s-bradshaw","h-aguirre","c-benson","g-huber","v-zavala","m-wright"],"doi":"10.1016/j.wasman.2023.05.011","preprint":null,"url":"https://doi.org/10.1016/j.wasman.2023.05.011","pdf":"https://doi.org/10.1016/j.wasman.2023.05.011","citations":38,"abstract":null},{"id":"2023-techno-economic-evaluation-of-infrastructures-for","title":"Techno-Economic Evaluation of Infrastructures for Thermochemical Upcycling of Plastic Waste","year":2023,"type":"conference","venue":"Proceedings of FOCAPO/CPC 2023","topics":["plastics"],"authors":["J. Ma","P. Tominac","V.M Zavala"],"authorKeys":["lab:jiaze-ma","lab:philip-tominac","v-zavala"],"doi":null,"preprint":null,"url":null,"pdf":null,"citations":null,"abstract":null},{"id":"2023-topological-analysis-of-molecular-dynamics-simulations","title":"Topological Analysis of Molecular Dynamics Simulations using the Euler Characteristic","year":2023,"type":"journal","venue":"Journal of Chemical Theory and Computation","topics":["topology-geometry","molecular-sensing"],"authors":["Alexander D. S. Smith","Spencer Runde","Alex K. Chew","Atharva Kelkar","Utkarsh Maheshwari","Reid C. Van Lehn","Ví­ctor M. Zavala"],"authorKeys":["lab:alexander-smith","s-runde","a-chew","a-kelkar","u-maheshwari","r-lehn","v-zavala"],"doi":"10.1021/acs.jctc.2c00766","preprint":"https://doi.org/10.26434/chemrxiv-2022-6w101","url":"https://chemrxiv.org/engage/chemrxiv/article-details/62d465e63787f1aa6eb9f2e1","pdf":"https://chemrxiv.org/engage/api-gateway/chemrxiv/assets/orp/resource/item/62d465e63787f1aa6eb9f2e1/original/topological-analysis-of-molecular-dynamics-simulations-using-the-euler-characteristic.pdf","citations":20,"abstract":"Molecular dynamics (MD) simulations are used in diverse scientific and engineering fields such as drug discovery, materials design, separations, biological systems, and reaction engineering. These simulations generate highly complex data sets that capture the 3D spatial positions, dynamics, and interactions of thousands of molecules. Analyzing MD data sets is key for understanding and predicting emergent phenomena and in identifying key drivers and tuning design knobs of such phenomena. In this work, we show that the Euler characteristic (EC) provides an effective topological descriptor that facilitates MD analysis. The EC is a versatile, low-dimensional, and easy-to-interpret descriptor that can be used to reduce, analyze, and quantify complex data objects that are represented as graphs/networks, manifolds/functions, and point clouds. Specifically, we show that the EC is an informative descriptor that can be used for machine learning and data analysis tasks such as classification, visualization, and regression. We demonstrate the benefits of the proposed approach through case studies that aim to understand and predict the hydrophobicity of self-assembled monolayers and the reactivity of complex solvent environments."},{"id":"2023-viscoelastic-behavior-prediction-of-natural-rubber","title":"Viscoelastic behavior prediction of natural rubber blends via machine learning and its application for reverse engineering materials","year":2023,"type":"conference","venue":"AIP conference proceedings","topics":["machine-learning","molecular-sensing"],"authors":["Allen Jonathan Román","Shiyi Qin","Julio C. Rodríguez","Ví­ctor M. Zavala","Tim Andreas Osswald"],"authorKeys":["a-roman","lab:amy-qin","j-rodriguez","v-zavala","t-osswald"],"doi":"10.1063/5.0168411","preprint":null,"url":"https://doi.org/10.1063/5.0168411","pdf":null,"citations":2,"abstract":null},{"id":"2022-a-dynamic-penalty-approach-to-state","title":"A dynamic penalty approach to state constraint handling in deep reinforcement learning","year":2022,"type":"journal","venue":"Journal of Process Control","topics":["machine-learning","control"],"authors":["Haeun Yoo","Ví­ctor M. Zavala","Jay H. Lee"],"authorKeys":["lab:hani-yoo","v-zavala","j-lee"],"doi":"10.1016/j.jprocont.2022.05.004","preprint":null,"url":"https://doi.org/10.1016/j.jprocont.2022.05.004","pdf":null,"citations":19,"abstract":null},{"id":"2022-a-graph-based-modeling-abstraction-for","title":"A graph-based modeling abstraction for optimization: Concepts and implementation in plasmo.jl","year":2022,"type":"journal","venue":"Mathematical Programming Computation","topics":["graph-modeling","software"],"authors":["Jordan Jalving","Sungho Shin","Ví­ctor M. Zavala"],"authorKeys":["lab:jordan-jalving","lab:sungho-shin","v-zavala"],"doi":"10.1007/s12532-022-00223-3","preprint":"https://arxiv.org/abs/2006.05378","url":"https://arxiv.org/abs/2006.05378","pdf":"https://arxiv.org/pdf/2006.05378","citations":27,"abstract":null},{"id":"2022-a-julia-framework-for-graph-structured","title":"A Julia Framework for Graph-Structured Nonlinear Optimization","year":2022,"type":"journal","venue":"Industrial & Engineering Chemistry Research","topics":["software","graph-modeling","optimization-algorithms"],"authors":["David L. Cole","Sungho Shin","Ví­ctor M. Zavala"],"authorKeys":["lab:david-cole","lab:sungho-shin","v-zavala"],"doi":"10.1021/acs.iecr.2c01253","preprint":"https://arxiv.org/abs/2204.05264","url":"https://pubs.acs.org/doi/10.1021/acs.iecr.2c01253","pdf":"https://arxiv.org/pdf/2204.05264","citations":2,"abstract":"Graph theory provides a convenient framework for modeling and solving structured optimization problems. Under this framework, the modeler can arrange/assemble the components of an optimization model (variables, constraints, objective functions, and data) within nodes and edges of a graph, and this representation can be used to visualize, manipulate, and solve the problem. In this work, we present a Julia framework for modeling and solving graph-structured nonlinear optimization problems. Our framework integrates the modeli
