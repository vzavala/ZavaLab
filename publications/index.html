i","j-paulson","j-qiao","m-rivera","k-sahu","l-sarkisov","z-smith","c-tsay","c-wen","v-zavala","h-zhang","d-zhao"],"doi":"10.1021/acs.iecr.6c01806","preprint":"https://arxiv.org/abs/2610.02014","url":"https://doi.org/10.1021/acs.iecr.6c01806","pdf":"https://arxiv.org/pdf/2610.02014","citations":0,"abstract":"Abstract The rapid maturation of artificial intelligence (AI) and machine learning (ML) has catalyzed a profound shift in how chemical engineering problems are formulated, analyzed, and solved. Advances in computing, data availability, and learning algorithms have enabled AI/ML methods to impact applications spanning atomic-scale simulations, materials and catalyst discovery, transport and thermodynamics, separations, process systems engineering, and industrial operations. This Perspective provides an account of recent methodological developments and representative applications, emphasizing how AI/ML tools are being integrated with first-principles models to address challenges of predictive accuracy, data scarcity, extrapolation, interpretability, and model life cycle management. Across domains, a unifying trend is the move away from purely black-box approaches toward hybrid and physics-informed frameworks that explicitly respect conservation laws, thermodynamic consistency, and known structural constraints. These approaches not only improve robustness and reliability but also enable meaningful human–AI collaboration by providing information at an appropriate level of abstraction for the task and decision context. We conclude that AI and ML are not replacing the core principles of chemical engineering; rather, they are amplifying them. As the field advances toward increasingly autonomous, adaptive, and sustainable systems, the thoughtful integration of AI/ML with first-principles understanding and domain expertise will be essential to realizing their full potential across both research and industrial practice."},{"id":"2026-biomass-demineralization-a-critical-need-for","title":"Biomass Demineralization: A Critical Need for Future Biorefineries","year":2026,"type":"journal","venue":"Chemical Reviews","topics":["waste-nutrients","education"],"authors":["Leoncio Santiago-Martínez","Styliani Avraamidou","Alejandro Ayala-Cortés","RU Azike","Santanu Bakshi","Chumki Banik","Ezra Bar-Ziv","Emmanuel Canales","Torren R. Carlson","James A. Dumesic","Jordan Lee Klinger","Jung Min Lee","Fei Long","Armando Gabriel McDonald","Sonali Mohapatra","Rebecca Garlock Ong","Luisiana Fabiola Palomo González","Xuejun Pan","Nepu Saha","Marco A. Sánchez-Castillo","Sandip K. Singh","Charles M. Sorensen","Bala Subramaniam","Meng-Lin Tsai","Reid C. Van Lehn","Wenjia Wang","Ví­ctor M. Zavala","George W. Huber"],"authorKeys":["l-santiago","s-avraamidou","lab:alejandro-ayala","r-azike","s-bakshi","c-banik","e-bar","e-canales","t-carlson","j-dumesic","j-klinger","j-lee","f-long","a-mcdonald","s-mohapatra","r-ong","l-gonzalez","x-pan","n-saha","m-sanchez","s-singh","c-sorensen","b-subramaniam","m-tsai","r-lehn","w-wang","v-zavala","g-huber"],"doi":"10.1021/acs.chemrev.5c00784","preprint":null,"url":"https://doi.org/10.1021/acs.chemrev.5c00784","pdf":"https://doi.org/10.1021/acs.chemrev.5c00784","citations":16,"abstract":"Biomass contains up to 14 essential elements that serve as nutrients for plant growth and development, including photosynthesis and enzyme functionalities. These elements in different chemical forms (e.g., minerals) constitute the inorganic fraction of biomass and can cause operational issues in thermal and biochemical biomass conversion technologies. In biomass gasification and pyrolysis processes, for instance, inorganics can cause fouling, tar formation, and corrosion. In catalytic and biochemical processes, inorganics can poison catalysts, alter biochemical pathways, and modify product yields and selectivity. This review provides an overview of the inorganic content in biomass feedstocks, the critical role inorganics play in plant biochemistry, the effect that inorganics have in various thermochemical and biochemical biomass conversion technologies, and different approaches to remove them from biomass. We provide recommendations for future research, focusing on developing technologies to effectively remove inorganics from biomass, using the inorganics to improve soil quality and for alternative applications, and designing biorefineries to convert demineralized biomass obtained from diverse sources."},{"id":"2025-graph-based-modeling-and-decomposition-of","title":"Graph-based modeling and decomposition of hierarchical optimization problems","year":2026,"type":"journal","venue":"Mathematical Programming Computation","topics":["graph-modeling","optimization-algorithms"],"authors":["David L. Cole","Filippo Pecci","Omar J. Guerra","Harsha Gangammanavar","Jesse Jenkins","Ví­ctor M. Zavala"],"authorKeys":["lab:david-cole","f-pecci","o-guerra","h-gangammanavar","j-jenkins","v-zavala"],"doi":"10.1007/s12532-026-00315-4","preprint":"https://arxiv.org/abs/2501.02098","url":"https://doi.org/10.1007/s12532-026-00315-4","pdf":"https://link.springer.com/content/pdf/10.1007/s12532-026-00315-4.pdf","citations":2,"abstract":"Abstract We present a graph-theoretic modeling approach for hierarchical optimization that leverages the OptiGraph abstraction implemented in the package . We show that the abstraction is flexible and can effectively capture complex hierarchical connectivity that arises from decision-making over multiple spatial and temporal scales (e.g., integration of planning, scheduling, and operations in manufacturing and infrastructures). We also show that the graph abstraction facilitates the conceptualization and implementation of decomposition and approximation schemes. Specifically, we propose a graph-based Benders decomposition (gBD) framework that enables the exploitation of hierarchical (nested) structures and that uses graph aggregation/partitioning procedures to discover such structures. In addition, we provide a implementation of gBD, which we call . We illustrate the capabilities using examples arising in the context of energy and power systems."},{"id":"2026-identifying-the-impact-of-chemical-functional","title":"Identifying the impact of chemical functional groups on ionic liquid conductivity","year":2026,"type":"journal","venue":"Chemical Science","topics":["molecular-sensing","machine-learning"],"authors":["J. E. Umaña","N. A. Zawicki","Matthew A. Gebbie","Ví­ctor M. Zavala","Rose K. Cersonsky"],"authorKeys":["lab:emmy-umana","n-zawicki","m-gebbie","v-zavala","r-cersonsky"],"doi":"10.1039/d6sc02121b","preprint":"https://doi.org/10.26434/chemrxiv.15000903/v1","url":"https://doi.org/10.1039/d6sc02121b","pdf":"https://pubs.rsc.org/en/content/articlepdf/2026/sc/d6sc02121b","citations":1,"abstract":"Ionic liquids are non-flammable, electrochemically stable electrolytes with promise as next-generation battery electrolytes. However, strong ion correlations and deviations from classical ion transport prevent the predictive design of application-specific ionic liquid electrolytes. While machine learning models can help address such limitations, standard cheminformatics tools are not well-suited to incorporate electrostatic interactions and thus do not account for the strong intermolecular interactions within ionic liquid materials. In this work, we present a molecular fragment representation that reflects charge-carrier resonance using SMARTS molecular substructure searching to explicitly capture the electrostatic contributions to conductivity of ionic liquid compounds. We find that this representation simplifies structure-conductivity relationships and improves predictive performance in low-data regimes. Additionally, we report how learned contributions of molecular structure impact ion transport and map the ionic liquid chemical design space using principal covariates regression to visualize the underlying structure-property relationships. We find that charge delocalization and anion flexibility are the most influential molecular features in improving ion transport in single-component ionic liquids. Further, we find that polar, alkyl, and fluorinated cation or anion functionalization decrease ion transport by introducing additional intermolecular interactions. Finally, many cation charge centers similarly enhance ion transport, suggesting that ionic liquid anions and ion functionalization are key for tuning intermolecular interactions and ion mobility. This work provides an interpretable approach for building structure-property relationships for currently available ionic liquid structures and opens new perspectives on how to design ionic liquids for desirable transport behavior. All data and models are shared as open-source code."},{"id":"2026-modular-electrochemical-synthesis-for-flexible-chemical","title":"Modular electrochemical synthesis for flexible chemical manufacturing","year":2026,"type":"journal","venue":"Nature Chemical Engineering","topics":["energy-systems","education"],"authors":["Rui Wang","Katelyn H. Michael","Paul J. A. Kenis","Ví­ctor M. Zavala","Song Jin"],"authorKeys":["r-wang","k-michael","p-kenis","v-zavala","s-jin"],"doi":"10.1038/s44286-026-00364-5","preprint":null,"url":"https://doi.org/10.1038/s44286-026-00364-5","pdf":null,"citations":2,"abstract":null},{"id":"2026-navigating-large-chemical-spaces-using-graph","title":"Navigating Large Chemical Spaces Using Graph Theory and Integer Programming","year":2026,"type":"journal","venue":"Journal of Chemical Information and Modeling","topics":["graph-modeling","molecular-sensing","optimization-algorithms"],"authors":["Ugochukwu M. Ikegwu","Reid C. Van Lehn","Ví­ctor M. Zavala"],"authorKeys":["lab:ugochukwu-ikegwu","r-lehn","v-zavala"],"doi":"10.1021/acs.jcim.6c01810","preprint":"https://doi.org/10.26434/chemrxiv.15004256/v1","url":"https://doi.org/10.1021/acs.jcim.6c01810","pdf":"https://doi.org/10.1021/acs.jcim.6c01810","citations":0,"abstract":"Navigating and analyzing large chemical spaces are necessary to accelerate the design and discovery of new molecules and chemical processes. In this work, we introduce a computational framework that integrates graph theory and integer programming to enable the efficient navigation of large chemical spaces. Our framework represents the chemical space as a graph, wherein nodes represent molecules and edges represent the degree of similarity or connectivity based on domain-specific information. Using the graph representation, we identify representative molecules by computing the so-called minimum dominating set (MDS), which in our context is the minimum set of molecules that is connected to all other molecules. We present a suite of solution strategies for the MDS problem including heuristic and rigorous integer programming (IP) approaches. We show that these approaches allow us to capture physicochemical properties and domain-specific logic and constraints, facilitating the identification of molecules with the target properties. We demonstrate the effectiveness of the proposed approach by navigating the chemical space of per- and polyfluoroalkyl substances (PFAS); this comprises approximately 15,000 molecular structures. We compare our framework against traditional dimensionality reduction and clustering methods such as t-SNE and K-means clustering."},{"id":"2026-phenomena-based-graph-representations-and-applications","title":"Phenomena-based graph representations and applications to chemical process simulation","year":2026,"type":"journal","venue":"Systems and Control Transactions","topics":["graph-modeling","optimization-algorithms"],"authors":["Yoel R. Cortes-Pena","Ví­ctor M. Zavala"],"authorKeys":["lab:yoel-cortes","v-zavala"],"doi":"10.1016/j.compchemeng.2026.109756","preprint":"https://doi.org/10.26434/chemrxiv-2025-86jhv","url":"https://doi.org/10.1016/j.compchemeng.2026.109756","pdf":"https://psecommunity.org/wp-content/plugins/wpor/includes/file/2506/LAPSE-2025.0368-1v1.pdf","citations":0,"abstract":"Rapid and robust simulation of chemical production processes is critical to address core scientific questions related to process design, optimization, and sustainability. Efficiently solving a chemical process, however, remains a challenge due to their highly coupled and nonlinear nature. Graph abstractions of the underlying physical phenomena within unit operations may help identify potential avenues to systematically reformulate the network of equations and enable more robust convergence of flowsheets. To this end, we further refined a flowsheet graph-theoretic abstraction that consists of a mesh of interconnected variable nodes and equation nodes. The new network of equations is formulated at the phenomenological level�agnostic to the thermodynamic property package�by extending equation formulations widely used to solve multistage equilibrium columns. Decomposition of the graph by phenomena linearizes material and energy balances across the flowsheet by decoupling phenomenological nonlinearities (e.g., phase equilibrium, chemical reactions). Additionally, we further improved a preliminary simulation algorithm which employs this phenomena-based decomposition and demonstrated that it can perform more rapid and robust simulation of large, highly-coupled systems than sequential modular simulation."},{"id":"2026-physics-constrained-machine-learning-for-chemical","title":"Physics-constrained machine learning for chemical engineering","year":2026,"type":"journal","venue":"Current Opinion in Chemical Engineering","topics":["machine-learning","education"],"authors":["Angan Mukherjee","Ví­ctor M. Zavala"],"authorKeys":["lab:angan-mukherjee","v-zavala"],"doi":"10.1016/j.coche.2026.101228","preprint":"https://arxiv.org/abs/2508.20649","url":"https://doi.org/10.1016/j.coche.2026.101228","pdf":null,"citations":26,"abstract":null},{"id":"2025-physics-constrained-neural-ordinary-differential-equation","title":"Physics-constrained neural ordinary differential equation models to discover and predict microbial community dynamics","year":2026,"type":"journal","venue":"Proceedings of the National Academy of Sciences","topics":["biological-systems","machine-learning"],"authors":["Jaron C. Thompson","Bryce Connors","Ví­ctor M. Zavala","Ophelia S. Venturelli"],"authorKeys":["lab:jaron-thompson","b-connors","v-zavala","o-venturelli"],"doi":"10.1073/pnas.2517661123","preprint":"https://www.biorxiv.org/content/biorxiv/early/2025/07/12/2025.07.08.663743.full.pdf","url":"https://doi.org/10.1073/pnas.2517661123","pdf":"https://doi.org/10.1073/pnas.2517661123","citations":9,"abstract":"Abstract Microbial communities play essential roles in shaping ecosystem functions and predictive modeling frameworks are crucial for understanding, controlling, and harnessing their properties. Competition and cross-feeding of metabolites drives microbiome dynamics and functions. Existing mechanistic models that capture metabolite-mediated interactions in microbial communities have limited flexibility due to rigid assumptions. While machine learning models provide flexibility, they require large datasets, are challenging to interpret, and can over-fit to experimental noise. To overcome these limitations, we develop a physics-constrained machine learning model, which we call the Neural Species Mediator (NSM), that combines a mechanistic model of metabolite dynamics with a machine learning component. The NSM is more accurate than mechanistic or machine learning components on experimental datasets and provides insights into direct biological interactions. In summary, embedding a neural network into a mechanistic model of microbial community dynamics improves prediction performance and interpretability compared to its constituent mechanistic or machine learning components. Significance statement Microbial communities drive essential biological processes in every ecosystem. Predicting microbial community dynamics and functions and uncovering their interaction networks are challenging due to their complexity and emergent interactions. We develop a framework that combines biological knowledge with machine learning to accurately predict community and metabolite dynamics. This approach outperforms existing ecological and machine learning models by capturing environmentally mediated interactions while providing interpretable insights into microbe-metabolite interactions. Our framework enables the rational design and control of microbial communities for applications in medicine, agriculture and biotechnology"},{"id":"2026-rational-engineering-to-enhance-c8-fatty","title":"Rational engineering to enhance C8-fatty acid biosynthesis in Picosynechococcus sp. PCC 7002","year":2026,"type":"journal","venue":"Metabolic Engineering","topics":["biological-systems"],"authors":["Baltazar E. Zuniga","Joshua P. Abraham","Juthamas Jaroensuk","Brenda Cansino-Loeza","Clinton M. Hasenour","Sara A. Weidenbach","Russell B. Williams","Ví­ctor M. Zavala","Doug K. Allen","Brian F. Pfleger","Jamey D. Young"],"authorKeys":["b-zuniga","j-abraham","j-jaroensuk","lab:brenda-cansino","c-hasenour","s-weidenbach","r-williams","v-zavala","d-allen","b-pfleger","j-young"],"doi":"10.1016/j.ymben.2026.03.014","preprint":null,"url":"https://doi.org/10.1016/j.ymben.2026.03.014","pdf":"https://doi.org/10.1016/j.ymben.2026.03.014","citations":1,"abstract":"Medium-chain fatty acids (e.g., C8-C14) are important biofuel precursors that can be produced from CO 2 by cyanobacteria and other photoautotrophs. However, cyanobacteria naturally direct a relatively small fraction of fixed carbon to lipid synthesis, primarily producing long-chain membrane-bound fatty acids. We investigated whether mitigating kinetic bottlenecks within the fatty acid biosynthesis (FAB) pathway could enhance flux to free fatty acid (FFA) production in Picosynechococcus sp. PCC 7002. Previous in vitro studies proposed that the FAB initiating enzyme FabH is the primary rate-controlling enzyme in PCC 7002. We hypothesized that enhancing fatty acid initiation could increase in vivo FFA production while shifting the kinetic bottleneck further downstream in the pathway. We enabled C8-FFA accumulation by knocking out the native acyl-acyl carrier protein synthetase gene ( aas ) and expressing the highly active Cuphea palustris- derived mutant thioesterase CpFatB1.2-M4-287 (CupTE), which selectively catalyzes C8 chain termination. We then expressed the diatom-derived Chaetoceros sp . GSL56 FabH ortholog (chKASIII), to enhance initiation, and a medium-chain selective E. coli ketosynthase ecFabF[I108F] (ecFabF*), to enhance elongation. When expressed individually or in combination with ecFabF*, chKASIII slowed growth and decreased net carbon fixation rates relative to the parental Δaas -CupTE strain. However, co-expression of chKASIII, ecFabF*, and CupTE redirected a larger fraction of fixed carbon toward FFA production, increasing relative carbon flux to C8-FFA and decreasing the projected minimum selling price by four-fold. This work demonstrates how systems metabolic engineering can be applied to enhance C8-FFA production in cyanobacteria while highlighting the unpredictable physiological consequences of host metabolic burden. • Expressed a highly active C8-specific thioesterase in PCC 7002 for the first time • Applied a novel method for quantifying acyl-acyl carrier proteins (acyl-ACPs) • Mitigated putative bottlenecks in fatty acid initiation and elongation • Decreased projected costs ∼6-fold by enhancing relative flux to C8-FFA synthesis • Cost improvements were achieved despite reductions in growth and carbon fixation"},{"id":"2026-simulation-based-optimization-over-discrete-spaces","title":"Simulation-Based Optimization over Discrete Spaces Using Projection to Continuous Latent Spaces","year":2026,"type":"journal","venue":"Industrial & Engineering Chemistry Research","topics":["bayesian-optimization","machine-learning"],"authors":["Gabriel Hernández-Morales","Brenda Cansino-Loeza","Arturo Jiménez-Gutiérrez","Ví­ctor M. Zavala"],"authorKeys":["g-hernandez","lab:brenda-cansino","a-jimenez","v-zavala"],"doi":"10.1021/acs.iecr.5c04315","preprint":"https://arxiv.org/abs/2510.14206","url":"https://doi.org/10.1021/acs.iecr.5c04315","pdf":"https://doi.org/10.1021/acs.iecr.5c04315","citations":2,"abstract":"Simulation-based optimization of complex systems over discrete decision spaces is a challenging computational problem. Specifically, discrete decision spaces lead to a combinatorial explosion of possible alternatives, making it computationally prohibitive to perform simulations for all possible combinations. In this work, we present a new approach to handle these issues by transforming/projecting the discrete decision space into a continuous latent space using a probabilistic model known as Variational AutoEncoders. The transformation of the decision space facilitates the implementation of Bayesian optimization (BO), which is an efficient approach that strategically navigates the space to reduce the number of expensive simulations. Here, the key observation is that points in the latent space correspond to decisions in the original mixed-discrete space, but the latent space is much easier to navigate using BO. We illustrate the benefits of our approach through a couple of case studies that aim to design complex distillation systems: the recovery of caprylic acid from water by liquid-liquid extraction and the separation of an azeotropic mixture using a thermally couple column known as an extractive dividing wall column."},{"id":"2026-solvent-mediated-contaminant-removal-from-plastic","title":"Solvent-mediated contaminant removal from plastic waste using thermodynamic modeling","year":2026,"type":"journal","venue":"Green Chemistry","topics":["plastics","molecular-sensing"],"authors":["Panzheng Zhou","Ugochukwu M. Ikegwu","Elizaveta Radkevich","Euncheol Ra","Hadeia Liburd","George W. Huber","Ví­ctor M. Zavala","Reid C. Van Lehn"],"authorKeys":["p-zhou","lab:ugochukwu-ikegwu","e-radkevich","e-ra","h-liburd","g-huber","v-zavala","r-lehn"],"doi":"10.1039/d5gc06059a","preprint":null,"url":"https://doi.org/10.1039/d5gc06059a","pdf":null,"citations":5,"abstract":"Plastic waste contains contaminants that will build up in recycled plastic causing environmental and processing issues. We present molecular modeling approaches to identify solvents that promote contaminant removal and enable plastics recycling."},{"id":"2026-space-biomanufacturing-of-lactic-acid-conceptual","title":"Space Biomanufacturing of Lactic Acid: Conceptual Design and Techno-Economic Analysis","year":2026,"type":"journal","venue":"Computers & Chemical Engineering","topics":["biological-systems","markets-decisions"],"authors":["Brenda Cansino-Loeza","Vernon Mclntosh","Krista L. Ternus","Mayur Bansal","Daniel J. Laky","Luke B. Roberson","Hal S. Alper","Ví­ctor M. Zavala","Vernon McIntosh"],"authorKeys":["lab:brenda-cansino","v-mclntosh","k-ternus","m-bansal","lab:daniel-laky","l-roberson","h-alper","v-zavala","v-mcintosh"],"doi":"10.1016/j.compchemeng.2026.109829","preprint":"https://doi.org/10.26434/chemrxiv.10001860/v1","url":"https://doi.org/10.1016/j.compchemeng.2026.109829","pdf":"https://chemrxiv.org/doi/pdf/10.26434/chemrxiv.10001860/v1","citations":0,"abstract":null},{"id":"2026-trends-for-proton-transport-activity-and","title":"Trends for Proton Transport Activity and Stability in Turnbull’s Blue Analogues: Theory and Experiments","year":2026,"type":"journal","venue":"Chemistry of Materials","topics":["molecular-sensing","energy-systems"],"authors":["Mengru Li","Rui Wang","Pen-Yeh Yen","Anneke Moeller","Reagan Shippy","Katelyn H. Michael","Ví­ctor M. Zavala","Song Jin","Manos Mavrikakis"],"authorKeys":["m-li","r-wang","p-yen","a-moeller","r-shippy","k-michael","v-zavala","s-jin","m-mavrikakis"],"doi":"10.1021/acs.chemmater.5c03404","preprint":null,"url":"https://doi.org/10.1021/acs.chemmater.5c03404","pdf":"https://pubs.acs.org/doi/pdf/10.1021/acs.chemmater.5c03404?ref=article_openPDF","citations":2,"abstract":"Prussian Blue analogues (PBAs) are promising materials for energy storage and conversion because their robust open-framework structures enable efficient ion intercalation. Among them, Turnbull's Blue analogues (TBAs), a subclass featuring ferrocyanide vacancies, exhibit exceptional rate capability in acidic electrolytes by facilitating rapid proton transport. To optimize TBA performance, understanding how the metal identity influences both proton mobility and structural stability is essential. Here, we combined density functional theory (DFT) calculations with electrochemical characterization experiments to investigate the proton transport activity and stability of TBAs incorporating six metals (Cu, Zn, Mn, Fe, Co, and Ni) under acidic conditions. Our theoretical analysis revealed that the inclusion of Mn, Fe, Co, and Ni enhances proton transport via electron spin-flipping at low-spin Fe sites. Furthermore, the presence of ferromagnetic metals promotes the reduction of Fe ions located farther from dense ferrocyanide vacancy regions during proton intercalation, destabilizing the initial protonated configuration and lowering the reaction energy. Stability trends, assessed through Gibbs free energy changes for dissolution in acidic electrolytes, aligned with experimental capacity retention. Through this integrated study, Ni-TBA emerged as a promising candidate, combining high proton transport activity with superior stability, offering valuable guidance for the rational design of high-performance proton-ion battery materials for energy storage."},{"id":"2025-a-digital-twin-simulator-of-a","title":"A digital twin simulator of a pastillation process with applications to automatic control based on computer vision","year":2025,"type":"journal","venue":"Computers & Chemical Engineering","topics":["machine-learning","control"],"authors":["Leonardo D. González","Joshua L. Pulsipher","Shengli Jiang","Angan Mukherjee","Tyler A. Soderstrom","Ví­ctor M. Zavala"],"authorKeys":["lab:leo-gonzalez","lab:joshua-pulsipher","lab:shengli-jiang","lab:angan-mukherjee","t-soderstrom","v-zavala"],"doi":"10.1016/j.compchemeng.2025.109205","preprint":"https://arxiv.org/abs/2503.16539","url":"https://doi.org/10.1016/j.compchemeng.2025.109205","pdf":"https://doi.org/10.1016/j.compchemeng.2025.109205","citations":2,"abstract":null},{"id":"2025-a-fairness-guided-supply-chain-framework","title":"A fairness-guided supply chain framework for polyester production from biomass","year":2025,"type":"journal","venue":"Computers & Chemical Engineering","topics":["supply-chains","markets-decisions"],"authors":["Bo-Xun Wang","Ví­ctor M. Zavala"],"authorKeys":["lab:bo-xun-wang","v-zavala"],"doi":"10.1016/j.compchemeng.2025.109504","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2025.109504","pdf":null,"citations":0,"abstract":null},{"id":"2025-a-fast-computational-framework-for-the","title":"A fast computational framework for the design of solvent-based plastic recycling processes","year":2025,"type":"journal","venue":"Computers & Chemical Engineering","topics":["plastics"],"authors":["Ugochukwu M. Ikegwu","Panzheng Zhou","Reid C. Van Lehn","Ví­ctor M. Zavala","Aurora del Carmen Munguía-López"],"authorKeys":["lab:ugochukwu-ikegwu","p-zhou","r-lehn","v-zavala","lab:aurora-munguia"],"doi":"10.1016/j.compchemeng.2025.109148","preprint":"https://doi.org/10.26434/chemrxiv-2025-xwrh1","url":"https://doi.org/10.1016/j.compchemeng.2025.109148","pdf":"https://doi.org/10.1016/j.compchemeng.2025.109148","citations":16,"abstract":"Multicomponent plastics cannot be processed using mechanical recycling technologies, hindering efforts to deal with plastic waste. Multicomponent plastics include multilayer plastic films, which are widely used for food and healthcare packaging. Multilayer films combine several layers (potentially dozens) of different polymers to protect products from external factors (e.g., oxygen, water, temperature, shock, and light). Solvent-based separation processes have emerged as a promising alternative to recycle these complex materials. For instance, the Solvent-Targeted Recovery and Precipitation STRAP (TM) process uses sequential solvent washes to selectively dissolve and separate constituent polymers from multicomponent plastic waste, including films. STRAP (TM) process design (separation sequence, type of solvents, and operating conditions) changes significantly depending on the design of the multilayer plastic film (e.g., number, types, and proportions of polymers). The ability to quickly quantify the economic and environmental benefits of diverse STRAP (TM) process designs is essential to accelerate the development of sustainable recycling processes and more recyclable multilayer film products. In this work, we present a fast computational framework that integrates molecular-scale models, process modeling, and techno-economic and life cycle analysis to quickly evaluate STRAP (TM) designs. The computational framework is general and can be used to study the processing of complex multilayer plastic waste streams that contain many layers. We highlight the different uses of the framework via targeted case studies."},{"id":"2025-a-graph-theoretic-framework-for-analyzing","title":"A graph-theoretic framework for analyzing and designing chemical engineering curricula","year":2025,"type":"journal","venue":"Computers & Chemical Engineering","topics":["graph-modeling","education"],"authors":["Blake Lopez","Yue Shao","Ví­ctor M. Zavala"],"authorKeys":["lab:blake-lopez","lab:yue-shao","v-zavala"],"doi":"10.1016/j.compchemeng.2025.109150","preprint":"https://doi.org/10.26434/chemrxiv-2024-stm40","url":"https://doi.org/10.1016/j.compchemeng.2025.109150","pdf":"https://doi.org/10.26434/chemrxiv-2024-stm40","citations":1,"abstract":null},{"id":"2025-a-machine-learning-assisted-liquid-crystal","title":"A Machine Learning-Assisted Liquid Crystal Droplet Array Platform for the Sensitive and Selective Detection of Per-and Polyfluoroalkyl Substances (PFAS) in Water","year":2025,"type":"journal","venue":"ACS Sensors","topics":["molecular-sensing","machine-learning"],"authors":["Fengrui Wang","Shiyi Qin","Yang Zhao","Leena M. Edwards-Medina","Benjamin L. Chiu","Claribel Acevedo-Vélez","Christina K. Remucal","Reid C. Van Lehn","Ví­ctor M. Zavala","David M. Lynn","Zhao Yang"],"authorKeys":["f-wang","lab:amy-qin","y-zhao","l-edwards","b-chiu","c-acevedo","c-remucal","r-lehn","v-zavala","d-lynn","z-yang"],"doi":"10.1021/acssensors.5c00907","preprint":null,"url":"https://doi.org/10.1021/acssensors.5c00907","pdf":"https://doi.org/10.1021/acssensors.5c00907","citations":2,"abstract":"We report a machine learning (ML)-assisted liquid crystal (LC) droplet array platform for the detection of per- and polyfluoroalkyl substances (PFAS) in water. Our approach uses an autoencoder network to process thousands of images obtained from arrays of microscale droplets of thermotropic LCs. The latent space obtained using the autoencoder contains significant information that enables sensitive and selective detection of two amphiphilic PFAS [perfluorooctanoic acid (PFOA) and perfluorooctanesulfonic acid (PFOS)] at concentrations as low as parts-per-trillion (ppt) in ultrapure water, municipal tap water, and simulated river water containing dissolved organic matter. Despite the absence of visually discernible changes in the optical outputs of LC arrays at low PFAS concentrations, this approach accurately predicts their presence, even in water containing interfering molecules. We also demonstrate the use of transfer learning to differentiate between PFOA, PFOS, and PFOA/PFOS mixtures, showcasing the potential for practical environmental monitoring. This platform permits identification of PFOA and PFOS below the maximum contaminant levels (4 ppt) established by the U.S. Environmental Protection Agency. Our approach is compatible with automated printing, treatment, and high-throughput optical and ML analysis and could provide a basis for the development of low-cost sensors to monitor PFAS and other amphiphilic contaminants in real-world water samples."},{"id":"2025-benders-decomposition-using-graph-modeling-and","title":"Benders decomposition using graph modeling and multi-parametric programming","year":2025,"type":"journal","venue":"Industrial & Engineering Chemistry Research","topics":["graph-modeling","optimization-algorithms"],"authors":["Parth R. Brahmbhatt","David L. Cole","Ví­ctor M. Zavala","Styliani Avraamidou"],"authorKeys":["p-brahmbhatt","lab:david-cole","v-zavala","s-avraamidou"],"doi":"10.1021/acs.iecr.5c03189","preprint":"https://arxiv.org/abs/2508.01100","url":"https://doi.org/10.1021/acs.iecr.5c03189","pdf":"https://pubs.acs.org/doi/pdf/10.1021/acs.iecr.5c03189?ref=article_openPDF","citations":4,"abstract":"Benders decomposition is a widely used method for solving large and structured optimization problems, but its performance is affected by the repeated solution of subproblems. We propose a flexible and modular algorithmic framework for accelerating Benders decomposition. Specifically, we express the problem structure by using a graph-theoretic modeling abstraction in which nodes represent optimization subproblems and edges represent connectivity between subproblems. A key innovation of our approach is that we embed multiparametric programming (mp) surrogates for node subproblems, which maps the exact analytical map of the subproblem solution space. The use of mp surrogates allows us to replace subproblem solves with fast look-ups and function evaluations for primal and dual variables during the iterative Benders process. We formally show the equivalence between classical Benders cuts and those derived from the mp solution. We implement our framework in the open-source PlasmoBenders.jl software package. To demonstrate the capabilities of the proposed framework, we apply it to a two-stage stochastic programming problem, which aims to make optimal capacity expansion decisions under market uncertainty. We evaluate both single-cut and multicut variants of Benders decomposition and show that the use of mp surrogates achieves substantial speedups in subproblem solve time, while preserving the convergence guarantees of Benders decomposition. We highlight advantages in solution analysis and interpretability that is enabled by mp critical region tracking; specifically, we show that these reveal how decisions evolve geometrically across the Benders search. Our results aim to demonstrate that combining surrogate modeling with graph modeling offers a promising and extensible foundation for structure-exploiting decomposition. In addition, by decomposing the problem into more tractable subproblems, the proposed approach also aims to overcome scalability issues of mp. Finally, the use of mp surrogates provides a unifying and modular optimization framework that enables the representation of heterogeneous node subproblems as modeling objects with a homogeneous structure."},{"id":"2025-codesign-of-cyanobacteria-mutant-strains-and","title":"Codesign of Cyanobacteria Mutant Strains and Processes for Phosphorus Recovery from Livestock Wastewater","year":2025,"type":"journal","venue":"ACS Sustainable Chemistry & Engineering","topics":["biological-systems","waste-nutrients"],"authors":["Theodore A. Chavkin","Leonardo D. González","Brenda Cansino-Loeza","Rebecca A. Larson","Brian F. Pfleger","Ví­ctor M. Zavala"],"authorKeys":["t-chavkin","lab:leo-gonzalez","lab:brenda-cansino","r-larson","b-pfleger","v-zavala"],"doi":"10.1021/acssuschemeng.4c06898","preprint":"https://doi.org/10.26434/chemrxiv-2025-3n9sd","url":"https://doi.org/10.1021/acssuschemeng.4c06898","pdf":"https://doi.org/10.26434/chemrxiv-2025-3n9sd","citations":2,"abstract":"Livestock agriculture generally operates as a linear economy, consuming large quantities of nonrenewable energy and nutrients while generating waste that often pollutes the environment. In this work, we propose approaches to help mitigate nutrient pollution via the development of cyanobacteria-based processes that capture phosphorus from dairy manure. Using engineered strains of cyanobacteria, we were able to increase biomass phosphorus density 8.5-fold with no impact on growth rate, producing biomass that contained 14% phosphorus by mass. Techno-economic modeling revealed that the dramatic increase in phosphorus density leads to a significantly more cost- and resource-efficient process, with over a 2-fold reduction in total annualized cost (TAC), 8-fold reduction in required land use, 3-fold reduction in energy usage, and fully eliminating the use of freshwater. Further analysis showed that combining the mutant strain with a simplified nutrient recovery process resulted in a phosphorus recovery charge (PRC) of 9.2 USD per kg P, which is 88% lower than an estimated socioeconomic cost of P runoff (75 USD per kg P) and equivalent to a service charge of 0.015 USD/gal of manure processed. By using cyanobacteria biomass as a P-dense biofertilizer, the proposed approach can help facilitate nutrient transportation and the transition to a more circular agricultural economy."},{"id":"2025-demonstration-and-technoeconomic-analysis-of-dodecanol","title":"Demonstration and technoeconomic analysis of dodecanol production from acetate using metabolically engineered Escherichia coli","year":2025,"type":"journal","venue":"Metabolic Engineering","topics":["biological-systems","markets-decisions"],"authors":["Paul M Perkovich","Yoel Rene Cortes-Pena","Justin J. Baerwald","Thomas H Graupmann","Theodore A. Chavkin","Shivangi Mishra","William T. Cordell","Ví­ctor M. Zavala","Brian F. Pfleger"],"authorKeys":["p-perkovich","lab:yoel-cortes","j-baerwald","t-graupmann","t-chavkin","s-mishra","w-cordell","v-zavala","b-pfleger"],"doi":"10.1016/j.ymben.2025.10.007","preprint":null,"url":"https://doi.org/10.1016/j.ymben.2025.10.007","pdf":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12768388/","citations":2,"abstract":null},{"id":"2025-evaluating-the-potential-of-plastic-waste","title":"Evaluating the potential of plastic waste upcycling using thermochemical technologies: A case study in Spain","year":2025,"type":"journal","venue":"Computers & Chemical Engineering","topics":["plastics","supply-chains"],"authors":["Roberto Cifuentes García","Evan D. Erickson","Mariano Martín","Ví­ctor M. Zavala"],"authorKeys":["r-garcia","e-erickson","m-martin","v-zavala"],"doi":"10.1016/j.compchemeng.2025.109524","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2025.109524","pdf":"https://doi.org/10.1016/j.compchemeng.2025.109524","citations":2,"abstract":"A plastic waste upcycling value chain model has been applied to assess the potential of processing packaging waste in Spain using thermo-chemical technologies to produce low-density polyethylene (LDPE) and polypropylene (PP), which are highly valuable materials. The model projects an annual profit of 120.6 M$/yr, with a capital investment of 789.3 M$, generating 3285 jobs and contributing 65.5 M$/yr to Spain’s economy. The achieved circularity rate of the waste processing infrastructure exceeds 40 %, incorporating recycled HDPE and PET. Despite these advantages, regulatory gaps and market hesitancy toward recycled materials due to quality concerns hinder adoption. Additionally, economies of scale remain underutilized in Spain due to lower plastic waste collection levels compared to countries such as the United States. This network, while less profitable, is environmentally superior, yielding upcycled products with a Global Warming Potential 20–35 % lower than their virgin, fossil-fuel counterparts, confirming this as a viable and sustainable alternative."},{"id":"2025-from-automated-to-autonomous-process-operations","title":"From automated to autonomous process operations","year":2025,"type":"journal","venue":"Computers & Chemical Engineering","topics":["control","education"],"authors":["Michael Bâldea","Apostolos Georgiou","R. Bhushan Gopaluni","Mehmet Mercangöz","Constantinos C. Pantelides","Kiran Sheth","Ví­ctor M. Zavala","Christos Georgakis","Apostolos T Georgiou","Bhushan Gopaluni"],"authorKeys":["m-baldea","a-georgiou","r-gopaluni","m-mercangoz","c-pantelides","k-sheth","v-zavala","c-georgakis","a-georgiou","b-gopaluni"],"doi":"10.1016/j.compchemeng.2025.109064","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2025.109064","pdf":"https://doi.org/10.1016/j.compchemeng.2025.109064","citations":20,"abstract":"This paper considers current trends towards a higher degree of automation of process operations. Often referred to as “autonomous” process operations, these developments involve cyber-physical systems that can automate tasks that have hitherto relied extensively on human plant operators and, in particular, on their accurate assessment of the current plant situation based on a multitude of information sources, and on their ability to devise and implement plans of actions for dealing with often novel situations. The paper analyses the main drivers behind the need for a higher level of automation in process operations, and reviews the industrial applications that have been described in the public domain to date. It also presents a review of advances and potential impact of some of the enabling technologies for autonomy; these include sensors, mathematical modelling abstractions, reinforcement learning, knowledge graphs, and large language models ."},{"id":"2025-implementation-of-a-bayesian-optimization-framework","title":"Implementation of a Bayesian Optimization Framework for Interconnected Systems","year":2025,"type":"journal","venue":"Industrial & Engineering Chemistry Research","topics":["bayesian-optimization"],"authors":["Leonardo D. González","Ví­ctor M. Zavala"],"authorKeys":["lab:leo-gonzalez","v-zavala"],"doi":"10.1021/acs.iecr.4c02915","preprint":"https://arxiv.org/abs/2501.00967","url":"https://doi.org/10.1021/acs.iecr.4c02915","pdf":null,"citations":8,"abstract":"Bayesian optimization (BO) is an effective paradigm for the optimization of expensive-to-sample systems. Standard BO learns the performance of a system f ( x ) by using a Gaussian Process (GP) model; this treats the system as a black box and limits its ability to exploit available structural knowledge (e.g., physics and sparse interconnections in a complex system). Gray-box modeling, wherein the performance function is treated as a composition of known and unknown intermediate functions f ( x, y ( x )) (where y ( x ) is a GP model), offers a solution to this limitation; however, generating an analytical probability density for f from the Gaussian density of y ( x ) is often an intractable problem (e.g., when f is nonlinear). Previous work has handled this issue by using sampling techniques or by solving an auxiliary problem over an augmented space where the values of y ( x ) are constrained by confidence intervals derived from the GP models; such solutions are computationally intensive. In this work, we provide a detailed implementation of a recently proposed gray-box BO paradigm, BOIS, that uses adaptive linearizations of f to obtain analytical expressions for the statistical moments of the composite function. We show that the BOIS approach enables the exploitation of structural knowledge, such as that arising in interconnected systems as well as systems that embed multiple GP models and combinations of physics and GP models. We benchmark the effectiveness of BOIS against standard BO and existing gray-box BO algorithms using a pair of case studies focused on chemical process optimization and design. Our results indicate that BOIS performs as well as or better than existing gray-box methods, while also being less computationally intensive."},{"id":"2025-implementing-topological-data-analysis-for-monitoring","title":"Implementing Topological Data Analysis for Monitoring Mass Transfer during Vacuum-Assisted Osmotic Dehydration of Apples","year":2025,"type":"journal","venue":"ACS Omega","topics":["topology-geometry","molecular-sensing"],"authors":["Julio Emmanuel González-Pérez","Shengli Jiang","Oscar Jiménez-González","Ví­ctor M. Zavala","Aarón Romo-Hernández","José Ángel Guerrero-Beltrán","Aurelio López-Malo","Nelly Ramírez-Corona"],"authorKeys":["j-gonzalez","lab:shengli-jiang","o-jimenez","v-zavala","a-romo","j-guerrero","a-lopez","n-ramirez"],"doi":"10.1021/acsomega.5c00531","preprint":null,"url":"https://doi.org/10.1021/acsomega.5c00531","pdf":"https://pubs.acs.org/doi/pdf/10.1021/acsomega.5c00531?ref=article_openPDF","citations":0,"abstract":"Abstract This study applies topological data analysis (TDA) to real-time experimental images of grape juice impregnation in apple samples with the goal of monitoring and quantifying the evolution of mass transfer under different processing conditions. We monitored the effective diffusivity (D) of water, solutes, and biocompounds during osmotic procedures using 40, 50, and 60 °Brix grape juice concentrate (GJC) by computing a topological descriptor of the real-time images known as the Euler characteristic curves (ECC). Osmotic procedures were osmodehydration (OD, absolute pressure, Pabs = 598 mmHg) and OD assisted with vacuum (ODVP, Pabs = 498 mmHg/10 min). The modified slope method for cubic geometry estimated D considering shrinkage and time evolution with R2 > 0.80. Results show that samples treated with OD have higher shrinkage (20–25%) compared to those treated with ODVP. Water D was greater with ODVP and increased (p ≤ 0.05) at higher GJC concentrations. Solutes and total monomeric anthocyanins D were higher in OD and decreased with an increasing GJC concentration. Our TDA of real-time images revealed a double-peak structure of the ECC, which is characteristic of diffusion processes. We also found a simple topological metric (the difference between the maximum and minimum values of the ECC) that correlates positively with the diffusion coefficient D (r2 > 0.7858) in OD experiments and negatively (r2 < −0.9567) in ODVP at 60 °Brix. The TDA also indicated that the OD treatment at 40 °Brix resulted in uniform impregnation and redistribution of solutes within the impregnated samples after reaching osmotic equilibrium. The proposed TDA approach opens the door to nonintrusive, image-based monitoring of impregnation experiments, enabling high-throughput screening."},{"id":"2025-new-opportunities-in-produced-water-management","title":"New opportunities in produced water management: A market-based approach to produced water trading","year":2025,"type":"journal","venue":"Geoenergy Science and Engineering","topics":["waste-nutrients","markets-decisions"],"authors":["Philip Tominac","Ví­ctor M. Zavala","Miguel A. Zamarripa","Markus G. Drouven"],"authorKeys":["lab:philip-tominac","v-zavala","m-zamarripa","m-drouven"],"doi":"10.1016/j.geoen.2024.213393","preprint":null,"url":"https://doi.org/10.1016/j.geoen.2024.213393","pdf":null,"citations":0,"abstract":null},{"id":"2025-no2-adsorption-on-oxygen-modified-ag","title":"NO2 Adsorption on Oxygen-Modified Ag at Ambient Conditions","year":2025,"type":"journal","venue":"Journal of the American Chemical Society","topics":["molecular-sensing"],"authors":["Alvaro Posada-Borbón","Trenton J. Wolter","Huaizhe Yu","Evangelos Smith","James Jay Schauer","Reid C. Van Lehn","Ví­ctor M. Zavala","Nicholas Lawrence Abbott","Manos Mavrikakis"],"authorKeys":["a-posada","t-wolter","h-yu","e-smith","j-schauer","r-lehn","v-zavala","n-abbott","m-mavrikakis"],"doi":"10.1021/jacs.5c16683","preprint":null,"url":"https://doi.org/10.1021/jacs.5c16683","pdf":"https://pubs.acs.org/doi/pdf/10.1021/jacs.5c16683?ref=article_openPDF","citations":1,"abstract":"High Resolution Image Download MS PowerPoint Slide Silver-based materials are promising for the removal and detection of NO 2 via surface reactions. Under ambient conditions, NO 2 has been reported to adsorb on silver surfaces as NO 3 . However, theoretical calculations are in conflict with the N 1s X-ray photoelectron spectroscopy (XPS) assignment of NO 3 adsorbed on Ag(111). Here, density functional theory calculations, ab initio thermodynamics, and core-level shift calculations, in combination with XPS measurements, are used to investigate the adsorption of H 2 and NO 2 on oxygen-covered Ag(111). We found that the presence of hydrogen on the surface as hydroxyl groups is thermodynamically favored and explains the experimentally observed O 1s binding energy (BE) signature on Ag(111) at 530.4 eV. Moreover, we determined that NO 2 adsorbed in a dimer form (N 2 O 4 ) elucidates the N 1s BE signature observed at 405.8 eV, whereas the N 1s BE signature for NO 3 is predicted to be closer to 407 eV. Overall, our results suggest that the species assignment for N 1s XPS peak at 405.8 eV on O-covered Ag(111) upon exposure to NO 2 should be reevaluated. This work demonstrates a combined ab initio/experimental methodology capable of resolving XPS spectra of a system with chemoresponsive and catalytic applications."},{"id":"2025-optimization-in-chemical-and-biological-engineering","title":"Optimization in Chemical and Biological Engineering Using Julia","year":2025,"type":"chapter-report","venue":"CRC Press eBooks","topics":["software","education"],"authors":["Joshua L. Pulsipher","David L. Cole","Jordan Jalving","Ví­ctor M. Zavala"],"authorKeys":["lab:joshua-pulsipher","lab:david-cole","lab:jordan-jalving","v-zavala"],"doi":"10.1201/9781003472360-27","preprint":null,"url":"https://doi.org/10.1201/9781003472360-27","pdf":null,"citations":1,"abstract":"In this chapter, we provide an introduction to capabilities for solving optimization problems in Julia that arise in typical chemical and biological engineering applications (control, estimation, design). Julia is a scalable and user-friendly programming language for scientific computing that has recently gained popularity in diverse engineering and scientific domains. We discuss basic features of JuMP.jl (an algebraic modeling package) and package extensions InfiniteOpt.jl and Plasmo.jl that enable the seamless construction and solution of optimization problems and discuss how to embed such models in computational workflows that execute data processing and plotting/visualization tasks."},{"id":"2025-performance-drivers-for-diesel-degradation-in","title":"Performance Drivers for Diesel Degradation in Multiphase Bioreactors by Microbial Consortia Isolated from Polluted Environments","year":2025,"type":"journal","venue":"Industrial & Engineering Chemistry Research","topics":["biological-systems"],"authors":["Sergio Alejandro Medina-Moreno","Ví­ctor M. Zavala","Evelyn Gaxiola-Muñiz","Ainara M. Juvera-Gutiérrez","Edgar N. Tec-Caamal"],"authorKeys":["s-medina","v-zavala","e-gaxiola","a-juvera","e-tec"],"doi":"10.1021/acs.iecr.4c03573","preprint":null,"url":"https://doi.org/10.1021/acs.iecr.4c03573","pdf":null,"citations":1,"abstract":"Hydrocarbon removal from water by microbial consortia is of great importance for mitigating environmental pollution. This study examined physical and biological parameters influencing diesel (DSL) biodegradation by microbial consortia, aiming to identify key factors for efficient degradation in multiphase bioreactors. A modified mathematical model was parametrized using microbial kinetics; hydrocarbon uptake mechanisms (emulsification and direct interfacial uptake); and data sets from experiments on oil-degrading consortia isolated from marine sediments, sinkholes, and swamps. Tessier kinetics were incorporated into this model, and linear regression was used for validation (with 0.82 < R 2 < 0.99, α = 0.05, and p -values > 0.01). Local sensitivity analysis identified the most influential parameters for DSL biodegradation. Microbial kinetics were primarily driven by the maximum specific growth rate, half-saturation constant, inhibition constant, and yields. Hydrocarbon uptake mechanisms were significantly influenced by Sauter’s mean diameter and hydrophobicity coefficient, linked to bioreactor hydrodynamics and the characteristics of bacterial strains, respectively. These findings provide insights into optimizing DSL biodegradation in multiphase bioreactors."},{"id":"2025-phenomena-based-graph-representations-and-applications","title":"Phenomena-Based Graph Representations and Applications to Chemical Process Simulation","year":2025,"type":"conference","venue":"Computers & Chemical Engineering","topics":["graph-modeling","optimization-algorithms"],"authors":["Yoel Rene Cortes-Pena","Ví­ctor M. Zavala"],"authorKeys":["lab:yoel-cortes","v-zavala"],"doi":"10.69997/sct.152278","preprint":"https://doi.org/10.26434/chemrxiv-2025-86jhv","url":"https://doi.org/10.69997/sct.152278","pdf":"https://chemrxiv.org/engage/api-gateway/chemrxiv/assets/orp/resource/item/68bc8f4ea94eede1541532bb/original/phenomena-based-graph-representations-and-applications-to-chemical-process-simulation.pdf","citations":1,"abstract":null},{"id":"2025-scalable-primal-decomposition-schemes-for-large","title":"Scalable primal decomposition schemes for large-scale infrastructure networks","year":2025,"type":"journal","venue":"IEEE Transactions on Control of Network Systems","topics":["optimization-algorithms","graph-modeling","energy-systems"],"authors":["Alexander Engelmann","Sungho Shin","François Pacaud","Ví­ctor M. Zavala"],"authorKeys":["a-engelmann","lab:sungho-shin","f-pacaud","v-zavala"],"doi":"10.1109/tcns.2025.3526709","preprint":"https://arxiv.org/abs/2212.11571","url":"https://doi.org/10.1109/tcns.2025.3526709","pdf":"https://arxiv.org/pdf/2212.11571","citations":2,"abstract":"The operation of large-scale infrastructure networks requires scalable optimization schemes. To guarantee safe system operation, a high degree of feasibility in a small number of iterations is important. Decomposition schemes can help to achieve scalability. In terms of feasibility, however, classical approaches such as the alternating direction method of multipliers (ADMM) often converge slowly. In this work, we present primal decomposition schemes for hierarchically structured strongly convex QPs. These schemes offer high degrees of feasibility in a small number of iterations in combination with global convergence guarantees. We benchmark their performance against the centralized off-the-shelf interior-point solver Ipopt and ADMM on problems with up to 300,000 decision variables and constraints. We find that the proposed approaches solve problems as fast as Ipopt, but with reduced communication and without requiring a full model exchange. Moreover, the proposed schemes achieve a higher accuracy than ADMM."},{"id":"2025-screening-green-solvents-for-multilayer-plastic","title":"Screening green solvents for multilayer plastic film recycling processes","year":2025,"type":"journal","venue":"Computers & Chemical Engineering","topics":["plastics","molecular-sensing"],"authors":["Ugochukwu M. Ikegwu","Aurora del Carmen Munguía-López","Ví­ctor M. Zavala","Reid C. Van Lehn"],"authorKeys":["lab:ugochukwu-ikegwu","lab:aurora-munguia","v-zavala","r-lehn"],"doi":"10.1016/j.compchemeng.2025.109129","preprint":"https://doi.org/10.26434/chemrxiv-2025-zrmnp","url":"https://doi.org/10.1016/j.compchemeng.2025.109129","pdf":"https://doi.org/10.1016/j.compchemeng.2025.109129","citations":15,"abstract":"Multilayer (ML) plastic films are essential packaging materials that help protect products from diverse external factors; however, only 5% of all ML films are recycled in the United States. Solvent-based technologies are a promising alternative for recycling ML films because they enable recovery of constituent polymer resins. For example, the Solvent Targeted Recovery and Precipitation (STRAP) process sequentially dissolves and separates polymer components using a series of targeted solvent washes. A crucial design aspect of this process is the impact of selected solvents on human health and on the environment. This work introduces a computational framework that integrates molecular modeling, process modeling, techno-economic analysis (TEA), and life-cycle analysis (LCA) for quickly screen green solvents for solvent-based ML recycling processes. Initial screening for solvents based on selectivity is performed by estimating temperature-dependent solubilities using molecular-scale models. Subsequent screening uses basic estimates of energy use and octanol-water partition coefficients (logP) as key measures of health, safety, and environmental hazards. Detailed process modeling, TEA, and LCA are used on a reduced set of promising solvents identified in early screening steps to more accurately determine how solvent selection and associated operating conditions impact overall economics and environmental impacts. The framework is used for the identification of green solvents (from a database of 1,000 solvents) that separate an industrial ML film composed of polyethylene (PE), ethylene vinyl alcohol (EVOH), and polyethylene terephthalate (PET). Our analysis shows the effectiveness of the framework and reveals fundamental trade-offs between solvent greenness, solubility, and economics. Our work emphasizes the importance of taking a holistic systems view during solvent design and aims to inform the development of new processes for ML film recycling and the identification of new ML films that are easier to recycle."},{"id":"2025-solvent-based-plastic-recycling-technologies","title":"Solvent-based plastic recycling technologies","year":2025,"type":"journal","venue":"Nature Chemical Engineering","topics":["plastics"],"authors":["Zhuo Xu","Kevin L. Sánchez-Rivera","Charles Granger","Panzheng Zhou","Aurora del Carmen Munguía-López","Ugochukwu M. Ikegwu","Styliani Avraamidou","Ví­ctor M. Zavala","Reid C. Van Lehn","Ezra Bar-Ziv","Steven De Meester","George W. Huber"],"authorKeys":["z-xu","k-sanchez","c-granger","p-zhou","lab:aurora-munguia","lab:ugochukwu-ikegwu","s-avraamidou","v-zavala","r-lehn","e-bar","s-meester","g-huber"],"doi":"10.1038/s44286-025-00247-1","preprint":null,"url":"https://doi.org/10.1038/s44286-025-00247-1","pdf":null,"citations":40,"abstract":null},{"id":"2025-spatio-temporal-load-shifting-for-truly","title":"Spatio-temporal load shifting for truly clean computing","year":2025,"type":"journal","venue":"Advances in Applied Energy","topics":["energy-systems","markets-decisions"],"authors":["Iegor Riepin","Tom P Brown","Ví­ctor M. Zavala"],"authorKeys":["i-riepin","t-brown","v-zavala"],"doi":"10.1016/j.adapen.2024.100202","preprint":"https://arxiv.org/abs/2405.00036","url":"https://doi.org/10.1016/j.adapen.2024.100202","pdf":"https://doi.org/10.1016/j.adapen.2024.100202","citations":54,"abstract":"Companies operating datacenters are increasingly committed to procuring renewable energy to reduce their carbon footprint, with a growing emphasis on achieving 24/7 Carbon-Free Energy (CFE) matching—eliminating carbon emissions from electricity use on an hourly basis. However, variability in renewable energy resources poses significant challenges to achieving this goal. This study investigates how shifting computing workloads and associated power loads across time and location supports 24/7 CFE matching. We develop an optimization model to simulate a network of geographically distributed datacenters managed by a company leveraging spatio-temporal load flexibility to achieve 24/7 CFE matching. We isolate three signals relevant for informed use of load flexibility: (1) varying average quality of renewable energy resources, (2) low correlation between wind power generation over long distances due to different weather conditions, and (3) lags in solar radiation peak due to Earth’s rotation. Our analysis reveals that datacenter location and time of year influence which signal drives an effective load-shaping strategy. By leveraging these signals for coordinated energy procurement and load-shifting decisions, clean computing becomes both more resource-efficient and cost-effective—the costs of 24/7 CFE are reduced by 1.29 ± 0.07 €/MWh for every additional percentage of flexible load. This study provides practical guidelines for datacenter companies to harness spatio-temporal load flexibility for clean computing. Our results and the open-source optimization model offer insights applicable to a broader range of industries aiming to eliminate their carbon footprints. • Spatio-temporal load flexibility enables resource-efficiency of clean computing. • A set of signals for effective load shifting between regions and hours is identified. • Optimal load-shaping strategy depends on datacenter location and time of year. • Additional percent of flexible loads reduces costs by avg. 1.29 ± 0.07 EUR/MWh. • Spatial load shifting yields maximum utility for datacenters located 300–400 km apart."},{"id":"2025-statistics-for-chemical-engineers-from-data","title":"Statistics for Chemical Engineers: From Data to Models to Decisions","year":2025,"type":"chapter-report","venue":"Cambridge University Press","topics":["education","machine-learning"],"authors":["V. M. Zavala"],"authorKeys":["v-zavala"],"doi":null,"preprint":null,"url":null,"pdf":null,"citations":null,"abstract":null},{"id":"2025-teaching-chemical-product-design","title":"Teaching chemical product design","year":2025,"type":"journal","venue":"Education for Chemical Engineers","topics":["education"],"authors":["Warren D. Seider","M. Saad Bhamla","Jennifer Dunn","Mahmoud M. El-Halwagi","Tobias Hanrath","M. M. Faruque Hasan","John D. Hedengren","Laura J. Hirshfield","Xiaoxia Nina Lin","Christos T. Maravelias","Minnie Piffarerio","Stuart W. Prescott","Patrick T. Spicer","Todd M. Squires","Cristina U. Thomas","Jean W. Tom","Kathleen M. Vaeth","Elaine C. Wisniewski","Ví­ctor M. Zavala","Saad Bhamla"],"authorKeys":["w-seider","m-bhamla","j-dunn","m-el","t-hanrath","m-hasan","j-hedengren","l-hirshfield","x-lin","c-maravelias","m-piffarerio","s-prescott","p-spicer","t-squires","c-thomas","j-tom","k-vaeth","e-wisniewski","v-zavala","s-bhamla"],"doi":"10.1016/j.ece.2025.04.002","preprint":null,"url":"https://doi.org/10.1016/j.ece.2025.04.002","pdf":"https://doi.org/10.1016/j.ece.2025.04.002","citations":1,"abstract":"The CACHE Design Task Force has conducted a comprehensive, year-long study on the teaching of chemical product design across global chemical engineering programs. This paper reviews existing literature and highlights distinctions between product and process design, emphasizing the predominance of process design education in universities. Drawing from co-author contributions and responses to a widely distributed questionnaire, we present recent teaching methodologies for chemical product design. The paper discusses trends in chemical engineering diversification and the gradual inclusion of diverse applications in curricula. It concludes with a call to action for chemical engineering educators to integrate well-established product design strategies into undergraduate programs and reflects on insights shared during the 2024 FOCAPD Conference."},{"id":"2025-techno-economic-analysis-of-an-integrated","title":"Techno-economic analysis of an integrated process for cyanobacteria-based nutrient recovery from livestock waste","year":2025,"type":"journal","venue":"Computers & Chemical Engineering","topics":["waste-nutrients","biological-systems"],"authors":["Leonardo D. González","Brenda Cansino-Loeza","Theodore A. Chavkin","Justin D. Gay","Rebecca A. Larson","Brian F. Pfleger","Ví­ctor M. Zavala"],"authorKeys":["lab:leo-gonzalez","lab:brenda-cansino","t-chavkin","j-gay","r-larson","b-pfleger","v-zavala"],"doi":"10.1016/j.compchemeng.2025.109149","preprint":"https://doi.org/10.26434/chemrxiv-2024-hz3r3-v2","url":"https://doi.org/10.1016/j.compchemeng.2025.109149","pdf":"https://doi.org/10.1016/j.compchemeng.2025.109149","citations":5,"abstract":"The dairy industry operates as a linear economy in which large amounts of non-renewable energy and mining resources are used for the production of synthetic chemical fertilizers (e.g., phosphate rock and ammonia). Moreover, significant greenhouse gas emissions and nutrient emissions result from the improper management of manure waste, leading to the simultaneous degradation of valuable air, soil, and water resources . In this work, we present a techno-economic analysis (TEA) framework to investigate the viability of an integrated process that aims to recover nutrients from dairy manure . A central tenet of the proposed process (which we call ReNuAl) is that it uses cyanobacteria (CB) as a key integrative component that simultaneously: (i) harnesses renewable energy to capture waste nutrients and (ii) captures carbon dioxide that results the anaerobic digestion of waste. In this way, ReNuAl provides a pathway to a more circular fertilizer economy that helps manage air and water pollution . Our TEA framework is used to evaluate the phosphorus recovery costs (PRC) under varying levels of process integration. Our analysis reveals that ReNuAl reduces emissions by 57% compared to land-application of manure and has a PRC of $119/kg. A sensitivity analysis show that the PRC can be reduced if P density is improved. This analysis highlights key aspects of the process that have the most impact on economic/environmental performance and to provide performance targets for new CB strain variants."},{"id":"2025-the-impact-of-legacy-nutrient-loading","title":"The Impact of Legacy Nutrient Loading from Lake Sediments on Cyanobacteria Bloom Severity","year":2025,"type":"journal","venue":"ACS ES&T Water","topics":["waste-nutrients"],"authors":["Lauren A. Knose","David L. Cole","Edgar Martín-Hernández","Ví­ctor M. Zavala","Michael A. Gonzalez","Céline Vaneeckhaute","Gerardo J. Ruiz-Mercado"],"authorKeys":["l-knose","lab:david-cole","e-martin","v-zavala","m-gonzalez","c-vaneeckhaute","g-ruiz"],"doi":"10.1021/acsestwater.4c00592","preprint":null,"url":"https://doi.org/10.1021/acsestwater.4c00592","pdf":null,"citations":4,"abstract":"Nutrient pollution and cyanobacteria harmful algal blooms (cyanoHABs) are critical challenges shared among surface waters, largely driven by nutrient releases from nonpoint sources. Tools that inform the selection of nutrient source control and/or timing of implementation would further efforts to reduce nutrient pollution and public health impacts. We provide a modeling framework that uses both mechanistic and statistical models for quantifying the relative importance of external and internal phosphorus (P) loads on cyanoHAB severity and identifying subwatersheds with potential upstream legacy stores. We demonstrated the framework using data from a freshwater lake and found that recently added P from the internal load was significant in explaining cyanoHAB severity (24%), more so than recently added P from external sources (1.1%). Using counterfactual scenarios, we found that a 90% reduction in the recently added internal P load would significantly reduce cyanobacteria cell densities, leading to less severe blooms. Notably, we found that the relative importance of the internal and external P loads varied among years, which can infer when nutrient control strategies may be more/less successful. As such, this framework can help identify the most significant source of P across time and space to better inform nutrient source control."},{"id":"2025-toward-understanding-the-complexity-of-long","title":"Toward understanding the complexity of long-duration energy storage siting in high renewable power grids","year":2025,"type":"journal","venue":"iScience","topics":["energy-systems"],"authors":["David L. Cole","Sourabh Dalvi","Ví­ctor M. Zavala","Omar J. Guerra"],"authorKeys":["lab:david-cole","s-dalvi","v-zavala","o-guerra"],"doi":"10.1016/j.isci.2025.112571","preprint":null,"url":"https://doi.org/10.1016/j.isci.2025.112571","pdf":"https://doi.org/10.1016/j.isci.2025.112571","citations":5,"abstract":"Long-duration energy storage (LDES) devices are not yet widely installed in existing power systems but are expected to play a significant role in high variable-renewable energy grids. Siting LDES devices is complex and can significantly impact system cost, but the factors influencing optimal LDES device placement are not fully understood. We consider the optimal placement of an LDES device in two different power systems with varied system configurations. We analyze the impact of VRE concentration and location, load location, other storage device locations, and transmission availability using production cost models. We find that all of these factors influence optimal LDES siting, and no single metric considered was able to consistently identify optimal placement. Further, we found that LDES placement in the grid can have impacts that propagate throughout the grid (e.g., increasing curtailment in certain areas while decreasing it in others), and we propose several areas of future work."},{"id":"2025-uncovering-ion-transport-mechanisms-in-ionic","title":"Uncovering ion transport mechanisms in ionic liquids using data science","year":2025,"type":"journal","venue":"Digital Discovery","topics":["machine-learning","molecular-sensing"],"authors":["J. E. Umaña","Ryan K. Cashen","Ví­ctor M. Zavala","Matthew A. Gebbie"],"authorKeys":["lab:emmy-umana","r-cashen","v-zavala","m-gebbie"],"doi":"10.1039/d4dd00378k","preprint":"https://doi.org/10.26434/chemrxiv-2024-ks4j1","url":"https://doi.org/10.1039/d4dd00378k","pdf":"https://pubs.rsc.org/en/content/articlepdf/2025/dd/d4dd00378k","citations":8,"abstract":"Batteries play a key role in the energy transition but suffer from safety concerns arising from the electrochemical instability of organic electrolytes. Ionic liquids are emerging as promising, non-flammable electrolytes for next-generation batteries. Yet, designing ionic liquids to facilitate redox ion transport has proven challenging, because ionic liquids are concentrated electrolytes where ion-ion interactions cause pronounced deviation from classical electrolyte scaling theories which assume viscosity governs mobility. Machine learning studies show that ionic liquid transport properties are challenging to predict from molecular descriptors, preventing rational design. Here, we pursue a broader data-centric approach to provide insight into ionic liquid design by merging databases of experimental properties and computational molecular features for 218 ionic liquids across 127 publications. We find that ionic liquids are well-described by a modified Arrhenius model that captures structure-driven ion transport in correlated electrolytes, yielding energy barriers of around 20-30 kJ/mol. This exhibits remarkable agreement with the approximately 25 kJ/mol screened ion pair interaction energy derived from surface forces measurements, suggesting links between mechanisms of ion transport and interfacial screening. We also use machine learning models to find that molecular features can predict some properties, such as density, while failing to predict properties that rely on long-range correlations, such as viscous dissipation. Our study reveals that data science tools can be leveraged to reveal non-classical transport scaling relationships and alternative materials descriptors that promise to be transformative for designing ionic liquids and other correlated electrolytes for next-generation batteries. All data and models are shared as open-source code."},{"id":"2024-fast-and-scalable-computational-topology-framework","title":"A fast and scalable computational topology framework for the Euler characteristic","year":2024,"type":"journal","venue":"Digital Discovery","topics":["topology-geometry","software"],"authors":["Daniel J. Laky","Ví­ctor M. Zavala"],"authorKeys":["lab:daniel-laky","v-zavala"],"doi":"10.1039/d3dd00226h","preprint":"https://arxiv.org/abs/2311.11740","url":"https://arxiv.org/abs/2311.11740","pdf":"https://pubs.rsc.org/en/content/articlepdf/2024/dd/d3dd00226h","citations":5,"abstract":"Parallel algorithms exploit structure to compute the Euler characteristic (a powerful topological descriptor that is used to quantify shape of data) at significantly less computational expense than traditional software tools."},{"id":"2025-a-fast-computational-framework-for-the-2","title":"A Fast Computational Framework for the Design of Solvent-Based Plastic Recycling Processes","year":2024,"type":"conference","venue":"Proceedings of FOCAPD 2024","topics":["plastics"],"authors":["U. M. Ikegwu","P. Zhou","R. C. Van Lehn","V. M. Zavala","A del Carmen Munguía-López"],"authorKeys":["lab:ugochukwu-ikegwu","p-zhou","r-lehn","v-zavala","lab:aurora-munguia"],"doi":"10.69997/sct.175924","preprint":"https://doi.org/10.26434/chemrxiv-2025-xwrh1","url":"https://doi.org/10.69997/sct.175924","pdf":null,"citations":null,"abstract":null},{"id":"2024-a-parametric-bayesian-optimization-framework-for","title":"A Parametric Bayesian Optimization Framework for Batch Dynamical Systems","year":2024,"type":"conference","venue":"Proceedings of the ... American Control Conference/Proceedings of the American Control Conference","topics":["bayesian-optimization"],"authors":["Jaron C. Thompson","Lloyd MacKinnon","Ophelia S. Venturelli","Ví­ctor M. Zavala"],"authorKeys":["lab:jaron-thompson","l-mackinnon","o-venturelli","v-zavala"],"doi":"10.23919/acc60939.2024.10644178","preprint":null,"url":"https://doi.org/10.23919/acc60939.2024.10644178","pdf":null,"citations":0,"abstract":"We present a Bayesian Optimization (BO) framework for optimizing the performance of batch dynamical systems. A key distinctive aspect of this framework is that it uses a parametric machine learning model (a recurrent neural network - RNN) to learn the system dynamics directly from data. The use of a parametric model provides more flexibility to capture complex dynamics and to propose batches of experiments, compared to traditional BO frameworks based on non-parametric Gaussian process (GP) models. However, the use of parametric models introduces challenges in deriving and computing an information measure that can be embedded in the BO acquisition function. The proposed framework uses the expected information gain (EIG) as information measure; we argue that this enables more scalable computations compared to the use of the Fisher Information (FI) measure used in classical design of experiments. We provide a bioreactor case study to illustrate the behavior and benefits of the proposed framework."},{"id":"2024-a-pathway-analysis-framework-for-evaluating","title":"A Pathway Analysis Framework for Evaluating the Economic and Environmental Viability of Biomass-Based Plastic Production","year":2024,"type":"journal","venue":"ACS Sustainable Chemistry & Engineering","topics":["plastics","supply-chains"],"authors":["Bo-Xun Wang","Jiqing Zhuang","Ví­ctor M. Zavala"],"authorKeys":["lab:bo-xun-wang","j-zhuang","v-zavala"],"doi":"10.1021/acssuschemeng.4c06551","preprint":"https://doi.org/10.26434/chemrxiv-2024-m37vq","url":"https://doi.org/10.1021/acssuschemeng.4c06551","pdf":"https://doi.org/10.26434/chemrxiv-2024-m37vq","citations":3,"abstract":"Plastic production from fossil feedstocks (e.g., naphtha, coal, natural gas) is not sustainable and causes known environmental impacts such as global warming. A possible solution is to shift production pathways to use biomass, which is a sustainable feedstock and can sequester armo- spheric carbon dioxide. This study presents an optimization-based pathway analysis framework for evaluating the carbon footprints of the production of mainstream plastics from biomass and fossil feedstocks. We use the modeling framework to quickly navigate complex interdependen- cies that exist between the production pathways of different plastics and to determine pathways of minimum production cost under a range of carbon pricing scenarios. The framework interprets carbon prices as an exogenous taxation scheme or as an endogenous negative value perceived by producers. The proposed approach reveals biomass feedstock quantities needed to displace fossil counterparts and reveals plastics and technologies that should be prioritized. The frame- work can also be used for evaluating system-wide trade-offs between production costs and carbon footprints that arise from pathway interdependencies. We also evaluate hidden environmental impacts associated with the large-scale use biomass as a feedstock, such as land use and water eutrophication that results from significant increase in fertilizer use. The proposed framework provides an integrative platform for basic techno-economic and life-cycle data that can be used for analyzing diverse scenarios and for determining necessary technologies targets (e.g., yields, footprints, and costs) to achieve required levels of decarbonization."},{"id":"2024-analysis-of-chemical-engineering-curricula-using","title":"Analysis of Chemical Engineering Curricula Using Graph Theory","year":2024,"type":"conference","venue":"Systems and Control Transactions","topics":["education","graph-modeling"],"authors":["Blake Lopez","Ví­ctor M. Zavala"],"authorKeys":["lab:blake-lopez","v-zavala"],"doi":"10.69997/sct.190804","preprint":null,"url":"https://doi.org/10.69997/sct.190804","pdf":"https://psecommunity.org/wp-content/plugins/wpor/includes/file/2408/LAPSE-2024.1633-1v2.pdf","citations":1,"abstract":"Chemical engineering is a highly complex interconnected major. Just as chemical engineers have broken complex processes into unit operations, the chemical engineering curriculum has been broken up into courses. The organization of these courses vary among institutions and are based on years of prior teachings and research. Despite this, there have been calls to revaluate the curriculum from both industry and academia. We propose a graph-based representation of curricula in which topics are represented by nodes and topic dependencies are represented by directed edges forming a directed acyclic graph. This enables using graph theory measures and tools to provide formal ways of evaluating a curriculum. Additionally, the abstraction is readily understandable meaning conversations between instructors regarding the curriculum can occur within a department and even across institutions. This abstraction is explained with a simplified curriculum and applied to the undergraduate chemical engineering curriculum at University of Wisconsin-Madison. Highly and lowly connected topics are identified and approaches for grouping the topics into modules are discussed."},{"id":"2024-analysis-of-infrastructures-for-processing-plastic","title":"Analysis of Infrastructures for Processing Plastic Waste using Pyrolysis-Based Chemical Upcycling Pathways","year":2024,"type":"conference","venue":"Systems and Control Transactions","topics":["plastics","supply-chains"],"authors":["Evan D. Erickson","Jiaze Ma","Philip Tominac","Horacio A. Aguirre-Villegas","Ví­ctor M. Zavala"],"authorKeys":["e-erickson","lab:jiaze-ma","lab:philip-tominac","h-aguirre","v-zavala"],"doi":"10.69997/sct.139178","preprint":null,"url":"https://doi.org/10.69997/sct.139178","pdf":"https://psecommunity.org/wp-content/plugins/wpor/includes/file/2408/LAPSE-2024.1600-1v2.pdf","citations":1,"abstract":"Modern mechanical recycling infrastructure for plastic is capable of processing only a small subset of waste plastics, reinforcing the need for parallel disposal methods such as landfilling and incineration. Emerging pyrolysis-based chemical technologies can �upcycle� plastic waste into high-value polymer and chemical products and process a broader range of waste plastics. In this work, we study the economic and environmental benefits of deploying an upcycling infrastructure in the continental United States for producing low-density polyethylene (LDPE) and polypropylene (PP) from post-consumer mixed plas
