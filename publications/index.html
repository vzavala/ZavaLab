ng package Plasmo.jl (which facilitates the construction and manipulation of graph models) and the nonlinear optimization solver MadNLP.jl (which provides capabilities for exploiting graph structures to accelerate solution). We illustrate with a simple example how model construction and manipulation can be performed in an intuitive manner using Plasmo.jl and how the model structure can be exploited by MadNLP.jl . We also demonstrate the scalability of the framework by targeting a large-scale, stochastic gas network problem that contains over 1.7 million variables."},{"id":"2022-a-unifying-modeling-abstraction-for-infinite","title":"A unifying modeling abstraction for infinite-dimensional optimization","year":2022,"type":"journal","venue":"Computers & Chemical Engineering","topics":["uncertainty","software","optimization-algorithms"],"authors":["Joshua L. Pulsipher","Weiqi Zhang","Tyler J. Hongisto","Ví­ctor M. Zavala"],"authorKeys":["lab:joshua-pulsipher","lab:weiqi-zhang","t-hongisto","v-zavala"],"doi":"10.1016/j.compchemeng.2021.107567","preprint":"https://arxiv.org/abs/2106.12689","url":"https://www.sciencedirect.com/science/article/pii/S0098135421003458","pdf":"https://doi.org/10.1016/j.compchemeng.2021.107567","citations":30,"abstract":null},{"id":"2022-adam-a-web-platform-for-graph","title":"ADAM: A web platform for graph-based modeling and optimization of supply chains","year":2022,"type":"journal","venue":"Computers & Chemical Engineering","topics":["supply-chains","graph-modeling","software"],"authors":["Yicheng Hu","Weiqi Zhang","Philip Tominac","Margaret Shen","Dilara Göreke","Edgar Martín-Hernández","Mariano Martín","Gerardo J. Ruiz-Mercado","Ví­ctor M. Zavala","Yicheng Hu"],"authorKeys":["lab:yicheng-hu","lab:weiqi-zhang","lab:philip-tominac","m-shen","lab:dilara-goreke","e-martin","m-martin","g-ruiz","v-zavala","lab:yicheng-hu"],"doi":"10.1016/j.compchemeng.2022.107911","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2022.107911","pdf":"https://doi.org/10.1016/j.compchemeng.2022.107911","citations":12,"abstract":null},{"id":"2022-analysis-of-incentive-policies-for-phosphorus","title":"Analysis of incentive policies for phosphorus recovery at livestock facilities in the Great Lakes area","year":2022,"type":"journal","venue":"Resources Conservation and Recycling","topics":["waste-nutrients","markets-decisions"],"authors":["Edgar Martín-Hernández","Yicheng Hu","Ví­ctor M. Zavala","Mariano Martín","Gerardo J. Ruiz-Mercado","Yicheng Hu"],"authorKeys":["e-martin","lab:yicheng-hu","v-zavala","m-martin","g-ruiz","lab:yicheng-hu"],"doi":"10.1016/j.resconrec.2021.105973","preprint":null,"url":"https://doi.org/10.1016/j.resconrec.2021.105973","pdf":"https://doi.org/10.1016/j.resconrec.2021.105973","citations":31,"abstract":null},{"id":"2022-coordinated-markets-for-furfural-and-levulinic","title":"Coordinated markets for furfural and levulinic acid from residual biomass: A case study in Guanajuato, Mexico","year":2022,"type":"journal","venue":"Computers & Chemical Engineering","topics":["supply-chains","markets-decisions","waste-nutrients"],"authors":["Heriberto Alcocer-García","Juan Gabriel Segovia-Hernández","Eduardo Sánchez-Ramírez","Philip Tominac","Ví­ctor M. Zavala"],"authorKeys":["lab:heriberto-alcocer","j-segovia","e-sanchez","lab:philip-tominac","v-zavala"],"doi":"10.1016/j.compchemeng.2021.107568","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2021.107568","pdf":"https://doi.org/10.1016/j.compchemeng.2021.107568","citations":13,"abstract":null},{"id":"2022-data-analysis-using-riemannian-geometry-and","title":"Data analysis using Riemannian geometry and applications to chemical engineering","year":2022,"type":"journal","venue":"Computers & Chemical Engineering","topics":["topology-geometry"],"authors":["Alexander D. S. Smith","Benjamin R. Laubach","Iván Castillo","Ví­ctor M. Zavala"],"authorKeys":["lab:alexander-smith","b-laubach","i-castillo","v-zavala"],"doi":"10.1016/j.compchemeng.2022.108023","preprint":"https://arxiv.org/abs/2203.12471","url":"https://arxiv.org/abs/2203.12471","pdf":"https://doi.org/10.1016/j.compchemeng.2022.108023","citations":13,"abstract":null},{"id":"2022-expanding-plastics-recycling-technologies-chemical-aspects","title":"Expanding plastics recycling technologies: chemical aspects, technology status and challenges","year":2022,"type":"journal","venue":"Green Chemistry","topics":["plastics"],"authors":["Houqian Li","Horacio A. Aguirre-Villegas","Robert D. Allen","Xianglan Bai","Craig H. Benson","Gregg T. Beckham","Sabrina L. Bradshaw","Jessica L. Brown","Robert C. Brown","Victor Sanfins Cecon","Julia B. Curley","Greg W. Curtzwiler","Son Dong","Soumika Gaddameedi","John E. Estela-García","Ive Hermans","Min Soo Kim","Jiaze Ma","Lesli O. Mark","Manos Mavrikakis","Olumide O. Olafasakin","Tim Andreas Osswald","Konstantinos G. Papanikolaou","Harish Radhakrishnan","Marco A. Sánchez-Castillo","Kevin L. Sánchez-Rivera","Khairun N. Tumu","Reid C. Van Lehn","Keith Vorst","Mark Mba Wright","Jiayang Wu","Ví­ctor M. Zavala","Panzheng Zhou","George W. Huber"],"authorKeys":["h-li","h-aguirre","r-allen","x-bai","c-benson","g-beckham","s-bradshaw","j-brown","r-brown","v-cecon","j-curley","g-curtzwiler","s-dong","s-gaddameedi","j-estela","i-hermans","m-kim","lab:jiaze-ma","l-mark","m-mavrikakis","o-olafasakin","t-osswald","k-papanikolaou","h-radhakrishnan","m-sanchez","k-sanchez","k-tumu","r-lehn","k-vorst","m-wright","j-wu","v-zavala","p-zhou","g-huber"],"doi":"10.1039/d2gc02588d","preprint":"https://doi.org/10.26434/chemrxiv-2022-9wqz0","url":"https://doi.org/10.1039/D2GC02588D","pdf":"https://pubs.rsc.org/en/content/articlepdf/2022/gc/d2gc02588d","citations":614,"abstract":"Less than 10% of the plastics generated globally are recycled, while the rest are incinerated, accumulated in landfills, or leach into the environment. New technologies are emerging to chemically recycle waste plastics that are receiving tremendous interest from academia and industry. Chemists and chemical engineers need to understand the fundamentals of these technologies to design improved systems for chemical recycling and upcycling of waste plastics. In this paper, we review the entire life cycle of plastics and options for the management of plastic waste to address barriers to industrial chemical recycling and further provide perceptions on possible opportunities with such materials. Knowledge and insights to enhance plastic recycling beyond its current scale are provided. Outstanding research problems and where researchers in the field should focus their efforts in the future are also discussed."},{"id":"2022-exploring-the-impacts-of-power-grid","title":"Exploring the Impacts of Power Grid Signals on Data Center Operations using a Receding-Horizon Scheduling Model","year":2022,"type":"journal","venue":"IEEE Transactions on Sustainable Computing","topics":["energy-systems","control"],"authors":["Weiqi Zhang","Line Roald","Ví­ctor M. Zavala"],"authorKeys":["lab:weiqi-zhang","l-roald","v-zavala"],"doi":"10.1109/tsusc.2022.3224668","preprint":"https://arxiv.org/abs/2204.06654","url":"https://arxiv.org/abs/2204.06654","pdf":"https://arxiv.org/pdf/2204.06654","citations":8,"abstract":"Data centers (DCs) can help decarbonize the power grid by helping absorb renewable power (e.g., wind and solar) due to their ability to shift power loads across space and time. However, to harness such load-shifting flexibility, it is necessary to understand how grid signals (carbon signals and market price/load allocations) affect DC operations. An obstacle that arises here is the lack of computationally-tractable DC operation models that can capture objectives, constraints, and information flows that arise at the interface of DCs and the power grid. To address this gap, we present a receding-horizon resource management model (a mixed-integer programming model) that captures the resource management layer between the DC scheduler and the grid while accounting for logical constraints, different types of objectives, and forecasts of incoming job profiles and of available computing capacity. We use our model to conduct extensive case studies based on public data from Microsoft Azure and MISO. Our studies show that DCs can provide significant temporal load-shifting flexibility that results in reduced carbon emissions and peak demand charges. Models and case studies are shared as easy-to-use Julia code."},{"id":"2022-exponential-decay-of-sensitivity-in-graph","title":"Exponential decay of sensitivity in graph-structured nonlinear programs","year":2022,"type":"journal","venue":"SIAM Journal on Optimization","topics":["optimization-algorithms","graph-modeling"],"authors":["Sungho Shin","Mihai Anitescu","Ví­ctor M. Zavala"],"authorKeys":["lab:sungho-shin","m-anitescu","v-zavala"],"doi":"10.1137/21m1391079","preprint":"https://arxiv.org/abs/2101.03067","url":"https://doi.org/10.1137/21m1391079","pdf":"https://arxiv.org/pdf/2101.03067","citations":24,"abstract":"We study solution sensitivity for nonlinear programs (NLPs) whose structures are induced by graphs. These NLPs arise in many applications such as dynamic optimization, stochastic optimization, optimization with partial differential equations, and network optimization. We show that for a given pair of nodes, the sensitivity of the primal-dual solution at one node against a data perturbation at the other node decays exponentially with respect to the distance between these two nodes on the graph. In other words, the solution sensitivity decays as one moves away from the perturbation point. This result, which we call exponential decay of sensitivity, holds under the strong second-order sufficiency condition and the linear independence constraint qualification. We also present conditions under which the decay rate remains uniformly bounded; this allows us to characterize the sensitivity behavior of NLPs defined over subgraphs of infinite graphs. The theoretical developments are illustrated with numerical examples."},{"id":"2022-managing-conflicting-economic-and-environmental-metrics","title":"Managing Conflicting Economic and Environmental Metrics in Livestock Manure Management","year":2022,"type":"journal","venue":"ACS ES&T Engineering","topics":["waste-nutrients"],"authors":["Yicheng Hu","Horacio A. Aguirre-Villegas","Rebecca A. Larson","Ví­ctor M. Zavala","Yicheng Hu"],"authorKeys":["lab:yicheng-hu","h-aguirre","r-larson","v-zavala","lab:yicheng-hu"],"doi":"10.1021/acsestengg.1c00385","preprint":"https://doi.org/10.26434/chemrxiv-2022-8zzh0","url":"https://pubs.acs.org/doi/10.1021/acsestengg.1c00385","pdf":"https://chemrxiv.org/engage/api-gateway/chemrxiv/assets/orp/resource/item/621083f3a6fb4d1dc55b1e72/original/managing-conflicting-economic-and-environmental-metrics-in-livestock-manure-management.pdf","citations":8,"abstract":"Dairy farming is a multibillion USD industry that provides essential food products. At the same time, the millions of animals that this industry oversees generate a massive environmental footprint (affecting air, land, and water quality). Specifically, livestock manure is a carbon- and nutrient-rich waste stream that is routinely used as fertilizer. This practice enables nutrient recycling but also leads to greenhouse gas (GHG) emissions and to nutrient pollution of soils and waterbodies. Mitigating these environmental impacts requires investment in manure processing technologies and identifying and prioritizing investment strategies requires understanding inherent conflicts (trade-offs) and synergies that exist between economic and environmental impacts. In this work, we present a conflict analysis and resolution framework that integrates techno-economic analysis (TEA), life cycle assessment (LCA), and supply chain (SC) optimization. We use this framework to investigate deployment scenarios of manure processing pathways in the Upper Yahara watershed region of Wisconsin. We evaluate LCA (GHG emissions, ammonia emissions, fossil energy use, and nutrient pollution) and TEA metrics (cost and revenue) for different pathways that include manure collection, storage, application, and processing steps. The LCA and TEA metrics are embedded within a SC optimization model that makes decisions on technology selection and geographical placement and on product transport in the study area. A conflict resolution procedure is used to explore trade-offs associated with these decisions and to identify optimal compromise solutions that best balance trade-offs. Our results reveal that there are nonobvious conflicts and synergies between the explored metrics that can be exploited to mitigate multiple impacts simultaneously. We also find that the deployment of a diverse set of technologies is needed to fully resolve conflicts. The impact of emerging technologies (ultrafiltration and reverse osmosis) and government incentives is also discussed."},{"id":"2022-multi-objective-optimization-of-an-open","title":"Multi-objective optimization of an open-cycle, ocean thermal energy conversion system with desalinization","year":2022,"type":"journal","venue":"Chemical Engineering and Processing - Process Intensification","topics":["energy-systems"],"authors":["Ilse María Hernández-Romero","Ví­ctor M. Zavala","Antonio Flores-Tlacuahuac","Fabricio Nápoles-Rivera","Luis Fabián Fuentes-Cortés","Gerardo Geovanni Esquivel-Patiño"],"authorKeys":["lab:ilse-hernandez","v-zavala","a-flores","f-napoles","lab:luis-fabi-n-fuentes-cort-s","g-esquivel"],"doi":"10.1016/j.cep.2022.109091","preprint":null,"url":"https://doi.org/10.1016/j.cep.2022.109091","pdf":null,"citations":18,"abstract":null},{"id":"2022-natural-rubber-blend-optimization-via-data","title":"Natural Rubber Blend Optimization via Data-Driven Modeling: The Implementation for Reverse Engineering","year":2022,"type":"journal","venue":"Polymers","topics":["machine-learning","molecular-sensing"],"authors":["Allen Jonathan Román","Shiyi Qin","Julio C. Rodríguez","Leonardo D. González","Ví­ctor M. Zavala","Tim Andreas Osswald"],"authorKeys":["a-roman","lab:amy-qin","j-rodriguez","lab:leo-gonzalez","v-zavala","t-osswald"],"doi":"10.3390/polym14112262","preprint":null,"url":"https://www.mdpi.com/2073-4360/14/11/2262","pdf":"https://www.mdpi.com/2073-4360/14/11/2262/pdf?version=1654145271","citations":16,"abstract":"Natural rubber formulation methodologies implemented within industry primarily implicate a high dependence on the formulator's experience as it involves an educated guess-and-check process. The formulator must leverage their experience to ensure that the number of iterations to the final blend composition is minimized. The study presented in this paper includes the implementation of blend formulation methodology that targets material properties relevant to the application in which the product will be used by incorporating predictive models, including linear regression, response surface method (RSM), artificial neural networks (ANNs), and Gaussian process regression (GPR). Training of such models requires data, which is equal to financial resources in industry. To ensure minimum experimental effort, the dataset is kept small, and the model complexity is kept simple, and as a proof of concept, the predictive models are used to reverse engineer a current material used in the footwear industry based on target viscoelastic properties (relaxation behavior, tanδ, and hardness), which all depend on the amount of crosslinker, plasticizer, and the quantity of voids used to create the lightweight high-performance material. RSM, ANN, and GPR result in prediction accuracy of 90%, 97%, and 100%, respectively. It is evident that the testing accuracy increases with algorithm complexity; therefore, these methodologies provide a wide range of tools capable of predicting compound formulation based on specified target properties, and with a wide range of complexity."},{"id":"2022-new-measures-for-shaping-trajectories-in","title":"New Measures for Shaping Trajectories in Dynamic Optimization","year":2022,"type":"conference","venue":"IFAC-PapersOnLine","topics":["uncertainty","control"],"authors":["Joshua L. Pulsipher","Benjamin Davidson","Ví­ctor M. Zavala"],"authorKeys":["lab:joshua-pulsipher","b-davidson","v-zavala"],"doi":"10.1016/j.ifacol.2022.07.492","preprint":"https://arxiv.org/abs/2110.07041","url":"https://arxiv.org/abs/2110.07041","pdf":"https://doi.org/10.1016/j.ifacol.2022.07.492","citations":2,"abstract":"We propose a new class of measures for shaping time-dependent trajectories in dynamic optimization (DO). The proposed measures are analogous to risk measures used in stochastic optimization (SO) and are inspired by a recently-proposed unifying abstraction for infinite-dimensional optimization. Risk measures are summarizing statistics (e.g., average, variance, quantiles, worst-case values) that are used to shape the probability density of random objectives and constraints. We show that this extensive collection of measures can be applied in DO for computing and manipulating interesting features of time-dependent trajectories (e.g., excursion costs and quantiles). We also discuss how to implement these measures in the Julia modeling package InfiniteOpt.jl."},{"id":"2022-on-the-convergence-of-overlapping-schwarz","title":"On the Convergence of Overlapping Schwarz Decomposition for Nonlinear Optimal Control","year":2022,"type":"journal","venue":"IEEE Transactions on Automatic Control","topics":["control","optimization-algorithms"],"authors":["Sen Na","Sungho Shin","Mihai Anitescu","Ví­ctor M. Zavala"],"authorKeys":["s-na","lab:sungho-shin","m-anitescu","v-zavala"],"doi":"10.1109/tac.2022.3194087","preprint":"https://arxiv.org/abs/2005.06674","url":"https://ieeexplore.ieee.org/document/9840913","pdf":"https://www.osti.gov/servlets/purl/2333647","citations":2,"abstract":"We study the convergence properties of an overlapping Schwarz decomposition algorithm for solving nonlinear optimal control problems (OCPs). The algorithm decomposes the time domain into a set of overlapping subdomains, and solves all subproblems defined over subdomains in parallel. The convergence is attained by updating primal-dual information at the boundaries of overlapping subdomains. We show that the algorithm exhibits local linear convergence, and that the convergence rate improves exponentially with the overlap size. We also establish global convergence results for a general quadratic programming, which enables the application of the Schwarz scheme inside second-order optimization algorithms (e.g., sequential quadratic programming). The theoretical foundation of our convergence analysis is a sensitivity result of nonlinear OCPs, which we call “exponential decay of sensitivity” (EDS). Intuitively, EDS states that the impact of perturbations at domain boundaries (i.e., initial and terminal time) on the solution decays exponentially as one moves into the domain. Here, we expand a previous analysis available in the literature by showing that EDS holds for both primal and dual solutions of nonlinear OCPs, under uniform second-order sufficient condition, controllability condition, and boundedness condition. We conduct experiments with a quadrotor motion planning problem and a partial differential equations (PDE) control problem to validate our theory, and show that the approach is significantly more efficient than alternating direction method of multipliers and as efficient as the centralized interior-point solver."},{"id":"2022-on-the-integration-of-molecular-dynamics","title":"On the integration of molecular dynamics, data science, and experiments for studying solvent effects on catalysis","year":2022,"type":"journal","venue":"Current Opinion in Chemical Engineering","topics":["molecular-sensing","machine-learning"],"authors":["Lisa Je","George W. Huber","Reid C. Van Lehn","Ví­ctor M. Zavala"],"authorKeys":["lab:lisa-je","g-huber","r-lehn","v-zavala"],"doi":"10.1016/j.coche.2022.100796","preprint":null,"url":"https://doi.org/10.1016/j.coche.2022.100796","pdf":"https://doi.org/10.1016/j.coche.2022.100796","citations":16,"abstract":null},{"id":"2022-on-the-tightness-of-the-lagrangian","title":"On the Tightness of the Lagrangian Dual Bound for Alternating Current Optimal Power Flow","year":2022,"type":"conference","venue":"IEEE Power & Energy Society General Meeting (PESGM)","topics":["energy-systems","optimization-algorithms"],"authors":["Weiqi Zhang","Kibaek Kim","Ví­ctor M. Zavala"],"authorKeys":["lab:weiqi-zhang","lab:kibaek-kim","v-zavala"],"doi":"10.1109/pesgm48719.2022.9917169","preprint":"https://arxiv.org/abs/2104.03788","url":"https://doi.org/10.1109/pesgm48719.2022.9917169","pdf":"https://arxiv.org/pdf/2104.03788","citations":2,"abstract":"We study tightness properties of a Lagrangian dual (LD) bound for the nonconvex alternating current optimal power flow (ACOPF) problem. We show that the LD bound that can be computed in a parallel, decentralized manner. The proposed approach partitions the network into a set of subnetworks, dualizes the coupling constraints (giving the LD function), and maximizes the LD function with respect to the dual variables of the coupling constraints (giving the desired LD bound). The dual variables that maximize the LD are obtained by using a proximal bundle method. We show that the bound is less tight than the popular semidefinite programming relaxation but is as tight as the second-order cone programming relaxation. We demonstrate our developments using PGLib-OPF test instances."},{"id":"2022-online-characterization-of-mixed-plastic-waste","title":"Online Characterization of Mixed Plastic Waste Using Machine Learning and Mid-Infrared Spectroscopy","year":2022,"type":"journal","venue":"ACS Sustainable Chemistry & Engineering","topics":["plastics","machine-learning"],"authors":["Fei Long","Shengli Jiang","Adeyinka Gbenga Adekunle","Ví­ctor M. Zavala","Ezra Bar-Ziv"],"authorKeys":["f-long","lab:shengli-jiang","a-adekunle","v-zavala","e-bar"],"doi":"10.1021/acssuschemeng.2c06052","preprint":null,"url":"https://pubs.acs.org/doi/full/10.1021/acssuschemeng.2c06052","pdf":"https://www.osti.gov/servlets/purl/2481324","citations":34,"abstract":"To recycle the mixed plastic wastes (MPW), it is important to obtain the compositional information online in real time. We present a sensing framework based on a convolutional neural network (CNN) and mid-infrared spectroscopy (MIR) for the rapid and accurate characterization of MPW. The MPW samples are placed on a moving platform to mimic the industrial environment. The MIR spectra are collected at the rate of 100 Hz, and the proposed CNN architecture can reach an overall prediction accuracy close to 100%. Therefore, the proposed method paves the way toward the online MPW characterization in industrial applications where high throughput is needed."},{"id":"2022-ordering-transitions-of-liquid-crystals-triggered","title":"Ordering Transitions of Liquid Crystals Triggered by Metal Oxide-catalyzed Reactions of Sulfur Oxide Species","year":2022,"type":"journal","venue":"Journal of the American Chemical Society","topics":["molecular-sensing"],"authors":["Nanqi Bao","Jake I. Gold","Jonathan K. Sheavly","James Jay Schauer","Ví­ctor M. Zavala","Reid C. Van Lehn","Manos Mavrikakis","Nicholas Lawrence Abbott"],"authorKeys":["n-bao","j-gold","j-sheavly","j-schauer","v-zavala","r-lehn","m-mavrikakis","n-abbott"],"doi":"10.1021/jacs.2c03424","preprint":null,"url":"https://pubs.acs.org/doi/abs/10.1021/jacs.2c03424","pdf":null,"citations":15,"abstract":"Liquid crystals (LCs), when supported on reactive surfaces, undergo changes in ordering that can propagate over distances of micrometers, thus providing a general and facile mechanism to amplify atomic-scale transformations on surfaces into the optical scale. While reactions on organic and metal substrates have been coupled to LC-ordering transitions, metal oxide substrates, which offer unique catalytic activities for reactions involving atmospherically important chemical species such as oxidized sulfur species, have not been explored. Here, we investigate this opportunity by designing LCs that contain 4′-cyanobiphenyl-4-carboxylic acid (CBCA) and respond to surface reactions triggered by parts-per-billion concentrations of SO 2 gas on anatase (101) substrates. We used electronic structure calculations to predict that the carboxylic acid group of CBCA binds strongly to anatase (101) in a perpendicular orientation, a prediction that we validated in experiments in which CBCA (0.005 mol %) was doped into an LC (4′- n -pentyl-4-biphenylcarbonitrile). Both experiment and computational modeling further demonstrated that SO 3 -like species, produced by a surface-catalyzed reaction of SO 2 with H 2 O on anatase (101), displace CBCA from the anatase surface, resulting in an orientational transition of the LC. Experiments also reveal the LC response to be highly selective to SO 2 over other atmospheric chemical species (including H 2 O, NH 3, H 2 S, and NO 2 ), in agreement with our computational predictions for anatase (101) surfaces. Overall, we establish that the catalytic activities of metal oxide surfaces offer the basis of a new class of substrates that trigger LCs to undergo ordering transitions in response to chemical species of relevance to atmospheric chemistry."},{"id":"2022-parallel-dual-dynamic-integer-programming-for","title":"Parallel Dual Dynamic Integer Programming for Large-Scale Hydrothermal Unit-Commitment","year":2022,"type":"journal","venue":"IEEE Transactions on Power Systems","topics":["energy-systems","optimization-algorithms"],"authors":["Bruno Colonetti","Erlon Cristian Finardi","Samuel Brito","Ví­ctor M. Zavala"],"authorKeys":["b-colonetti","e-finardi","s-brito","v-zavala"],"doi":"10.1109/tpwrs.2022.3187059","preprint":null,"url":"https://doi.org/10.1109/TPWRS.2022.3187059","pdf":null,"citations":16,"abstract":"Unit commitment has been at the center of power system operations for over 50 years. Yet, this problem cannot be considered solved due to its size and complexity. Today, operators rely on off-the-shelf optimization solvers to tackle it, and often resort to simplifications to make the problem tractable and solvable in reasonable times. Nonetheless, despite the simplifications and advancements in commercial optimization solvers, solving the unit commitment in a timely manner is still a challenge. In this work, we propose a parallel dual dynamic integer programming approach for solving this problem. Different from what can be currently found in the literature, our parallel approach is applied to a deterministic problem and thus requires induced parallelization. Our strategy is assessed on 20 cases of a hydrothermal system with over 7,000 buses and it is able to solve all instances to a 0.1% gap in less than two hours with speed-ups up to 9.2 compared to a sequential strategy. We also apply our strategy to a purely thermal, large-scale academic system with 9,241 buses, 16,049 transmission lines and 1,445 generating units, for which our strategy returns a 0.1% solution in less than 30 min."},{"id":"2022-pricing-and-remunerating-electricity-storage-flexibility","title":"Pricing and remunerating electricity storage flexibility using virtual links","year":2022,"type":"journal","venue":"Computers & Chemical Engineering","topics":["energy-systems","markets-decisions"],"authors":["Weiqi Zhang","Philip Tominac","Ví­ctor M. Zavala"],"authorKeys":["lab:weiqi-zhang","lab:philip-tominac","v-zavala"],"doi":"10.1016/j.compchemeng.2022.108019","preprint":"https://arxiv.org/abs/2204.07281","url":"https://arxiv.org/abs/2204.07281","pdf":"https://doi.org/10.1016/j.compchemeng.2022.108019","citations":6,"abstract":null},{"id":"2022-promoting-phosphorus-recovery-at-livestock-facilities","title":"Promoting phosphorus recovery at livestock facilities in the Great Lakes region: Analysis of incentive policies","year":2022,"type":"conference","venue":"Computer-aided chemical engineering/Computer aided chemical engineering","topics":["waste-nutrients","markets-decisions"],"authors":["Edgar Martín-Hernández","Yicheng Hu","Ví­ctor M. Zavala","Mariano Martín","Gerardo J. Ruiz-Mercado"],"authorKeys":["e-martin","lab:yicheng-hu","v-zavala","m-martin","g-ruiz"],"doi":"10.1016/b978-0-323-85159-6.50309-2","preprint":null,"url":"https://doi.org/10.1016/B978-0-323-85159-6.50309-2","pdf":null,"citations":0,"abstract":null},{"id":"2022-random-field-optimization","title":"Random field optimization","year":2022,"type":"journal","venue":"Computers & Chemical Engineering","topics":["uncertainty"],"authors":["Joshua L. Pulsipher","Benjamin Davidson","Ví­ctor M. Zavala"],"authorKeys":["lab:joshua-pulsipher","b-davidson","v-zavala"],"doi":"10.1016/j.compchemeng.2022.107854","preprint":"https://arxiv.org/abs/2201.09951","url":"https://doi.org/10.1016/j.compchemeng.2022.107854","pdf":"https://doi.org/10.1016/j.compchemeng.2022.107854","citations":3,"abstract":null},{"id":"2022-remunerating-space-time-load-shifting-flexibility","title":"Remunerating space–time, load-shifting flexibility from data centers in electricity markets","year":2022,"type":"journal","venue":"Applied Energy","topics":["energy-systems","markets-decisions"],"authors":["Weiqi Zhang","Ví­ctor M. Zavala"],"authorKeys":["lab:weiqi-zhang","v-zavala"],"doi":"10.1016/j.apenergy.2022.119930","preprint":"https://arxiv.org/abs/2105.11416","url":"https://doi.org/10.1016/j.apenergy.2022.119930","pdf":"https://doi.org/10.1016/j.apenergy.2022.119930","citations":32,"abstract":null},{"id":"2022-safe-occ-a-novelty-detection-framework","title":"SAFE-OCC: A novelty detection framework for Convolutional Neural Network sensors and its application in process control","year":2022,"type":"journal","venue":"Journal of Process Control","topics":["machine-learning","control"],"authors":["Joshua L. Pulsipher","Luke D. J. Coutinho","Tyler A. Soderstrom","Ví­ctor M. Zavala"],"authorKeys":["lab:joshua-pulsipher","l-coutinho","t-soderstrom","v-zavala"],"doi":"10.1016/j.jprocont.2022.07.006","preprint":"https://arxiv.org/abs/2202.01816","url":"https://arxiv.org/abs/2202.01816","pdf":"https://doi.org/10.1016/j.jprocont.2022.07.006","citations":8,"abstract":null},{"id":"2022-sensing-gas-mixtures-by-analyzing-the","title":"Sensing Gas Mixtures by Analyzing the Spatiotemporal Optical Responses of Liquid Crystals Using 3D Convolutional Neural Networks","year":2022,"type":"journal","venue":"ACS Sensors","topics":["molecular-sensing","machine-learning"],"authors":["Nanqi Bao","Shengli Jiang","Alexander D. S. Smith","James Jay Schauer","Manos Mavrikakis","Reid C. Van Lehn","Ví­ctor M. Zavala","Nicholas Lawrence Abbott"],"authorKeys":["n-bao","lab:shengli-jiang","lab:alexander-smith","j-schauer","m-mavrikakis","r-lehn","v-zavala","n-abbott"],"doi":"10.1021/acssensors.2c00362","preprint":"https://doi.org/10.26434/chemrxiv-2022-32bnw","url":"https://pubs.acs.org/doi/10.1021/acssensors.2c00362","pdf":"https://chemrxiv.org/engage/api-gateway/chemrxiv/assets/orp/resource/item/62ea8bfaab605036caf1012f/original/sensing-gas-mixtures-by-analyzing-the-spatiotemporal-optical-responses-of-liquid-crystals-using-3d-convolutional-neural-networks.pdf","citations":33,"abstract":"We report how analysis of the spatial and temporal optical responses of liquid crystal (LC) films to targeted gases, when performed using a machine learning methodology, can advance the sensing of gas mixtures and provide important insights into the physical processes that underlie the sensor response. We develop the methodology using O3 and Cl2 mixtures (representative of an important class of analytes) and LCs supported on metal perchlorate-decorated surfaces as a model system. Whereas O3 and Cl2¬ both diffuse through LC films and undergo redox reactions with the supporting metal perchlorate surfaces to generate similar initial and final optical states of the LCs, we show that a 3-dimensional convolutional neural network (3D CNN) can extract feature information that is encoded in the spatiotemporal color patterns of the LCs to detect the presence of both O3 and Cl2 species in mixtures as well as to quantify their concentrations. Our analysis reveals that O3 detection is driven by the transition time over which the brightness of the LC changes, while Cl2 detection is driven by color fluctuations that develop late in the optical response of the LC. We also show that we can detect the presence of Cl2 even when the concentration of O3 is orders of magnitude greater than the Cl2 concentration. The proposed methodology is generalizable to a wide range of analytes, reactive surfaces and LCs, and has the potential to advance the design of portable LC monitoring devices (e.g., wearable devices) for analyzing gas mixtures using spatiotemporal color fluctuations."},{"id":"2022-solution-of-large-scale-supply-chain","title":"Solution of large-scale supply chain models using graph sampling and coarsening","year":2022,"type":"journal","venue":"Computers & Chemical Engineering","topics":["supply-chains","graph-modeling"],"authors":["Jiaze Ma","Ví­ctor M. Zavala"],"authorKeys":["lab:jiaze-ma","v-zavala"],"doi":"10.1016/j.compchemeng.2022.107832","preprint":"https://arxiv.org/abs/2111.01249","url":"https://doi.org/10.1016/j.compchemeng.2022.107832","pdf":"https://doi.org/10.1016/j.compchemeng.2022.107832","citations":11,"abstract":null},{"id":"2022-spatio-temporal-economic-properties-of-multi","title":"Spatio-temporal economic properties of multi-product supply chains","year":2022,"type":"journal","venue":"Computers & Chemical Engineering","topics":["supply-chains","markets-decisions"],"authors":["Philip Tominac","Weiqi Zhang","Ví­ctor M. Zavala"],"authorKeys":["lab:philip-tominac","lab:weiqi-zhang","v-zavala"],"doi":"10.1016/j.compchemeng.2022.107666","preprint":"https://arxiv.org/abs/2106.13836","url":"https://arxiv.org/abs/2106.13836","pdf":"https://doi.org/10.1016/j.compchemeng.2022.107666","citations":12,"abstract":null},{"id":"2022-techno-economic-analysis-of-pretreatments-to","title":"Techno-economic analysis of pretreatments to dairy manure biomass for enhanced biogas production","year":2022,"type":"journal","venue":"Bioresource Technology Reports","topics":["waste-nutrients"],"authors":["Joonrae Roger Kim","Yicheng Hu","Ví­ctor M. Zavala","Krishnapuram G. Karthikeyan","Yicheng Hu"],"authorKeys":["j-kim","lab:yicheng-hu","v-zavala","k-karthikeyan","lab:yicheng-hu"],"doi":"10.1016/j.biteb.2022.101275","preprint":null,"url":"https://doi.org/10.1016/j.biteb.2022.101275","pdf":"https://doi.org/10.1016/j.biteb.2022.101275","citations":17,"abstract":null},{"id":"2021-accurate-characterization-of-mixed-plastic-waste","title":"Accurate Characterization of Mixed Plastic Waste Using Machine Learning and Fast Infrared Spectroscopy","year":2021,"type":"journal","venue":"ACS Sustainable Chemistry & Engineering","topics":["plastics","machine-learning"],"authors":["Stas Zinchik","Shengli Jiang","Søren Friis","Fei Long","Lasse Høgstedt","Ví­ctor M. Zavala","Ezra Bar-Ziv","Lasse Hogstedt"],"authorKeys":["s-zinchik","lab:shengli-jiang","s-friis","f-long","l-hgstedt","v-zavala","e-bar","l-hogstedt"],"doi":"10.1021/acssuschemeng.1c04281","preprint":null,"url":"https://pubs.acs.org/doi/abs/10.1021/acssuschemeng.1c04281","pdf":null,"citations":61,"abstract":"We present a combination of convolutional neural network (CNN) framework and fast MIR (mid-infrared spectroscopy) for classifying different types of dark plastic materials that are commonly found in mixed plastic waste (MPW) streams. Dark plastic materials present challenges in fast identification because of the low signal-to-noise ratio. The proposed CNN architecture (which we call PlasticNet) can reach an overall classification accuracy of 100% and can identify the constituent materials in a multiplastic blend with 100% accuracy. The fast MIR system can collect spectral data at a rate up to 400 Hz, and the CNN model can reach prediction speeds of 8200 Hz. Therefore, this method provides an avenue to be able to characterize MPW in a real-time high-throughput manner."},{"id":"2021-bayesian-optimization-with-reference-models-a","title":"Bayesian optimization with reference models: A case study in MPC for HVAC central plants","year":2021,"type":"journal","venue":"Computers & Chemical Engineering","topics":["bayesian-optimization","control"],"authors":["Qiugang Lu","Leonardo D. González","Ranjeet Kumar","Ví­ctor M. Zavala"],"authorKeys":["lab:qiugang-lu","lab:leo-gonzalez","lab:ranjeet-kumar","v-zavala"],"doi":"10.1016/j.compchemeng.2021.107491","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2021.107491","pdf":null,"citations":57,"abstract":null},{"id":"2021-controllability-and-observability-imply-exponential-decay","title":"Controllability and observability imply exponential decay of sensitivity in dynamic optimization","year":2021,"type":"conference","venue":"IFAC-PapersOnLine","topics":["control","optimization-algorithms"],"authors":["Sungho Shin","Ví­ctor M. Zavala"],"authorKeys":["lab:sungho-shin","v-zavala"],"doi":"10.1016/j.ifacol.2021.08.542","preprint":"https://arxiv.org/abs/2101.06350","url":"https://arxiv.org/abs/2101.06350","pdf":"https://doi.org/10.1016/j.ifacol.2021.08.542","citations":5,"abstract":"We study a property of dynamic optimization (DO) problems (as those encountered in model predictive control and moving horizon estimation) that is known as exponential decay of sensitivity (EDS). This property indicates that the sensitivity of the solution at stage i against a data perturbation at stage j decays exponentially with |i-j|. Building upon our previous results, we show that EDS holds under uniform boundedness of the Lagrangian Hessian, a uniform second order sufficiency condition (uSOSC), and a uniform linear independence constraint qualification (uLICQ). Furthermore, we prove that uSOSC and uLICQ can be obtained under uniform controllability and observability. Hence, we have that uniform controllability and observability imply EDS. These results provide insights into how perturbations propagate along the horizon and enable the development of approximation and solution schemes. We illustrate the developments with numerical examples."},{"id":"2021-convolutional-neural-nets-in-chemical-engineering","title":"Convolutional neural nets in chemical engineering: Foundations, computations, and applications","year":2021,"type":"journal","venue":"AIChE Journal","topics":["machine-learning"],"authors":["Shengli Jiang","Ví­ctor M. Zavala"],"authorKeys":["lab:shengli-jiang","v-zavala"],"doi":"10.1002/aic.17282","preprint":"https://arxiv.org/abs/2101.04869","url":"https://doi.org/10.1002/aic.17282","pdf":"https://arxiv.org/pdf/2101.04869","citations":44,"abstract":"Abstract In this article, we review the mathematical foundations of convolutional neural nets (CNNs) with the goals of: (i) highlighting connections with techniques from statistics, signal processing, linear algebra, differential equations, and optimization, (ii) demystifying underlying computations, and (iii) identifying new types of applications. CNNs are powerful machine learning models that highlight features from grid data to make predictions (regression and classification). The grid data object can be represented as vectors (in 1D), matrices (in 2D), or tensors (in 3D or higher dimensions) and can incorporate multiple channels (thus providing high flexibility in the input data representation). CNNs highlight features from the grid data by performing convolution operations with different types of operators. The operators highlight different types of features (e.g., patterns, gradients, geometrical features) and are learned by using optimization techniques. In other words, CNNs seek to identify optimal operators that best map the input data to the output data. A common misconception is that CNNs are only capable of processing image or video data but their application scope is much wider; specifically, datasets encountered in diverse applications can be expressed as grid data. Here, we show how to apply CNNs to new types of applications such as optimal control, flow cytometry, multivariate process monitoring, and molecular simulations."},{"id":"2021-coordinated-management-of-agricultural-waste-and","title":"Coordinated Management of Agricultural Waste and High-tech Value Bioproducts","year":2021,"type":"conference","venue":"Computer-aided chemical engineering/Computer aided chemical engineering","topics":["waste-nutrients","supply-chains"],"authors":["Heriberto Alcocer-García","Juan Gabriel Segovia-Hernández","Eduardo Sánchez-Ramírez","Ana Gabriela Romero-García","Yicheng Hu","Ví­ctor M. Zavala","Yicheng Hu"],"authorKeys":["lab:heriberto-alcocer","j-segovia","e-sanchez","a-romero","lab:yicheng-hu","v-zavala","lab:yicheng-hu"],"doi":"10.1016/b978-0-323-88506-5.50293-x","preprint":null,"url":"https://doi.org/10.1016/b978-0-323-88506-5.50293-x","pdf":null,"citations":0,"abstract":null},{"id":"2022-diffusing-horizon-model-predictive-control","title":"Diffusing-Horizon Model Predictive Control","year":2021,"type":"journal","venue":"IEEE Transactions on Automatic Control","topics":["control"],"authors":["Sungho Shin","Ví­ctor M. Zavala"],"authorKeys":["lab:sungho-shin","v-zavala"],"doi":"10.1109/TAC.2021.3137100","preprint":"https://arxiv.org/abs/2002.08556","url":"http://arxiv.org/abs/2002.08556","pdf":"https://arxiv.org/pdf/2002.08556","citations":29,"abstract":"We analyze a time-coarsening strategy for model predictive control (MPC) that we call diffusing-horizon MPC. This strategy seeks to overcome the computational challenges associated with optimal control problems that span multiple timescales. The coarsening approach uses a time discretization grid that becomes exponentially more sparse as one moves forward in time. This design is motivated by a recently established property of optimal control problems that is known as exponential decay of sensitivity (EDS). This property states that the impact of a parametric perturbation at a future time decays exponentially as one moves backward in time. We establish conditions under which this property holds for a constrained MPC formulation with linear dynamics and costs. Moreover, we show that the proposed coarsening scheme can be cast as a parametric perturbation of the MPC problem and, thus, the exponential decay condition holds. We use a HVAC plant case study with real data to demonstrate the proposed approach. Specifically, we show that computational times can be reduced by two orders of magnitude while increasing the closed-loop cost by only 3%."},{"id":"2021-dual-dynamic-programming-for-multi-scale","title":"Dual dynamic programming for multi-scale mixed-integer MPC","year":2021,"type":"journal","venue":"Computers & Chemical Engineering","topics":["control","optimization-algorithms"],"authors":["Ranjeet Kumar","Michael J. Wenzel","Mohammad N. ElBsat","Michael J. Risbeck","Kirk H. Drees","Ví­ctor M. Zavala"],"authorKeys":["lab:ranjeet-kumar","m-wenzel","m-elbsat","m-risbeck","k-drees","v-zavala"],"doi":"10.1016/j.compchemeng.2021.107265","preprint":"https://arxiv.org/abs/2007.10149","url":"https://www.sciencedirect.com/science/article/abs/pii/S0098135421000430","pdf":"https://doi.org/10.1016/j.compchemeng.2021.107265","citations":6,"abstract":null},{"id":"2021-economic-properties-of-multi-product-supply","title":"Economic properties of multi-product supply chains","year":2021,"type":"journal","venue":"Computers & Chemical Engineering","topics":["supply-chains","markets-decisions"],"authors":["Philip Tominac","Ví­ctor M. Zavala"],"authorKeys":["lab:philip-tominac","v-zavala"],"doi":"10.1016/j.compchemeng.2020.107157","preprint":"https://arxiv.org/abs/2006.03467","url":"https://doi.org/10.1016/j.compchemeng.2020.107157","pdf":"https://doi.org/10.1016/j.compchemeng.2020.107157","citations":18,"abstract":null},{"id":"2021-evaluating-coupling-models-for-cloud-datacenters","title":"Evaluating Coupling Models for Cloud Datacenters and Power Grids","year":2021,"type":"conference","venue":"ACM International Conference on Future Energy Systems (e-Energy)","topics":["energy-systems"],"authors":["Liuzixuan Lin","Ví­ctor M. Zavala","Andrew A. Chien"],"authorKeys":["l-lin","v-zavala","a-chien"],"doi":"10.1145/3447555.3464868","preprint":null,"url":"https://doi.org/10.1145/3447555.3464868","pdf":null,"citations":19,"abstract":"The rapid growth of datacenter (DC) loads can be leveraged to help meet renewable portfolio standard (RPS, renewable fraction) targets in power grids. The ability to manipulate DC loads over time (shifting) provides a mechanism to deal with temporal mismatch between non-dispatchable renewable generation (e.g. wind and solar) and overall grid loads, and this flexibility ultimately facilitates the absorption of renewables and grid decarbonization. To this end, we study DC-grid coupling models, exploring their impact on grid dispatch, renewable absorption, power prices, and carbon emissions. With a detailed model of grid dispatch, generation, topology, and loads, we consider three coupling approaches: fixed, datacenter-local optimization (online dynamic programming), and grid-wide optimization (optimal power flow)."},{"id":"2021-graph-based-modeling-and-decomposition-of","title":"Graph-Based Modeling and Decomposition of Energy Infrastructures","year":2021,"type":"conference","venue":"IFAC-PapersOnLine","topics":["graph-modeling","energy-systems"],"authors":["Sungho Shin","Carleton Coffrin","Kaarthik Sundar","Ví­ctor M. Zavala"],"authorKeys":["lab:sungho-shin","c-coffrin","k-sundar","v-zavala"],"doi":"10.1016/j.ifacol.2021.08.322","preprint":"https://arxiv.org/abs/2010.02404","url":"https://arxiv.org/abs/2010.02404","pdf":"https://doi.org/10.1016/j.ifacol.2021.08.322","citations":27,"abstract":"Nonlinear optimization problems are found at the heart of real-time operations of critical infrastructures. These problems are computationally challenging because they embed complex physical models that exhibit space-time dynamics. We propose modeling these problems as graph-structured optimization problems, and illustrate how their structure can be exploited at the modeling level (for parallelizing function/derivative computations) and at the solver level (for parallelizing linear algebra operations). Specifically, we present a restricted additive Schwarz scheme that enables flexible decomposition of complex graph structures within an interior-point algorithm. The proposed approach is implemented as a general-purpose nonlinear programming solver that we call MadNLP.jl; this Julia-based solver is interfaced to the graph-based modeling package Plasmo.jl. The efficiency of this framework is demonstrated via problems arising in transient gas network optimization and multi-period AC optimal power flow. We show that our framework accelerates the solution (compared to off-the-shelf tools) by over 300%; specifically, solution times are reduced from 72.36 sec to 23.84 sec for the gas problem and from 515.81 sec to 149.45 sec for the power flow problem."},{"id":"2021-image-based-model-predictive-control-via","title":"Image-based model predictive control via dynamic mode decomposition","year":2021,"type":"journal","venue":"Journal of Process Control","topics":["control","machine-learning"],"authors":["Qiugang Lu","Ví­ctor M. Zavala"],"authorKeys":["lab:qiugang-lu","v-zavala"],"doi":"10.1016/j.jprocont.2021.06.009","preprint":"https://arxiv.org/abs/2006.06727","url":"https://doi.org/10.1016/j.jprocont.2021.06.009","pdf":"https://arxiv.org/pdf/2006.06727","citations":21,"abstract":null},{"id":"2021-infrastructures-for-phosphorus-recovery-from-livestock","title":"Infrastructures for Phosphorus Recovery from Livestock Waste Using Cyanobacteria: Transportation, Techno-Economic, and Policy Implications","year":2021,"type":"journal","venue":"ACS Sustainable Chemistry & Engineering","topics":["waste-nutrients","biological-systems"],"authors":["Jiaze Ma","Philip Tominac","Brian F. Pfleger","Ví­ctor M. Zavala"],"authorKeys":["lab:jiaze-ma","lab:philip-tominac","b-pfleger","v-zavala"],"doi":"10.1021/acssuschemeng.1c03378","preprint":null,"url":"https://doi.org/10.1021/acssuschemeng.1c03378","pdf":null,"citations":7,"abstract":"This work presents a computational framework for investigating the economics of phosphorus (P) recovery infrastructures in the dairy sector based on cyanobacterial (microalgal) cultivation. Our framework integrates supply chain and techno-economic analysis to assess the potential of large- and small-scale open pond raceways (OPRs) and bag photobioreactors (PBRs). We explore the integration of these cultivation systems with anaerobic digestion, dry algal biomass production, and biofuel/biogas production units. To guide our assessment, we propose three economic indicators that we call the “social milk incentive” (SMI), “social animal incentive” (SAI), and “social phosphorus incentive” (SPI). The SMI is defined as the revenue necessary to achieve a zero net present value (NPV) for the infrastructure, relative to the total amount of milk produced in the studied region. The SAI is the revenue required relative to the number of cows in the region, and the SPI is the revenue required relative to the total P recovered by the infrastructure. These indicators facilitate comparisons between alternative infrastructure layouts, highlight incentives needed, and can help communicate hidden costs of dairy farming to the public. We use our framework for analyzing infrastructures that recover P in the Upper Yahara watershed region in Wisconsin, which currently faces severe nutrient pollution. Our results show that an infrastructure comprising a single, centralized OPR coupled with a dry algal production unit requires the lowest SMI (0.33 USD/gal) and that this incentive represents 17% of the current price of milk (1.85 USD/gal). Our framework also reveals that increasing the growth rate of algae by 20% (e.g., via metabolic engineering) can potentially eliminate the need for incentives (SMI of 0 USD/gal). Moreover, we found that the best SPI achievable (22 USD/kg P) is below a recent estimate of the economic impact of P pollution (74.5 USD/kg P); as such, the proposed infrastructure provides a viable avenue to mitigate nutrient pollution and associated environmental costs."},{"id":"2021-mitigating-investment-risk-using-modular-technologies","title":"Mitigating investment risk using modular technologies","year":2021,"type":"journal","venue":"Computers & Chemical Engineering","topics":["uncertainty","supply-chains"],"authors":["Yue Shao","Yicheng Hu","Ví­ctor M. Zavala"],"authorKeys":["lab:yue-shao","lab:yicheng-hu","v-zavala"],"doi":"10.1016/j.compchemeng.2021.107424","preprint":"https://arxiv.org/abs/2012.06447","url":"https://doi.org/10.1016/j.compchemeng.2021.107424","pdf":"https://doi.org/10.1016/j.compchemeng.2021.107424","citations":11,"abstract":null},{"id":"2020-multi-site-supply-planning-for-drug","title":"Multisite supply planning for drug products under uncertainty","year":2021,"type":"journal","venue":"AIChE Journal","topics":["supply-chains","uncertainty"],"authors":["Apoorva M. Sampat","Ranjeet Kumar","Remya Pushpangatha Kurup","Kawa Chiu","Victor M. Saucedo","Ví­ctor M. Zavala"],"authorKeys":["lab:apoorva-sampat","lab:ranjeet-kumar","r-kurup","k-chiu","v-saucedo","v-zavala"],"doi":"10.1002/aic.17069","preprint":null,"url":"https://aiche.onlinelibrary.wiley.com/doi/full/10.1002/aic.17069","pdf":null,"citations":9,"abstract":"Abstract In the pharmaceutical industry, the goal of a supply planner is to make efficient capacity allocation decisions that ensure an uninterrupted supply of drug products to patients and to maintain product inventory levels close to the target stock. This task can be challenging due to the limited availability of manufacturing assets, uncertainties in product demand, fluctuations in production yields, and unplanned site downtimes. It is not uncommon to observe uneven distribution of product inventories with some products carrying excess inventories, while other products may be close to a stockout. Maintaining high stock levels can have economic repercussions due to the risk of expiration of unused products (whereas products facing a stockout can adversely affect the treatment regimen of patients). The network complexity of pharmaceutical supply‐chains coupled with regulatory constraints and siloed planning systems force supply planners to rely on manual (error‐prone) decision‐making processes. Such an approach results in suboptimal capacity allocation and inventory management decisions. In this work, we propose a stochastic optimization methodology for the production scheduling of multiple drug products in lyophilization units across multiple sites. The framework leverages information obtained from historical and forecast data to generate scenarios of uncertain parameters (e.g., yield, demand, and downtimes) that can realize in the future. The optimization model determines a product filling schedule that maintains product stock levels close to targets under diverse scenarios. We show that this approach helps in avoiding reactive scheduling and in maintaining a more robust production plan than deterministic procedures (which ignore uncertainty). Specifically, planning under a stochastic optimization approach reduces the number of scenarios under which backlogs are observed and also reduces the magnitude of the backlogs."},{"id":"2021-neural-network-feature-and-architecture-optimization","title":"Neural network feature and architecture optimization for injection molding surface defect prediction of model polypropylene","year":2021,"type":"journal","venue":"Polymer Engineering and Science","topics":["machine-learning","bayesian-optimization"],"authors":["Allen Jonathan Román","Shiyi Qin","Ví­ctor M. Zavala","Tim Andreas Osswald"],"authorKeys":["a-roman","lab:amy-qin","v-zavala","t-osswald"],"doi":"10.1002/pen.25765","preprint":null,"url":"https://doi.org/10.1002/pen.25765","pdf":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/pen.25765","citations":24,"abstract":"Abstract The industry is heading towards digitalization with production and quality assurance of processes and products. Novel practices such as machine learning or artificial intelligence make it possible for highly complex and nonlinear occurrences to be modeled and predicted with immense accuracy when real experiences are used to train the algorithm. For example, supervised learning in a closed‐loop system allows the user to analyze and predict outcomes and gives it the ability to adapt and add intelligence to the current system. This study focuses on the development of a neural network (NN) for surface defect prediction in injection molding of model polypropylene. Feature optimization allows us to conclude that rheological parameters such as the melt flow index and relaxation time () can improve predictive accuracy. Furthermore, Bayesian optimization is implemented to optimize the NN structure. The optimization approach allowed for a cross‐validation (CV) accuracy of 90.2% ± 4.4% with only five input parameters, while the seven‐input parameter optimized structure arrived at a CV accuracy of 92.4% ± 11.4%. Although the full‐feature structure optimized with Bayesian optimization concluded with slightly higher accuracy, the error range dramatically increased, meaning that this structure tends to overfit."},{"id":"2021-predicting-critical-micelle-concentrations-for-surfactants","title":"Predicting critical micelle concentrations for surfactants using graph convolutional neural networks","year":2021,"type":"journal","venue":"The Journal of Physical Chemistry B","topics":["machine-learning","molecular-sensing"],"authors":["Shiyi Qin","Tianyi Jin","Reid C. Van Lehn","Ví­ctor M. Zavala"],"authorKeys":["lab:amy-qin","t-jin","r-lehn","v-zavala"],"doi":"10.1021/acs.jpcb.1c05264","preprint":"https://doi.org/10.26434/chemrxiv.14384693","url":"https://doi.org/10.1021/acs.jpcb.1c05264","pdf":"https://doi.org/10.26434/chemrxiv.14384693","citations":66,"abstract":"Surfactants are amphiphilic molecules that are widely used in consumer products, industrial processes, and biological applications. A critical property of a surfactant is the critical micelle concentration (CMC), which is the concentration at which surfactant molecules undergo cooperative self-assembly in solution. Notably, the primary method to obtain CMCs experimentally-tensiometry-is laborious and expensive. In this study, we show that graph convolutional neural networks (GCNs) can predict CMCs directly from the surfactant molecular structure. In particular, we developed a GCN architecture that encodes the surfactant structure in the form of a molecular graph and trained it using experimental CMC data. We found that the GCN can predict CMCs with higher accuracy on a more inclusive data set than previously proposed methods and that it can generalize to anionic, cationic, zwitterionic, and nonionic surfactants using a single model. Molecular saliency maps revealed how atom types and surfactant molecular substructures contribute to CMCs and found this behavior to be in agreement with physical rules that correlate constitutional and topological information to CMCs. Following such rules, we proposed a small set of new surfactants for which experimental CMCs are not available; for these molecules, CMCs predicted with our GCN exhibited similar trends to those obtained from molecular simulations. These results provide evidence that GCNs can enable high-throughput screening of surfactants with desired self-assembly characteristics."},{"id":"2022-reducing-antisolvent-use-in-the-strap","title":"Reducing Antisolvent Use in the STRAP Process by Enabling a Temperature-Controlled Polymer Dissolution and Precipitation for the Recycling of Multilayer Plastic Films","year":2021,"type":"journal","venue":"ChemSusChem","topics":["plastics"],"authors":["Kevin L. Sánchez-Rivera","Panzheng Zhou","Min Soo Kim","Leonardo D. González","Steve Grey","Kevin Nelson","Shao-Chun Wang","Ive Hermans","Ví­ctor M. Zavala","Reid C. Van Lehn","George W. Huber"],"authorKeys":["k-sanchez","p-zhou","m-kim","lab:leo-gonzalez","s-grey","k-nelson","s-wang","i-hermans","v-zavala","r-lehn","g-huber"],"doi":"10.1002/cssc.202101128","preprint":null,"url":"https://doi.org/10.1002/cssc.202101128","pdf":null,"citations":107,"abstract":"The recently reported processing strategy called solvent-targeted recovery and precipitation (STRAP) enables deconstruction of multilayer plastic packaging films into their constituent resins by selective dissolution. It uses a series of solvent washes that are guided by thermodynamic calculations of polymer solubility. In this work, the use of antisolvents in the STRAP process was reduced and solvent mixtures were considered to enable the temperature-controlled dissolution and precipitation of the target polymers in multilayer films. This was considered as a means to further improve the STRAP process and its estimated costs. Two STRAP approaches were compared based on different polymer precipitation techniques: precipitation by the addition of an antisolvent (STRAP-A) and precipitation by decreasing the solvent temperature (STRAP-B). Both approaches were able to separate the constituent polymers in a post-industrial film composed primarily of polyethylene (PE), ethylene vinyl alcohol (EVOH), and polyethylene terephthalate (PET) with near 100 % material efficiency. Technoeconomic analysis indicates that the minimum selling price (MSP) of the recycled resins with STRAP-B is 21.0 % lower than that achieved with STRAP-A. This provides evidence that thermally driven polymer precipitation is an option to reduce the use of antisolvents, making the STRAP process more economically and environmentally attractive. A third process, STRAP-C, was demonstrated with another post-industrial multilayer film of a different composition. The results demonstrate that this process can also recover polymers at similar costs to those of virgin resins, indicating that the STRAP technology is flexible and can remain economically competitive as the plastic feed complexity is increased."},{"id":"2021-the-euler-characteristic-a-general-topological","title":"The Euler characteristic: A general topological descriptor for complex data","year":2021,"type":"journal","venue":"Computers & Chemical Engineering","topics":["topology-geometry"],"authors":["Alexander D. S. Smith","Ví­ctor M. Zavala"],"authorKeys":["lab:alexander-smith","v-zavala"],"doi":"10.1016/j.compchemeng.2021.107463","preprint":"https://arxiv.org/abs/2103.03144","url":"https://doi.org/10.1016/j.compchemeng.2021.107463","pdf":"https://doi.org/10.1016/j.compchemeng.2021.107463","citations":45,"abstract":null},{"id":"2021-using-atr-ftir-spectra-and-convolutional","title":"Using ATR-FTIR spectra and convolutional neural networks for characterizing mixed plastic waste","year":2021,"type":"journal","venue":"Computers & Chemical Engineering","topics":["plastics","machine-learning"],"authors":["Shengli Jiang","Zhuo Xu","Medhavi Kamran","Stas Zinchik","Sidike Paheding","Armando Gabriel McDonald","Ezra Bar-Ziv","Ví­ctor M. Zavala"],"authorKeys":["lab:shengli-jiang","z-xu","m-kamran","s-zinchik","s-paheding","a-mcdonald","e-bar","v-zavala"],"doi":"10.1016/j.compchemeng.2021.107547","preprint":"https://doi.org/10.26434/chemrxiv.14495388","url":"https://www.sciencedirect.com/science/article/pii/S0098135421003252","pdf":"https://doi.org/10.1016/j.compchemeng.2021.107547","citations":71,"abstract":"We present a convolutional neural network (CNN) framework for classifying different types of plastic materials that are commonly found in mixed plastic waste (MPW) streams. The CNN framework uses experimental ATR-FTIR (attenuated total reflection-Fourier transform infrared spectroscopy) spectra to classify ten different plastic types. We show that the approach reaches accuracies of over 87% and that some plastic types can be perfectly classified."},{"id":"2021-using-machine-learning-and-liquid-crystal","title":"Using machine learning and liquid crystal droplets to identify and quantify endotoxins from different bacterial species","year":2021,"type":"journal","venue":"The Analyst","topics":["molecular-sensing","machine-learning"],"authors":["Shengli Jiang","JungHyun Noh","Chulsoon Park","Alexander D. Smith","Nicholas Lawrence Abbott","Ví­ctor M. Zavala"],"authorKeys":["lab:shengli-jiang","j-noh","c-park","lab:alexander-smith","n-abbott","v-zavala"],"doi":"10.1039/d0an02220a","preprint":null,"url":"https://doi.org/10.1039/d0an02220a","pdf":null,"citations":47,"abstract":"Detection and quantification of bacterial endotoxins is important in a range of health-related contexts, including during pharmaceutical manufacturing of therapeutic proteins and vaccines. Here we combine experimental measurements based on nematic liquid crystalline droplets and machine learning methods to show that it is possible to classify bacterial sources (Escherichia coli, Pseudomonas aeruginosa, Salmonella minnesota) and quantify concentration of endotoxin derived from all three bacterial species present in aqueous solution. The approach uses flow cytometry to quantify, in a high-throughput manner, changes in the internal ordering of micrometer-sized droplets of nematic 4-cyano-4'-pentylbiphenyl triggered by the endotoxins. The changes in internal ordering alter the intensities of light side-scattered (SSC, large-angle) and forward-scattered (FSC, small-angle) by the liquid crystal droplets. A convolutional neural network (Endonet) is trained using the large data sets generated by flow cytometry and shown to predict endotoxin source and concentration directly from the FSC/SSC scatter plots. By using saliency maps, we reveal how EndoNet captures subtle differences in scatter fields to enable classification of bacterial source and quantification of endotoxin concentration over a range that spans eight orders of magnitude (0.01 pg mL-1 to 1 μg mL-1). We attribute changes in scatter fields with bacterial origin of endotoxin, as detected by EndoNet, to the distinct molecular structures of the lipid A domains of the endotoxins derived from the three bacteria. Overall, we conclude that the combination of liquid crystal droplets and EndoNet provides the basis of a promising analytical approach for endotoxins that does not require use of complex biologically-derived reagents (e.g., Limulus amoebocyte lysate)."},{"id":"2021-valuing-economic-impact-reductions-of-nutrient","title":"Valuing economic impact reductions of nutrient pollution from livestock waste","year":2021,"type":"journal","venue":"Resources Conservation and Recycling","topics":["waste-nutrients"],"authors":["Apoorva M. Sampat","Andrea Hicks","Gerardo J. Ruiz-Mercado","Ví­ctor M. Zavala"],"authorKeys":["lab:apoorva-sampat","a-hicks","g-ruiz","v-zavala"],"doi":"10.1016/j.resconrec.2020.105199","preprint":"https://doi.org/10.26434/chemrxiv.12324188","url":"https://www.sciencedirect.com/science/article/pii/S0921344920305164","pdf":"https://doi.org/10.1016/j.resconrec.2020.105199","citations":63,"abstract":"Nutrient pollution from livestock waste impacts both fresh and marine coastal waters. Harmful algae blooms (HABs) are a common ecosystem-level response to such pollution that is detrimental to both aquatic life and human health and that generates economic losses (e.g., property values and lost tourism). Waste treatment and management technologies are not well established practices due, in part, to the difficulty to attribute economic value to associated social and environmental impacts of nutrient pollution. In this work, we propose a computational framework to quantify the economic impacts of HABs. We demonstrate the advantage of quantifying these impacts through a case study on livestock waste management in the Upper Yahara watershed region (in the state of Wisconsin, USA). Our analysis reveals that every excess kilogram of phosphorus runoff from livestock waste results in total economic losses of 74.5 USD. Furthermore, we use a coordinated market analysis to demonstrate that this economic impact provides a strong enough incentive to activate a nutrient management and valorization market that can help balance phosphorus within the study area. The proposed framework can help state, tribes, and federal regulatory agencies develop regulatory and non-regulatory policies to mitigate the impacts of nutrient pollution."},{"id":"2020-a-logistics-analysis-for-advancing-carbon","title":"A Logistics Analysis for Advancing Carbon and Nutrient Recovery from Organic Waste","year":2020,"type":"chapter-report","venue":"CRC Press eBooks","topics":["waste-nutrients","supply-chains"],"authors":["Edgar Martín-Hernández","Apoorva M. Sampat","Mariano Martín","Ví­ctor M. Zavala","Gerardo J. Ruiz-Mercado"],"authorKeys":["e-martin","lab:apoorva-sampat","m-martin","v-zavala","g-ruiz"],"doi":"10.1201/9781003056157-12","preprint":null,"url":"https://www.taylorfrancis.com/chapters/edit/10.1201/9781003056157-12/logistics-analysis-advancing-carbon-nutrient-recovery-organic-waste-edgar-mart%C3%ADn-hern%C3%A1ndez-apoorva-sampat-mariano-martin-victor-zavala-gerardo-ruiz-mercado","pdf":null,"citations":2,"abstract":"Modern societies are characterized by the generation of large amounts of waste, arising from the production of goods and services to satisfy social demands. The traditional manufacturing pattern is one-way linear, following the raw material extraction from the environment, manufacturing, usage, disposal of goods, energy consumption, and discarding the generated residues along the linear path. The common CO 2 capture techniques are based on separation processes, such as gas-liquid chemical absorption, gas-solid physical adsorption, and permeation processes using membranes. A pressure swing adsorption operation is based on physical adsorption at moderate pressure and low-pressure regeneration at a constant temperature. Membrane separation technologies are based on the permeability of different gases through a membrane. The production of hydrocarbons is based on the dry reforming of biogas to produce renewable syngas, which is their precursor. The chapter discusses potential opportunities for the process design and logistics management of organic waste material under various types of government incentives."},{"id":"2020-machine-learning-framework-for-the-analysis","title":"A machine learning framework for the analysis and prediction of catalytic activity from experimental data","year":2020,"type":"journal","venue":"Applied Catalysis B: Environmental","topics":["machine-learning","molecular-sensing"],"authors":["Alexander D. S. Smith","Andrea Keane","James A. Dumesic","George W. Huber","Ví­ctor M. Zavala"],"authorKeys":["lab:alexander-smith","a-keane","j-dumesic","g-huber","v-zavala"],"doi":"10.1016/j.apcatb.2019.118257","preprint":null,"url":"https://doi.org/10.1016/j.apcatb.2019.118257","pdf":null,"citations":135,"abstract":null},{"id":"2020-adaptive-learning-model-predictive-control-for","title":"Adaptive-learning model predictive control for complex physiological systems: Automated insulin delivery in diabetes","year":2020,"type":"journal","venue":"Annual Reviews in Control","topics":["control","biological-systems"],"authors":["Mohammad Reza Askari","Iman Hajizadeh","Mudassir Mohammad Rashid","Nicole Hobbs","Ví­ctor M. Zavala","Ali Çınar","Ali Cinar"],"authorKeys":["m-askari","i-hajizadeh","m-rashid","n-hobbs","v-zavala","a-cnar","a-cinar"],"doi":"10.1016/j.arcontrol.2020.10.004","preprint":null,"url":"https://doi.org/10.1016/j.arcontrol.2020.10.004","pdf":null,"citations":41,"abstract":null},{"id":"2020-characterizing-the-predictive-accuracy-of-dynamic","title":"Characterizing the Predictive Accuracy of Dynamic Mode Decomposition for Data-Driven Control","year":2020,"type":"conference","venue":"IFAC-PapersOnLine","topics":["control","machine-learning"],"authors":["Qiugang Lu","Sungho Shin","Ví­ctor M. Zavala"],"authorKeys":["lab:qiugang-lu","lab:sungho-shin","v-zavala"],"doi":"10.1016/j.ifacol.2020.12.373","preprint":"https://arxiv.org/abs/2003.01028","url":"https://drive.google.com/open?id=12NHjKTKZC2EzVviHCxYh_hIhRPr1caE8","pdf":"https://doi.org/10.1016/j.ifacol.2020.12.373","citations":5,"abstract":"Dynamic mode decomposition (DMD) is a versatile approach that enables the construction of low-order models from data. Controller design tasks based on such models require estimates and guarantees on predictive accuracy. In this work, we provide a theoretical analysis of DMD model errors that reveals impacts of model order and data availability. The analysis also establishes conditions under which DMD models can be made asymptotically exact. We numerically validate our theoretical results using a 2D diffusion system."},{"id":"2020-computational-notebooks-in-chemical-engineering-curricula","title":"Computational Notebooks in Chemical Engineering Curricula.","year":2020,"type":"journal","venue":"Chemical Engineering Education","topics":["education"],"authors":["Jonathan Verrett","Fani Boukouvala","Alexander W. Dowling","Zachary Ward Ulissi","Ví­ctor M. Zavala"],"authorKeys":["j-verrett","f-boukouvala","lab:alexander-dowling","z-ulissi","v-zavala"],"doi":"10.18260/2-1-370.660-116661","preprint":null,"url":"https://journals.flvc.org/cee/article/view/116661","pdf":"https://journals.flvc.org/cee/article/download/116661/122663","citations":9,"abstract":"Computational notebooks are an increasingly common tool used to support student learning in a variety of contexts where computer programming can be applied. These notebooks provide an easily distributable method of displaying text and images, as well as sections of computer code that can be manipulated and run in real-time. This format allows instructors to introduce content and methodologies to students in a single document that can be copied and manipulated. In this paper we outline case studies of computational notebook usage at a variety of institutions. These notebooks have been successfully used in required and elective courses from the undergraduate sophomore-level to the graduate level. In each case study, implementation, pedagogical strategies, and results are discussed."},{"id":"2020-convolutional-network-analysis-of-optical-micrographs","title":"Convolutional Network Analysis of Optical Micrographs for Liquid Crystal Sensors","year":2020,"type":"journal","venue":"The Journal of Physical Chemistry C","topics":["molecular-sensing","machine-learning"],"authors":["Alexander D. S. Smith","Nicholas Lawrence Abbott","Ví­ctor M. Zavala"],"authorKeys":["lab:alexander-smith","n-abbott","v-zavala"],"doi":"10.1021/acs.jpcc.0c01942","preprint":"https://doi.org/10.26434/chemrxiv.11688924.v2","url":"https://pubs.acs.org/doi/abs/10.1021/acs.jpcc.0c01942","pdf":"https://chemrxiv.org/engage/api-gateway/chemrxiv/assets/orp/resource/item/60c748cc702a9bd35f18b046/original/convolutional-network-analysis-of-optical-micrographs.pdf","citations":57,"abstract":"We provide an in-depth convolutional neural network (CNN) analysis of optical responses of liquid crystals (LCs) when exposed to different chemical environments. Our aim is to identify informative features that can be used to construct automated LC-based chemical sensors and shed some light on the underlying phenomenon that governs and distinguishes LC responses. Previous work demonstrated that, by using features extracted from AlexNet, grayscale micrographs of different LC responses can be classified with an accuracy of 99%. Reaching such high levels of accuracy, however, required the use of a large number of features (on the order of thousands), which was computationally intensive and clouded the physical interpretability of the dominant features. To address these issues, here we report a study on the effectiveness of using features extracted from color micrographs using VGG16, which is a more compact CNN than Alexnet. Our analysis reveals that features extracted from the first and second convolutional layers of VGG16 are sufficient to achieve a perfect classification accuracy while reducing the number of features to less than 100. The number of features is further reduced to 10 via recursive elimination with a minimal loss in classification accuracy (5–10%). This reduction procedure reveals that differences in spatial color patterns are developed within seconds in the LC response. From this, we conclude that hue distributions provide an informative set of features that can be used to characterize LC sensor responses. We also hypothesize that differences in the spatial correlation length of LC textures detected by VGG16 with DMMP and water likely reflect differences in the anchoring energy of the LC on the surface of the sensor. Our results hint at fresh approaches for the design of LC-based sensors based on the characterization of spontaneous fluctuations in the orientation (as opposed to changes in time-average orientations reported in the literature)."},{"id":"2020-decentralized-schemes-with-overlap-for-solving","title":"Decentralized schemes with overlap for solving graph-structured optimization problems","year":2020,"type":"journal","venue":"IEEE Transactions on Control of Network Systems","topics":["optimization-algorithms","graph-modeling"],"authors":["Sungho Shin","Victor M. Zavala","Mihai Anitescu"],"authorKeys":["lab:sungho-shin","v-zavala","m-anitescu"],"doi":"10.1109/tcns.2020.2967805","preprint":"https://arxiv.org/abs/1810.00491","url":"https://arxiv.org/abs/1810.00491","pdf":"https://arxiv.org/pdf/1810.00491","citations":28,"abstract":"We present a new algorithmic paradigm for the decentralized solution of graph-structured optimization problems that arise in the estimation and control of network systems. A key and novel design concept of the proposed approach is that it uses overlapping subdomains to promote and accelerate convergence. We show that the algorithm converges if the size of the overlap is sufficiently large and that the convergence rate improves exponentially with the size of the overlap. The proposed approach provides a bridge between fully decentralized and centralized architectures and is flexible in that it enables the implementation of asynchronous schemes, handling of constraints, and balancing of computing, communication, and data privacy needs. The proposed scheme is tested in an estimation problem for a 9241-node power network and we show that it outperforms the alternating direction method of multipliers."},{"id":"2021-evaluating-landfill-diversion-strategies-for-municipal","title":"Evaluating landfill diversion strategies for municipal organic waste management using environmental and economic factors","year":2020,"type":"journal","venue":"ACS Sustainable Chemistry & Engineering","topics":["waste-nutrients"],"authors":["Philip Tominac","Horacio A. Aguirre-Villegas","Joseph R. Sanford","Rebecca A. Larson","Ví­ctor M. Zavala"],"authorKeys":["lab:philip-tominac","h-aguirre","j-sanford","r-larson","v-zavala"],"doi":"10.1021/acssuschemeng.0c07784","preprint":"https://doi.org/10.26434/chemrxiv.13224734","url":"https://doi.org/10.1021/acssuschemeng.0c07784","pdf":"https://doi.org/10.26434/chemrxiv.13224734","citations":22,"abstract":"Municipal organic waste (MOW) contributes to greenhouse gas (GHG) emissions leading to global climate change. Incentives that encourage consumers to adopt MOW disposal strategies that minimize environmental impacts are needed. Policymakers must ensure that incentive programs align with environmental objectives and are economically competitive. The MOW disposal infrastructure in the city of Milwaukee, WI, was evaluated using a coordinated market model capturing the inherent value of environmental indicators (estimated with partial life cycle assessment methods) in the context of the city’s MOW supply chain. Tax programs are identified that incentivize consumers to reduce emissions through MOW disposal patterns. Results indicate that the existing MOW management infrastructure in Milwaukee incentivizes residents to minimize MOW GHG emissions by sending MOW to composting and digestion sites that have lower tipping fees and are located closer to the city (have lower transport costs). Therefore, limitations associated with MOW collection likely decrease alternative landfill disposal options. GHG reduction policy prioritizes anaerobic digestion systems for MOW disposal, but the outcome can be altered depending upon the tipping fees and transport distances. Composting and digestion hold few opportunities for reducing ammonia emissions from landfills, but there is a need to expand ammonia emissions measurements from landfill systems to improve model predictions as ammonia losses can redeposit, resulting in environmental issues and indirect formation of N 2 O."},{"id":"2020-fast-predictions-of-liquid-phase-acid","title":"Fast predictions of liquid-phase acid-catalyzed reaction rates using molecular dynamics simulations and convolutional neural networks","year":2020,"type":"journal","venue":"Chemical Science","topics":["molecular-sensing","machine-learning"],"authors":["Alex K. Chew","Shengli Jiang","Weiqi Zhang","Ví­ctor M. Zavala","Reid C. Van Lehn"],"authorKeys":["a-chew","lab:shengli-jiang","lab:weiqi-zhang","v-zavala","r-lehn"],"doi":"10.1039/d0sc03261a","preprint":"https://doi.org/10.26434/chemrxiv.11299121","url":"https://pubs.rsc.org/en/content/articlehtml/2020/sc/d0sc03261a","pdf":"https://pubs.rsc.org/en/content/articlepdf/2020/sc/d0sc03261a","citations":40,"abstract":"The rates of liquid-phase, acid-catalyzed reactions relevant to the upgrading of biomass into high-value chemicals are highly sensitive to solvent
