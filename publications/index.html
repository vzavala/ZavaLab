 composition and identifying suitable solvent mixtures is theoretically and experimentally challenging. We show that the complex atomistic configurations of reactant-solvent environments generated by classical molecular dynamics simulations can be exploited by 3D convolutional neural networks to enable accurate predictions of Brønsted acid-catalyzed reaction rates for model biomass compounds. We develop a 3D convolutional neural network, which we call SolventNet, and train it to predict acid-catalyzed reaction rates using experimental reaction data and corresponding molecular dynamics simulation data for seven biomass-derived oxygenates in water-cosolvent mixtures. We show that SolventNet can predict reaction rates for additional reactants and solvent systems an order of magnitude faster than prior simulation methods. This combination of machine learning with molecular dynamics enables the rapid, high-throughput screening of solvent systems and identification of improved biomass conversion conditions."},{"id":"2020-flexibility-from-networks-of-data-centers","title":"Flexibility from networks of data centers: A market clearing formulation with virtual links","year":2020,"type":"conference","venue":"Electric Power Systems Research","topics":["energy-systems","markets-decisions"],"authors":["Weiqi Zhang","Line Roald","Andrew A. Chien","John R. Birge","Ví­ctor M. Zavala"],"authorKeys":["lab:weiqi-zhang","l-roald","a-chien","j-birge","v-zavala"],"doi":"10.1016/j.epsr.2020.106723","preprint":"https://arxiv.org/abs/1910.05443","url":"https://docs.google.com/a/wisc.edu/viewer?a=v&pid=sites&srcid=d2lzYy5lZHV8emF2YWxhYnxneDo2MWM2YWRiMDRiOWRmYTVm","pdf":"https://doi.org/10.1016/j.epsr.2020.106723","citations":26,"abstract":null},{"id":"2020-hybrid-optimization-strategies-for-the-transient","title":"Hybrid Optimization Strategies for the Transient Operation of Natural Gas Pipelines","year":2020,"type":"conference","venue":"PSIG Annual Meeting","topics":["energy-systems","control"],"authors":["Jordan Jalving","Richard Carter","Ví­ctor M. Zavala"],"authorKeys":["lab:jordan-jalving","r-carter","v-zavala"],"doi":null,"preprint":null,"url":"https://docs.google.com/a/wisc.edu/viewer?a=v&pid=sites&srcid=d2lzYy5lZHV8emF2YWxhYnxneDo3OGQ1YjI0ZmE2YjEyNzMy","pdf":null,"citations":2,"abstract":null},{"id":"2020-integrating-mpc-with-learning-based-and","title":"Integrating MPC with Learning-Based and Adaptive Methods to Enhance Safety, Performance and Reliability in Automated Insulin Delivery","year":2020,"type":"conference","venue":"IFAC-PapersOnLine","topics":["biological-systems","control"],"authors":["Iman Hajizadeh","Mohammad Reza Askari","Ranjeet Kumar","Ví­ctor M. Zavala","Ali Çınar","Ali Cinar"],"authorKeys":["i-hajizadeh","m-askari","lab:ranjeet-kumar","v-zavala","a-cnar","a-cinar"],"doi":"10.1016/j.ifacol.2020.12.438","preprint":null,"url":"https://docs.google.com/a/wisc.edu/viewer?a=v&pid=sites&srcid=d2lzYy5lZHV8emF2YWxhYnxneDo2MzEyMGNmZjVjMWRjOWI4","pdf":"https://doi.org/10.1016/j.ifacol.2020.12.438","citations":3,"abstract":"In this work, an adaptive-learning model predictive control (AL-MPC) framework that integrates disturbance forecasting, uncertainty quantification, learning, and recursive subspace identification is developed. The proposed technique can be used for continuous systems affected by repetitive disturbances with unknown periods. The AL-MPC integrates online learning from historical data to anticipate impending disturbances and proactively counteract their effects to an adaptive MPC. This is done by using machine learning to quantify the significant disturbances from historical data and forecast their future evolution time series. Behavior patterns of the system can be identified from historical data, and the set-point, objective function weights, and constraints of the controller can be modified in advance for the anticipated time periods of the disturbance effects. AL-MPC is used to regulate glucose concentration (GC) in people with diabetes by automated insulin delivery. Simulation results indicate that the AL-MPC can regulate the BGC 75.4% of the simulation time in the target range (70-180) mg/dL without causing any hypoglycemia and hyperglycemia events."},{"id":"2020-measuring-and-optimizing-system-reliability-a","title":"Measuring and optimizing system reliability: a stochastic programming approach","year":2020,"type":"journal","venue":"Top","topics":["uncertainty"],"authors":["Joshua L. Pulsipher","Victor M. Zavala"],"authorKeys":["lab:joshua-pulsipher","v-zavala"],"doi":"10.1007/s11750-020-00550-5","preprint":"https://arxiv.org/abs/2106.12712","url":"https://arxiv.org/ct?url=https%3A%2F%2Fdx.doi.org%2F10.1007%2Fs11750-020-00550-5&v=5e2b6377","pdf":"https://arxiv.org/pdf/2106.12712","citations":10,"abstract":null},{"id":"2020-modularity-measures-concepts-computation-and-applications","title":"Modularity Measures: Concepts, Computation, and Applications to Manufacturing Systems","year":2020,"type":"journal","venue":"AIChE Journal","topics":["supply-chains"],"authors":["Yue Shao","Ví­ctor M. Zavala"],"authorKeys":["lab:yue-shao","v-zavala"],"doi":"10.1002/aic.16965","preprint":null,"url":"https://doi.org/10.1002/aic.16965","pdf":null,"citations":27,"abstract":"Abstract We propose a measure to quantify the modularity of industrial production (manufacturing) systems and optimization formulations to compute it. From a manufacturing perspective, we argue that a system is deemed modular if: (a) the equipment units that comprise it form clusters (modules) of dense connectivity (i.e., difficult module assembly tasks are performed off‐site), (b) connectivity between modules is sparse (i.e., easy assembly tasks are performed on‐site), (c) the number of modules is small, and (d) the module dimensions facilitate transportation. We show that the measure proposed satisfies these requirements and that it can be computed by solving a convex mixed‐integer quadratic program. We provide a discussion on advantages and disadvantages of alternative modularity measures used in different scientific and engineering communities. Our results seek to highlight conceptual and computational challenges that arise from the need to define and quantify modularity in a manufacturing context."},{"id":"2020-multiscale-model-predictive-control-of-battery","title":"Multiscale model predictive control of battery systems for frequency regulation markets using physics-based models","year":2020,"type":"journal","venue":"Journal of Process Control","topics":["control","energy-systems"],"authors":["Yankai Cao","Seong Beom Lee","Venkat R. Subramanian","Ví­ctor M. Zavala"],"authorKeys":["lab:yankai-cao","s-lee","v-subramanian","v-zavala"],"doi":"10.1016/j.jprocont.2020.04.001","preprint":"https://arxiv.org/abs/2004.05727","url":"https://doi.org/10.1016/j.jprocont.2020.04.001","pdf":"https://doi.org/10.1016/j.jprocont.2020.04.001","citations":28,"abstract":null},{"id":"2020-optimal-constraint-based-regularization-for-parameter","title":"Optimal constraint-based regularization for parameter estimation problems","year":2020,"type":"journal","venue":"Computers & Chemical Engineering","topics":["optimization-algorithms"],"authors":["Caroline S.M. Nakama","Galo A.C. Le Roux","Ví­ctor M. Zavala"],"authorKeys":["lab:caroline-satye","g-roux","v-zavala"],"doi":"10.1016/j.compchemeng.2020.106873","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2020.106873","pdf":"https://www.sciencedirect.com/science/article/am/pii/S0098135419313699?via%3Dihub","citations":10,"abstract":null},{"id":"nd-optimization-of-municipal-solid-waste-management","title":"Optimization of municipal solid waste management using a coordinated framework","year":2020,"type":"journal","venue":"Waste Management","topics":["waste-nutrients","markets-decisions"],"authors":["Aurora del Carmen Munguía-López","Ví­ctor M. Zavala","José Ezequiel Santibañez-Aguilar","José María Ponce-Ortega"],"authorKeys":["lab:aurora-munguia","v-zavala","j-santibanez","j-ponce"],"doi":"10.1016/j.wasman.2020.07.006","preprint":null,"url":"https://www.sciencedirect.com/science/article/pii/S0956053X2030372X?casa_token=E6XLQvrc32YAAAAA:yOFAaVvveM3CjySqIg3BJfUM7cGxUcleHenuec6MYCXG7r1BUUGP7TV_OCilnREIrSM_kJ2ObQ","pdf":null,"citations":32,"abstract":null},{"id":"2020-overlapping-schwarz-decomposition-for-constrained-quadratic","title":"Overlapping Schwarz Decomposition for Constrained Quadratic Programs","year":2020,"type":"conference","venue":"Proceedings of the IEEE Conference on Decision & Control, including the Symposium on Adaptive Processes","topics":["optimization-algorithms","graph-modeling"],"authors":["Sungho Shin","Mihai Anitescu","Victor M. Zavala"],"authorKeys":["lab:sungho-shin","m-anitescu","v-zavala"],"doi":"10.1109/cdc42340.2020.9304139","preprint":"https://arxiv.org/abs/2003.07502","url":"https://arxiv.org/abs/2003.07502","pdf":"https://arxiv.org/pdf/2003.07502","citations":9,"abstract":"We present an overlapping Schwarz decomposition algorithm for constrained quadratic programs (QPs). Schwarz algorithms have been traditionally used to solve linear algebra systems arising from partial differential equations, but we have recently shown that they are also effective at solving structured optimization problems. In the proposed scheme, we consider QPs whose algebraic structure can be represented by graphs. The graph domain is partitioned into overlapping subdomains (yielding a set of coupled subproblems), solutions for the subproblems are computed in parallel, and convergence is enforced by updating primal-dual information in the overlapping regions. We show that convergence is guaranteed if the overlap is sufficiently large and that the convergence rate improves exponentially with the size of the overlap. Convergence results rely on a key property of graph-structured problems that is known as exponential decay of sensitivity. Here, we establish conditions under which this property holds for constrained QPs (as those found in network optimization and optimal control), thus extending existing work that addresses unconstrained QPs. The numerical behavior of the Schwarz scheme is demonstrated by using a DC optimal power flow problem defined over a network with 9,241 nodes."},{"id":"2020-scalable-preconditioning-of-block-structured-linear","title":"Scalable preconditioning of block-structured linear algebra systems using ADMM","year":2020,"type":"journal","venue":"Computers & Chemical Engineering","topics":["optimization-algorithms","uncertainty"],"authors":["Jose S. Rodriguez","Carl D. Laird","Ví­ctor M. Zavala"],"authorKeys":["j-rodriguez","c-laird","v-zavala"],"doi":"10.1016/j.compchemeng.2019.06.003","preprint":"https://arxiv.org/abs/1904.11003","url":"https://doi.org/10.1016/j.compchemeng.2019.06.003","pdf":"https://doi.org/10.1016/j.compchemeng.2019.06.003","citations":8,"abstract":null},{"id":"2020-stochastic-model-predictive-control-for-central","title":"Stochastic model predictive control for central HVAC plants","year":2020,"type":"journal","venue":"Journal of Process Control","topics":["control","uncertainty"],"authors":["Ranjeet Kumar","Michael J. Wenzel","Mohammad N. ElBsat","Michael J. Risbeck","Kirk H. Drees","Ví­ctor M. Zavala"],"authorKeys":["lab:ranjeet-kumar","m-wenzel","m-elbsat","m-risbeck","k-drees","v-zavala"],"doi":"10.1016/j.jprocont.2020.03.015","preprint":"https://arxiv.org/abs/2002.10065","url":"https://www.sciencedirect.com/science/article/pii/S0959152420301943","pdf":"https://arxiv.org/pdf/2002.10065","citations":43,"abstract":null},{"id":"2021-topological-data-analysis-concepts-computation-and","title":"Topological Data Analysis: Concepts, Computation, and Applications in Chemical Engineering","year":2020,"type":"journal","venue":"Computers & Chemical Engineering","topics":["topology-geometry"],"authors":["Alexander D. S. Smith","Paweł Dłotko","Ví­ctor M. Zavala","Pawel Dlotko"],"authorKeys":["lab:alexander-smith","p-dotko","v-zavala","p-dlotko"],"doi":"10.1016/j.compchemeng.2020.107202","preprint":"https://arxiv.org/abs/2006.03173","url":"https://doi.org/10.1016/j.compchemeng.2020.107202","pdf":"https://doi.org/10.1016/j.compchemeng.2020.107202","citations":80,"abstract":null},{"id":"2020-unifying-theorems-for-subspace-identification-and","title":"Unifying Theorems for Subspace Identification and Dynamic Mode Decomposition","year":2020,"type":"chapter-report","venue":"arXiv (Cornell University)","topics":["control","machine-learning"],"authors":["Sungho Shin","Qiugang Lu","Ví­ctor M. Zavala"],"authorKeys":["lab:sungho-shin","lab:qiugang-lu","v-zavala"],"doi":"10.48550/arXiv.2003.07410","preprint":null,"url":"https://arxiv.org/abs/2003.07410","pdf":"https://arxiv.org/pdf/2003.07410","citations":3,"abstract":"This paper presents unifying results for subspace identification (SID) and dynamic mode decomposition (DMD) for autonomous dynamical systems. We observe that SID seeks to solve an optimization problem to estimate an extended observability matrix and a state sequence that minimizes the prediction error for the state-space model. Moreover, we observe that DMD seeks to solve a rank-constrained matrix regression problem that minimizes the prediction error of an extended autoregressive model. We prove that existence conditions for perfect (error-free) state-space and low-rank extended autoregressive models are equivalent and that the SID and DMD optimization problems are equivalent. We exploit these results to propose a SID-DMD algorithm that delivers a provably optimal model and that is easy to implement. We demonstrate our developments using a case study that aims to build dynamical models directly from video data."},{"id":"2019-a-chance-constrained-nonlinear-programming-approach","title":"A Chance-Constrained Nonlinear Programming Approach for Equipment Design Under Uncertainty","year":2019,"type":"conference","venue":"Computer-aided chemical engineering/Computer aided chemical engineering","topics":["uncertainty"],"authors":["Javier Tovar-Facio","Yankai Cao","José María Ponce-Ortega","Ví­ctor M. Zavala"],"authorKeys":["lab:javier-tovar","lab:yankai-cao","j-ponce","v-zavala"],"doi":"10.1016/b978-0-12-818634-3.50167-3","preprint":null,"url":"https://doi.org/10.1016/b978-0-12-818634-3.50167-3","pdf":null,"citations":0,"abstract":null},{"id":"2019-a-computational-framework-for-quantifying-and","title":"A computational framework for quantifying and analyzing system flexibility","year":2019,"type":"journal","venue":"Computers & Chemical Engineering","topics":["uncertainty"],"authors":["Joshua L. Pulsipher","Daniel Rios","Ví­ctor M. Zavala"],"authorKeys":["lab:joshua-pulsipher","d-rios","v-zavala"],"doi":"10.1016/j.compchemeng.2019.04.024","preprint":"https://arxiv.org/abs/2106.12706","url":"https://www.sciencedirect.com/science/article/pii/S0098135418312559","pdf":"https://doi.org/10.1016/j.compchemeng.2019.04.024","citations":21,"abstract":null},{"id":"2019-a-hierarchical-optimization-architecture-for-large","title":"A hierarchical optimization architecture for large-scale power networks","year":2019,"type":"journal","venue":"IEEE Transactions on Control of Network Systems","topics":["energy-systems","optimization-algorithms"],"authors":["Sungho Shin","Philip Hart","Thomas M. Jahns","Victor M. Zavala"],"authorKeys":["lab:sungho-shin","p-hart","t-jahns","v-zavala"],"doi":"10.1109/tcns.2019.2906917","preprint":"https://arxiv.org/abs/2002.09796","url":"https://ieeexplore.ieee.org/document/8673642","pdf":"https://arxiv.org/pdf/2002.09796","citations":25,"abstract":"We present a hierarchical optimization architecture for large-scale power networks that overcomes limitations of fully centralized and fully decentralized architectures. The architecture leverages principles of multigrid computing schemes, which are widely used in the solution of partial differential equations on massively parallel computers. The top layer of the architecture uses a coarse representation of the entire network, whereas the bottom layer is composed of a family of decentralized optimization agents each operating on a network subdomain at full resolution. We use an alternating direction method of multipliers (ADMM) framework to drive coordination of the decentralized agents. We show that state and dual information obtained from the top layer can be used to accelerate the coordination of the decentralized optimization agents and to recover optimality for the entire system. We demonstrate that the hierarchical architecture can be used to manage large collections of microgrids."},{"id":"2019-a-parallel-decomposition-scheme-for-solving","title":"A Parallel Decomposition Scheme for Solving Long-Horizon Optimal Control Problems","year":2019,"type":"conference","venue":"Proceedings of the IEEE Conference on Decision & Control, including the Symposium on Adaptive Processes","topics":["optimization-algorithms","control"],"authors":["Sungho Shin","Timm Faulwasser","Mario Zanon","Ví­ctor M. Zavala"],"authorKeys":["lab:sungho-shin","t-faulwasser","m-zanon","v-zavala"],"doi":"10.1109/cdc40024.2019.9030139","preprint":"https://arxiv.org/abs/1903.01055","url":"https://ieeexplore.ieee.org/document/9030139","pdf":"https://arxiv.org/pdf/1903.01055","citations":25,"abstract":"We present a temporal decomposition scheme for solving long-horizon optimal control problems. The time domain is decomposed into a set of subdomains with partially overlapping regions. Subproblems associated with the subdomains are solved in parallel to obtain local primal-dual trajectories that are assembled to obtain the global trajectories. We provide a sufficient condition that guarantees convergence of the proposed scheme. This condition states that the effect of perturbations on the boundary conditions (i.e., the initial state and terminal dual/adjoint variable) should decay asymptotically as one moves away from the boundaries. This condition also reveals that the scheme converges if the size of the overlap is sufficiently large and that the convergence rate improves with the size of the overlap. We prove that linear quadratic problems satisfy the asymptotic decay condition, and we discuss numerical strategies to determine if the condition holds in more general cases. We draw upon a non-convex optimal control problem to illustrate the performance of the proposed scheme."},{"id":"2019-a-scalable-global-optimization-algorithm-for","title":"A scalable global optimization algorithm for stochastic nonlinear programs","year":2019,"type":"journal","venue":"Journal of Global Optimization","topics":["optimization-algorithms","uncertainty"],"authors":["Yankai Cao","Ví­ctor M. Zavala"],"authorKeys":["lab:yankai-cao","v-zavala"],"doi":"10.1007/s10898-019-00769-y","preprint":null,"url":"https://link.springer.com/article/10.1007/s10898-019-00769-y","pdf":null,"citations":13,"abstract":null},{"id":"2019-a-scalable-stochastic-programming-approach-for","title":"A scalable stochastic programming approach for the design of flexible systems","year":2019,"type":"journal","venue":"Computers & Chemical Engineering","topics":["uncertainty"],"authors":["Joshua L. Pulsipher","Ví­ctor M. Zavala"],"authorKeys":["lab:joshua-pulsipher","v-zavala"],"doi":"10.1016/j.compchemeng.2019.05.033","preprint":"https://arxiv.org/abs/2106.12708","url":"https://www.sciencedirect.com/science/article/pii/S0098135419302583","pdf":"https://www.sciencedirect.com/science/article/am/pii/S0098135419302583?via%3Dihub","citations":7,"abstract":null},{"id":"2019-an-asynchronous-bundle-trust-region-method","title":"An asynchronous bundle-trust-region method for dual decomposition of stochastic mixed-integer programming","year":2019,"type":"journal","venue":"SIAM Journal on Optimization","topics":["optimization-algorithms","uncertainty"],"authors":["Kibaek Kim","Cosmin G. Petra","Ví­ctor M. Zavala"],"authorKeys":["lab:kibaek-kim","c-petra","v-zavala"],"doi":"10.1137/17m1148189","preprint":null,"url":"https://epubs.siam.org/doi/abs/10.1137/17M1148189","pdf":null,"citations":30,"abstract":"We present an asynchronous bundle-trust-region algorithm within the context of Lagrangian dual decomposition for stochastic mixed-integer programs. The approach solves the Lagrangian master problem by using a bundle method with a trust-region constraint. This scheme enables asynchronous computations and can thus help mitigate severe load imbalance issues (associated with the solution of scenario subproblems) and improve parallel efficiency. We provide a convergence analysis and an implementation of the proposed scheme. We also present extensive numerical results on eighty instances of a large-scale stochastic unit commitment problem, and demonstrate that the proposed approach provides significant reductions in solution time and achieves strong scaling."},{"id":"2019-an-economic-model-predictive-control-framework","title":"An economic model predictive control framework for mechanical pulping processes","year":2019,"type":"journal","venue":"Control Engineering Practice","topics":["control"],"authors":["Hui Tian","Qiugang Lu","R. Bhushan Gopaluni","Ví­ctor M. Zavala","James A. Olson"],"authorKeys":["h-tian","lab:qiugang-lu","r-gopaluni","v-zavala","j-olson"],"doi":"10.1016/j.conengprac.2019.01.008","preprint":null,"url":"https://doi.org/10.1016/j.conengprac.2019.01.008","pdf":null,"citations":31,"abstract":null},{"id":"2019-benchmarking-stochastic-and-deterministic-mpc-a","title":"Benchmarking stochastic and deterministic MPC: A case study in stationary battery systems","year":2019,"type":"journal","venue":"AIChE Journal","topics":["control","uncertainty","energy-systems"],"authors":["Ranjeet Kumar","Jordan Jalving","Michael J. Wenzel","Matthew J. Ellis","Mohammad N. ElBsat","Kirk H. Drees","Ví­ctor M. Zavala"],"authorKeys":["lab:ranjeet-kumar","lab:jordan-jalving","m-wenzel","m-ellis","m-elbsat","k-drees","v-zavala"],"doi":"10.1002/aic.16551","preprint":null,"url":"https://onlinelibrary.wiley.com/doi/full/10.1002/aic.16551","pdf":null,"citations":24,"abstract":"Abstract We present a computational framework that integrates forecasting, uncertainty quantification, and model predictive control (MPC) to benchmark the performance of deterministic and stochastic MPC. By means of a battery management case study, we illustrate how off‐the‐shelf deterministic MPC implementations can suffer significant losses in performance and constraint violations due to their inability to handle disturbances that cannot be adequately represented by mean (most likely) forecasts. We also show that adding constraint back‐off terms can help ameliorate these issues but this approach is ad hoc and does not provide performance guarantees. Stochastic MPC provides a more systematic framework to handle these issues by directly capturing uncertainty descriptions of a wide range of disturbances."},{"id":"2019-coordinated-management-of-organic-waste-and","title":"Coordinated management of organic waste and derived products","year":2019,"type":"journal","venue":"Computers & Chemical Engineering","topics":["waste-nutrients","supply-chains"],"authors":["Apoorva M. Sampat","Yicheng Hu","Mahmoud A. Sharara","Horacio A. Aguirre-Villegas","Gerardo J. Ruiz-Mercado","Rebecca A. Larson","Ví­ctor M. Zavala","Yicheng Hu"],"authorKeys":["lab:apoorva-sampat","lab:yicheng-hu","m-sharara","h-aguirre","g-ruiz","r-larson","v-zavala","lab:yicheng-hu"],"doi":"10.1016/j.compchemeng.2019.06.008","preprint":null,"url":"https://www.sciencedirect.com/science/article/pii/S009813541930119X","pdf":"https://doi.org/10.1016/j.compchemeng.2019.06.008","citations":33,"abstract":null},{"id":"2019-electricity-markets-incentivize-technology-modularization","title":"Electricity Markets Incentivize Technology Modularization","year":2019,"type":"conference","venue":"Proceedings of Foundations of Computer-Aided Process Design (FOCAPD)","topics":["energy-systems","markets-decisions"],"authors":["Y. Shao","V.M Zavala"],"authorKeys":["lab:yue-shao","v-zavala"],"doi":null,"preprint":null,"url":null,"pdf":null,"citations":null,"abstract":null},{"id":"2019-fairness-measures-for-decision-making-and","title":"Fairness measures for decision-making and conflict resolution","year":2019,"type":"journal","venue":"Optimization and Engineering","topics":["markets-decisions"],"authors":["Apoorva M. Sampat","Ví­ctor M. Zavala"],"authorKeys":["lab:apoorva-sampat","v-zavala"],"doi":"10.1007/s11081-019-09452-3","preprint":null,"url":"https://link.springer.com/article/10.1007/s11081-019-09452-3","pdf":null,"citations":41,"abstract":null},{"id":"2019-fairness-measures-for-decision-making-and-2","title":"Fairness Measures for Decision-Making and Conflict Resolution","year":2019,"type":"conference","venue":"Proceedings of Foundations of Computer-Aided Process Design (FOCAPD)","topics":["markets-decisions"],"authors":["A. Sampat","V.M Zavala"],"authorKeys":["lab:apoorva-sampat","v-zavala"],"doi":null,"preprint":null,"url":null,"pdf":null,"citations":null,"abstract":null},{"id":"2019-fairness-guided-design-of-water-distribution","title":"Fairness-guided design of water distribution networks for agricultural lands","year":2019,"type":"journal","venue":"Computers & Chemical Engineering","topics":["waste-nutrients","markets-decisions"],"authors":["Aurora del Carmen Munguía-López","Apoorva M. Sampat","Eusiel Rubio-Castro","José María Ponce-Ortega","Ví­ctor M. Zavala"],"authorKeys":["lab:aurora-munguia","lab:apoorva-sampat","e-rubio","j-ponce","v-zavala"],"doi":"10.1016/j.compchemeng.2019.106547","preprint":null,"url":"https://www.sciencedirect.com/science/article/pii/S0098135419305897","pdf":"https://doi.org/10.1016/j.compchemeng.2019.106547","citations":26,"abstract":null},{"id":"2019-graph-based-modeling-and-simulation-of","title":"Graph-Based Modeling and Simulation of Complex Systems","year":2019,"type":"journal","venue":"Computers & Chemical Engineering","topics":["graph-modeling","software"],"authors":["Jordan Jalving","Yankai Cao","Ví­ctor M. Zavala"],"authorKeys":["lab:jordan-jalving","lab:yankai-cao","v-zavala"],"doi":"10.1016/j.compchemeng.2019.03.009","preprint":"https://arxiv.org/abs/1812.04983","url":"https://doi.org/10.1016/j.compchemeng.2019.03.009","pdf":"https://doi.org/10.1016/j.compchemeng.2019.03.009","citations":47,"abstract":null},{"id":"2019-hierarchical-mpc-schemes-for-periodic-systems","title":"Hierarchical MPC schemes for periodic systems using stochastic programming","year":2019,"type":"journal","venue":"Automatica","topics":["control","uncertainty"],"authors":["Ranjeet Kumar","Michael J. Wenzel","Matthew J. Ellis","Mohammad N. ElBsat","Kirk H. Drees","Ví­ctor M. Zavala"],"authorKeys":["lab:ranjeet-kumar","m-wenzel","m-ellis","m-elbsat","k-drees","v-zavala"],"doi":"10.1016/j.automatica.2019.05.054","preprint":"https://arxiv.org/abs/1804.10866","url":"https://doi.org/10.1016/j.automatica.2019.05.054","pdf":"https://arxiv.org/pdf/1804.10866","citations":9,"abstract":null},{"id":"2019-logistics-network-management-of-livestock-waste","title":"Logistics Network Management of Livestock Waste for Spatiotemporal Control of Nutrient Pollution in Water Bodies","year":2019,"type":"journal","venue":"ACS Sustainable Chemistry & Engineering","topics":["waste-nutrients","supply-chains"],"authors":["Yicheng Hu","Apoorva M. Sampat","Gerardo J. Ruiz-Mercado","Ví­ctor M. Zavala","Yicheng Hu"],"authorKeys":["lab:yicheng-hu","lab:apoorva-sampat","g-ruiz","v-zavala","lab:yicheng-hu"],"doi":"10.1021/acssuschemeng.9b03920","preprint":null,"url":"https://pubs.acs.org/doi/abs/10.1021/acssuschemeng.9b03920","pdf":"https://www.ncbi.nlm.nih.gov/pmc/articles/7511004","citations":29,"abstract":"Nutrient pollution is a widespread water quality problem, which originates from excess nutrient runoff from agricultural land, improperly managed farming operations, and point sources such as wastewater treatment plants. Some nutrient pollution impacts include harmful algal blooms (HABs), hypoxia, and eutrophication. HABs are major environmental events that cause severe health threats and economic losses (e.g., tourism, real estate, commercial fishing). A dimension of the nutrient pollution problem that has not received much attention is that this interacts with organic waste management practices. As a result, it is important to connect the time and location of point and nonpoint nutrient source releases, nutrient soil content, spatial layout, and hydrology of agricultural lands with the transport of nutrients to water bodies and their impacts on aquatic ecosystems. In this work, we show how nutrient concentration in water bodies and other spatiotemporal factors are related to HAB development and how logistics management of livestock waste can be used to conduct space-time management of nutrient pollution. A case study for the Upper Yahara Watershed in the State of Wisconsin (U.S.) is employed to demonstrate the practicability of the modeling framework. Our framework reveals that logistics network management for waste and nutrients can reduce the incidence rates of HABs, but reducing it to nonharmful levels would require long-term efforts such as installing nutrient recovery technologies, coordinating manure storage and application, and deploying management incentive plans."},{"id":"2019-on-the-convergence-of-the-dynamic","title":"On the Convergence of the Dynamic Inner PCA Algorithm","year":2019,"type":"conference","venue":"arXiv (Cornell University)","topics":["machine-learning","optimization-algorithms"],"authors":["Sungho Shin","Alexander D. S. Smith","S. Joe Qin","Ví­ctor M. Zavala","Alexander D. Smith"],"authorKeys":["lab:sungho-shin","lab:alexander-smith","s-qin","v-zavala","lab:alexander-smith"],"doi":null,"preprint":"https://arxiv.org/abs/2003.05928","url":"https://docs.google.com/a/wisc.edu/viewer?a=v&pid=sites&srcid=d2lzYy5lZHV8emF2YWxhYnxneDo2NjVmOWUyNmJhODVhZTlh","pdf":"https://arxiv.org/pdf/2003.05928","citations":3,"abstract":"Dynamic inner principal component analysis (DiPCA) is a powerful method for the analysis of time-dependent multivariate data. DiPCA extracts dynamic latent variables that capture the most dominant temporal trends by solving a large-scale, dense, and nonconvex nonlinear program (NLP). A scalable decomposition algorithm has been recently proposed in the literature to solve these challenging NLPs. The decomposition algorithm performs well in practice but its convergence properties are not well understood. In this work, we show that this algorithm is a specialized variant of a coordinate maximization algorithm. This observation allows us to explain why the decomposition algorithm might work (or not) in practice and can guide improvements. We compare the performance of the decomposition strategies with that of the off-the-shelf solver Ipopt. The results show that decomposition is more scalable and, surprisingly, delivers higher quality solutions."},{"id":"2019-optimization-in-chemical-and-biological-engineering","title":"Optimization in Chemical and Biological Engineering using Julia","year":2019,"type":"chapter-report","venue":"CRC Press eBooks","topics":["software","education"],"authors":["Jordan Jalving","Ví­ctor M. Zavala"],"authorKeys":["lab:jordan-jalving","v-zavala"],"doi":"10.1201/9780429451010-18","preprint":null,"url":"https://docs.google.com/a/wisc.edu/viewer?a=v&pid=sites&srcid=d2lzYy5lZHV8emF2YWxhYnxneDo3ODVmZjUyOGFiZWVhYWJm","pdf":null,"citations":0,"abstract":"In this chapter we provide an introduction to capabilities for solving optimization problems in Julia that arise in typical chemical and biological engineering applications (control, estimation, design). Julia is a scalable and user-friendly programming language for scientific computing that has recently gained popularity in diverse engineering and scientific domains. We present basic features of JuMP (an algebraic modeling package) that enable the seamless construction and solution of optimization problems and discuss how to embed such models in computational workflows that execute data processing and plotting/visualization tasks."},{"id":"2019-recent-advances-in-graph-based-abstractions","title":"Recent Advances in Graph-Based Abstractions for Modeling and Simulating Complex Systems","year":2019,"type":"conference","venue":"Computer-aided chemical engineering/Computer aided chemical engineering","topics":["graph-modeling"],"authors":["Jordan Jalving","Ví­ctor M. Zavala"],"authorKeys":["lab:jordan-jalving","v-zavala"],"doi":"10.1016/b978-0-12-818634-3.50178-8","preprint":null,"url":"https://doi.org/10.1016/b978-0-12-818634-3.50178-8","pdf":null,"citations":0,"abstract":null},{"id":"2019-scalable-nonlinear-programming-framework-for-parameter","title":"Scalable nonlinear programming framework for parameter estimation in dynamic biological system models","year":2019,"type":"journal","venue":"PLoS Computational Biology","topics":["optimization-algorithms","biological-systems"],"authors":["Sungho Shin","Ophelia S. Venturelli","Ví­ctor M. Zavala"],"authorKeys":["lab:sungho-shin","o-venturelli","v-zavala"],"doi":"10.1371/journal.pcbi.1006828","preprint":"https://www.biorxiv.org/content/biorxiv/early/2018/09/07/410688.full.pdf","url":"https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1006828","pdf":"https://doi.org/10.1371/journal.pcbi.1006828","citations":27,"abstract":"Abstract We present a nonlinear programming (NLP) framework for the scalable solution of parameter estimation problems that arise in dynamic modeling of biological systems. Such problems are computationally challenging because they often involve highly nonlinear and stif differential equations as well as many experimental data sets and parameters. The proposed framework uses cutting-edge modeling and solution tools which are computationally efficient, robust, and easy-to-use. Specifically, our framework uses a time discretization approach that: i) avoids repetitive simulations of the dynamic model, ii) enables fully algebraic model implementations and computation of derivatives, and iii) enables the use of computationally efficient nonlinear interior point solvers that exploit sparse and structured linear algebra techniques. We demonstrate these capabilities by solving estimation problems for synthetic human gut microbiome community models. We show that an instance with 156 parameters, 144 differential equations, and 1,704 experimental data points can be solved in less than 3 minutes using our proposed framework (while an off-the-shelf simulation-based solution framework requires over 7 hours). We also create large instances to show that the proposed framework is scalable and can solve problems with up to 2,352 parameters, 2,304 differential equations, and 20,352 data points in less than 15 minutes. Competing methods reported in the computational biology literature cannot address problems of this level of complexity. The proposed framework is flexible, can be broadly applied to dynamic models of biological systems, and enables the implementation of sophisticated estimation techniques to quantify parameter uncertainty, to diagnose observability/uniqueness issues, to perform model selection, and to handle outliers. Author summary Constructing and validating dynamic models of biological systems spanning biomolecular networks to ecological systems is a challenging problem. Here we present a scalable computational framework to rapidly infer parameters in complex dynamic models of biological systems from large-scale experimental data. The framework was applied to infer parameters of a synthetic microbial community model from large-scale time series data. We also demonstrate that this framework can be used to analyze parameter uncertainty, to diagnose whether the experimental data are sufficient to uniquely determine the parameters, to determine the model that best describes the data, and to infer parameters in the face of data outliers."},{"id":"2019-second-order-multiplier-updates-to-accelerate","title":"Second-Order Multiplier Updates to Accelerate Admm Methods in Optimization Under Uncertainty","year":2019,"type":"conference","venue":"Computer-aided chemical engineering/Computer aided chemical engineering","topics":["optimization-algorithms","uncertainty"],"authors":["Jose S. Rodriguez","Gabriel A. Hackebeil","John D. Siirola","Ví­ctor M. Zavala","Carl D. Laird"],"authorKeys":["j-rodriguez","g-hackebeil","j-siirola","v-zavala","c-laird"],"doi":"10.1016/b978-0-12-818597-1.50038-2","preprint":null,"url":"https://doi.org/10.1016/b978-0-12-818597-1.50038-2","pdf":"https://www.osti.gov/servlets/purl/1641175","citations":3,"abstract":null},{"id":"2019-space-time-dynamics-of-electricity-markets","title":"Space-time dynamics of electricity markets incentivize technology decentralization","year":2019,"type":"journal","venue":"Computers & Chemical Engineering","topics":["energy-systems","markets-decisions"],"authors":["Yue Shao","Ví­ctor M. Zavala"],"authorKeys":["lab:yue-shao","v-zavala"],"doi":"10.1016/j.compchemeng.2019.05.005","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2019.05.005","pdf":"https://doi.org/10.1016/j.compchemeng.2019.05.005","citations":11,"abstract":null},{"id":"2019-spatio-temporal-control-of-nutrient-pollution","title":"Spatio-Temporal Control of Nutrient Pollution from Organic Waste","year":2019,"type":"conference","venue":"Computer-aided chemical engineering/Computer aided chemical engineering","topics":["waste-nutrients"],"authors":["Yicheng Hu","Gerardo J. Ruiz-Mercado","Ví­ctor M. Zavala","Yicheng Hu"],"authorKeys":["lab:yicheng-hu","g-ruiz","v-zavala","lab:yicheng-hu"],"doi":"10.1016/b978-0-12-818634-3.50179-x","preprint":null,"url":"https://doi.org/10.1016/b978-0-12-818634-3.50179-x","pdf":null,"citations":2,"abstract":null},{"id":"2019-systems-level-analysis-of-phosphorus-flows","title":"Systems-Level Analysis of Phosphorus Flows in the Dairy Supply Chain","year":2019,"type":"journal","venue":"ACS Sustainable Chemistry & Engineering","topics":["waste-nutrients","supply-chains"],"authors":["Dulce Celeste López-Díaz","Yicheng Hu","Winnie Chan","José María Ponce-Ortega","Ví­ctor M. Zavala","Yicheng Hu"],"authorKeys":["lab:dulce-lopez","lab:yicheng-hu","w-chan","j-ponce","v-zavala","lab:yicheng-hu"],"doi":"10.1021/acssuschemeng.9b03129","preprint":null,"url":"https://pubs.acs.org/doi/full/10.1021/acssuschemeng.9b03129","pdf":null,"citations":13,"abstract":"The dairy sector plays a vital role in the food supply chain, but it is also highly resource-intensive, consuming vast amounts of water, energy, and nutrients. Nutrients such as phosphorus (P) are key economic drivers in this interconnected system, as they serve as catalysts that enable efficient production of crops that in turn support dairy cow diet requirements and subsequent production of milk and derived products such as cheese and ice cream. As such, the dairy sector is tightly interconnected with mining, chemical, agricultural, and urban sectors. Unfortunately, nutrients are also emitted throughout the supply chain and create widespread environmental impacts. Specifically, P losses that result from urban discharges and overapplication of fertilizer in croplands impact the quality of water reservoirs (e.g., eutrophication). Moreover, natural P resources are finite, and thus efficient recycling and reuse of this valuable nutrient are essential to ensure the long-term viability of the dairy sector. In this work, we provide a systems-level analysis framework that captures the flow of inorganic P throughout the dairy sector and its interdependent sectors. We use this framework to analyze how changes in different sectors and externalities propagate throughout the system. A case study using real data for the State of Wisconsin is used to illustrate the insights that can be obtained with the proposed framework."},{"id":"2018-a-decomposition-algorithm-for-simultaneous-scheduling","title":"A decomposition algorithm for simultaneous scheduling and control of CSP systems","year":2018,"type":"journal","venue":"AIChE Journal","topics":["energy-systems","optimization-algorithms","control"],"authors":["Alexander W. Dowling","Tian Zheng","Ví­ctor M. Zavala"],"authorKeys":["lab:alexander-dowling","t-zheng","v-zavala"],"doi":"10.1002/aic.16101","preprint":null,"url":"https://doi.org/10.1002/aic.16101","pdf":null,"citations":20,"abstract":"We present a decomposition algorithm to perform simultaneous scheduling and control decisions in concentrated solar power (CSP) systems. Our algorithm is motivated by the need to determine optimal market participation strategies at multiple timescales. The decomposition scheme uses physical insights to create surrogate linear models that are embedded within a mixed‐integer linear scheduling layer to perform discrete (operational mode) decisions. The schedules are then validated for physical feasibility in a dynamic optimization layer that uses a continuous full‐resolution CSP model. The dynamic optimization layer updates the physical variables of the surrogate models to refine schedules. We demonstrate that performing this procedure recursively provides high‐quality solutions of the simultaneous scheduling and control problem. We exploit these capabilities to analyze different market participation strategies and to explore the influence of key design variables on revenue. Our results also indicate that using scheduling algorithms that neglect detailed dynamics significantly decreases market revenues. © 2018 American Institute of Chemical Engineers AIChE J, 64: 2408–2417, 2018"},{"id":"2018-a-hierarchical-model-predictive-control-approach","title":"A Hierarchical Model Predictive Control Approach for Handling Demand Charges Using Battery Systems","year":2018,"type":"conference","venue":"Proceedings of the 5th International High Performance Buildings Conference at Purdue","topics":["control","energy-systems"],"authors":["Ranjeet Kumar","M. J. Wenzel","Matthew J. Ellis","Mohammad N. ElBsat","Kirk H. Drees","Victor M. Zavala"],"authorKeys":["lab:ranjeet-kumar","m-wenzel","m-ellis","m-elbsat","k-drees","v-zavala"],"doi":null,"preprint":null,"url":"https://docs.lib.purdue.edu/ihpbc/260/","pdf":null,"citations":0,"abstract":"Applications in energy systems often require to simultaneously mitigate long-term and short-term electricity costs. Demand charges, in particular, constitute an important component of the electricity bills for large consumption units such as buildings and manufacturing plants. Mitigating long-term and short-term costs poses a challenging multiscale planning problem that should make decisions at fine timescales and over long time horizons. This work presents a hierarchical model predictive control (MPC) approach to tackle this problem in the context of stationary battery systems. The goal is to determine the optimal charge-discharge policy for the battery to minimize hourly costs and a monthly demand charge. In the proposed hierarchical MPC approach, the state of charge (SOC) policy is assumed to be periodic, which allows to cast the long-term planning problem as a tractable stochastic programming problem. Here, every period (e.g., a day or week) represents an operational scenario and the targets for the periodic SOC levels and the peak cost are to be determined. The long-term planner MPC communicates the periodic SOC targets and maximum peak level to a short-term MPC controller. The short-term MPC controller determines the intra-period charge/discharge policies (at high resolution) while meeting the targets of the long-term planning. A simulation case study for a university campus is presented to demonstrate that the hierarchical MPC scheme yields optimal demand charge and charge-discharge policy under nominal (perfect forecast) conditions. Comparative studies of the proposed hierarchical MPC scheme and standard MPC schemes that use ad-hoc approaches to handle demand charges are also presented. Under imperfect forecasts, the simulations show that the hierarchical MPC scheme results in significant improvements in demand charge reduction over a standard MPC scheme that uses a discounting factor to capture long-term effects."},{"id":"2018-a-mixed-integer-conic-programming-formulation","title":"A Mixed-Integer Conic Programming Formulation for Computing the Flexibility Index under Multivariate Gaussian Uncertainty","year":2018,"type":"journal","venue":"Computers & Chemical Engineering","topics":["uncertainty"],"authors":["Joshua L. Pulsipher","Ví­ctor M. Zavala"],"authorKeys":["lab:joshua-pulsipher","v-zavala"],"doi":"10.1016/j.compchemeng.2018.09.005","preprint":"https://arxiv.org/abs/2106.12702","url":"https://authors.elsevier.com/c/1XvUmMK3klu5k","pdf":"https://doi.org/10.1016/j.compchemeng.2018.09.005","citations":16,"abstract":null},{"id":"2018-a-sequential-algorithm-for-solving-nonlinear","title":"A Sequential Algorithm for Solving Nonlinear Optimization Problems with Chance Constraints","year":2018,"type":"journal","venue":"SIAM Journal on Optimization","topics":["uncertainty","optimization-algorithms"],"authors":["Frank E. Curtis","Andreas Wächter","Ví­ctor M. Zavala","Andreas Waechter"],"authorKeys":["f-curtis","a-wachter","v-zavala","a-waechter"],"doi":"10.1137/16m109003x","preprint":null,"url":"https://epubs.siam.org/doi/abs/10.1137/16M109003X?af=R","pdf":null,"citations":33,"abstract":"An algorithm is presented for solving nonlinear optimization problems with chance constraints, i.e., those in which a constraint involving an uncertain parameter must be satisfied with at least a minimum probability. In particular, the algorithm is designed to solve cardinality-constrained nonlinear optimization problems that arise in sample average approximations of chance-constrained problems, as well as in other applications in which it is only desired to enforce a minimum number of constraints. The algorithm employs a novel exact penalty function which is minimized sequentially by solving quadratic optimization subproblems with linear cardinality constraints. Properties of minimizers of the penalty function in relation to minimizers of the corresponding nonlinear optimization problem are presented, and convergence of the proposed algorithm to stationarity with respect to the penalty function is proved. The effectiveness of the algorithm is demonstrated through numerical experiments with a nonlinear cash flow problem."},{"id":"2018-a-sigmoidal-approximation-for-chance-constrained","title":"A Sigmoidal Approximation for Chance-Constrained Nonlinear Programs","year":2018,"type":"chapter-report","venue":"arXiv (Cornell University)","topics":["uncertainty"],"authors":["Yankai Cao","Ví­ctor M. Zavala"],"authorKeys":["lab:yankai-cao","v-zavala"],"doi":"10.48550/arXiv.2004.02402","preprint":null,"url":"https://arxiv.org/pdf/2004.02402.pdf","pdf":"https://arxiv.org/pdf/2004.02402","citations":9,"abstract":"We propose a sigmoidal approximation for the value-at-risk (that we call SigVaR) and we use this approximation to tackle nonlinear programs (NLPs) with chance constraints. We prove that the approximation is conservative and that the level of conservatism can be made arbitrarily small for limiting parameter values. The SigVar approximation brings scalability benefits over exact mixed-integer reformulations because its sample average approximation can be cast as a standard NLP. We also establish explicit connections between SigVaR and other smooth sigmoidal approximations recently reported in the literature. We show that a key benefit of SigVaR over such approximations is that one can establish an explicit connection with the conditional value at risk (CVaR) approximation and exploit this connection to obtain initial guesses for the approximation parameters. We present small- and large-scale numerical studies to illustrate the developments."},{"id":"2018-a-stochastic-dual-dynamic-programming-framework","title":"A Stochastic Dual Dynamic Programming Framework for Multiscale MPC","year":2018,"type":"conference","venue":"IFAC-PapersOnLine","topics":["control","uncertainty"],"authors":["Ranjeet Kumar","Michael J. Wenzel","Matthew J. Ellis","Mohammad N. ElBsat","Kirk H. Drees","Ví­ctor M. Zavala"],"authorKeys":["lab:ranjeet-kumar","m-wenzel","m-ellis","m-elbsat","k-drees","v-zavala"],"doi":"10.1016/j.ifacol.2018.11.041","preprint":null,"url":"https://www.sciencedirect.com/science/article/pii/S2405896318326995","pdf":"https://doi.org/10.1016/j.ifacol.2018.11.041","citations":16,"abstract":"We derive and interpret stochastic dual dynamic programming (SDDP) from the perspective of MPC to argue that SDDP provides a scalable approach to handle complex MPC applications with uncertainties evolving over long time horizons and with fine time resolutions. Scalability is enabled by the use of a nested cutting-plane scheme, which uses forward and backward sweeps along the time horizon to adaptively construct and refine cost-to-go functions. SDDP can also select random paths on-the-fly, thus avoiding the exponential complexity associated with the construction of scenario trees and enabling the construction of statistical performance bounds. Our work seeks to establish connections between SDDP and MPC that allow us to obtain performance bounds for deterministic and stochastic MPC and to propose new MPC schemes that can deal with multiple timescales. We demonstrate the developments using a stationary battery system that participates in multiscale energy markets."},{"id":"2018-a-stochastic-model-predictive-control-framework","title":"A Stochastic Model Predictive Control Framework for Stationary Battery Systems","year":2018,"type":"journal","venue":"IEEE Transactions on Power Systems","topics":["control","uncertainty","energy-systems"],"authors":["Ranjeet Kumar","Michael J. Wenzel","Matthew J. Ellis","Mohammad N. ElBsat","Kirk H. Drees","Ví­ctor M. Zavala"],"authorKeys":["lab:ranjeet-kumar","m-wenzel","m-ellis","m-elbsat","k-drees","v-zavala"],"doi":"10.1109/tpwrs.2017.2789118","preprint":null,"url":"https://doi.org/10.1109/TPWRS.2017.2789118","pdf":null,"citations":56,"abstract":"A stochastic model predictive control (MPC) framework is presented to determine real-time commitments in energy and frequency regulation markets for a stationary battery while simultaneously mitigating long-term demand charges for an attached load. The control problem is multi-scale in nature and poses challenges on computational tractability of the stochastic program and of forecasting and uncertainty quantification (UQ) procedures. The framework deals with tractability of the stochastic program by using a discounting factor for long-term demand charges, while a Ledoit–Wolf covariance estimator is used to overcome UQ tractability issues. The performance of stochastic MPC is benchmarked against that of perfect information MPC and deterministic MPC for different prediction horizon lengths and demand charge discounting strategies. A case study using real load data for a typical university campus and price and regulation data from PJM is considered. It is found that stochastic MPC can recover 83% of the ideal value of the battery, which is defined as the expected savings obtained by operating the battery under perfect information MPC. In contrast, deterministic MPC can only recover 73% of this ideal value. It is also found that operating the battery under stochastic MPC improves the battery payback period by 12.1%, while operating it under perfect information improves it by 27.9%."},{"id":"2018-a-supply-chain-framework-for-the","title":"A Supply Chain Framework for the Analysis of the Recovery of Biogas and Fatty Acids from Organic Waste","year":2018,"type":"journal","venue":"ACS Sustainable Chemistry & Engineering","topics":["waste-nutrients","supply-chains"],"authors":["Yicheng Hu","Matthew Scarborough","Horacio A. Aguirre-Villegas","Rebecca A. Larson","Daniel R. Noguera","Ví­ctor M. Zavala","Yicheng Hu"],"authorKeys":["lab:yicheng-hu","m-scarborough","h-aguirre","r-larson","d-noguera","v-zavala","lab:yicheng-hu"],"doi":"10.1021/acssuschemeng.7b04932","preprint":null,"url":"https://pubs.acs.org/doi/abs/10.1021/acssuschemeng.7b04932","pdf":null,"citations":31,"abstract":"We present a supply chain optimization framework to analyze economic and environmental benefits of recovering biogas, caproic acid (C6), and caprylic acid (C8) from different sources of organic waste. The framework makes simultaneous decisions on technology selection, sizing and placement, and transportation logistics. We consider livestock manure, wastewater sludge, and food waste generated in urban areas, dairy farms, wastewater treatment facilities, and landfills. Case studies for the State of Wisconsin reveal that the deployment of biogas recovery technologies offers the most environmental benefits but it is not economically viable while the deployment of C6/C8 recovery technologies is economically viable but provides limited environmental benefits. The simultaneous deployment of biogas/C6/C8 technologies (in the form of hybrid recovery systems) achieves both objectives. We also show how to use our framework to guide experimental research by providing yield targets for technologies that would achieve desired social welfare levels and rates of return."},{"id":"2018-an-asynchronous-decomposition-algorithm-for-security","title":"An Asynchronous Decomposition Algorithm for Security Constrained Unit Commitment Under Contingency Events","year":2018,"type":"conference","venue":"Power Systems Computation Conference","topics":["energy-systems","uncertainty","optimization-algorithms"],"authors":["Kibaek Kim","Mihai Anitescu","Ví­ctor M. Zavala"],"authorKeys":["lab:kibaek-kim","m-anitescu","v-zavala"],"doi":"10.23919/pscc.2018.8450937","preprint":null,"url":"https://doi.org/10.23919/pscc.2018.8450937","pdf":null,"citations":7,"abstract":"We present a parallel and asynchronous decomposition algorithm for solving security constrained unit commitment (SCUC) problem under contingency events in system components in combination with uncertain wind power generation. The problem is formulated as a two-stage stochastic mixed-integer program, where the first stage schedules slow generators and the second stage adjusts the schedules for fast generators and dispatches power for a given contingency event. Our algorithm uses an asynchronous variant of the Lagrangian dual decomposition that can better handle high imbalance in computational times for scenario subproblems (which are themselves mixed-integer programs). We also present a special case of the SCUC problem that considers a deterministic wind power generation and develop a Benders decomposition for solving this special case. In our computational study, we solve the SCUC model for the WECC 225-bus system that incorporates the single contingency events on transmission lines. We show that the asynchronous algorithm can significantly reduce solution times (by up to a factor of eight) of an off-the-shelf synchronous dual decomposition algorithm."},{"id":"2018-an-optimization-based-state-estimation-framework","title":"An Optimization-Based State Estimation Framework for Large-Scale Natural Gas Networks","year":2018,"type":"journal","venue":"Industrial & Engineering Chemistry Research","topics":["energy-systems","control"],"authors":["Jordan Jalving","Ví­ctor M. Zavala"],"authorKeys":["lab:jordan-jalving","v-zavala"],"doi":"10.1021/acs.iecr.7b04124","preprint":null,"url":"https://pubs.acs.org/doi/full/10.1021/acs.iecr.7b04124","pdf":null,"citations":28,"abstract":"We propose an optimization-based state estimation framework to track internal space–time flow and pressure profiles of natural gas networks during dynamic transients. We find that the estimation problem is ill-posed (because of the infinite-dimensional nature of the states) and that this leads to instability of the estimator when short estimation horizons are used. To circumvent this issue, we propose moving horizon strategies that incorporate prior information. In particular, we propose a strategy that initializes the prior using steady-state information and compare its performance against a strategy that does not initialize the prior. We find that both strategies are capable of tracking the state profiles but we also find that superior performance is obtained with steady-state prior initialization. We also find that, under the proposed framework, pressure sensor information at junctions is sufficient to track the state profiles. We also derive approximate transport models and show that some of these can be used to achieve significant computational speed-ups without sacrificing estimation performance. We show that the estimator can be easily implemented in the graph-based modeling framework Plasmo.jl and use a multipipeline network study to demonstrate the developments."},{"id":"2018-balancing-stakeholder-priorities-in-the-operation","title":"Balancing stakeholder priorities in the operation of combined heat and power systems","year":2018,"type":"journal","venue":"Applied Thermal Engineering","topics":["energy-systems","markets-decisions"],"authors":["Luis Fabián Fuentes-Cortés","José María Ponce-Ortega","Ví­ctor M. Zavala"],"authorKeys":["lab:luis-fabi-n-fuentes-cort-s","j-ponce","v-zavala"],"doi":"10.1016/j.applthermaleng.2017.09.052","preprint":null,"url":"https://doi.org/10.1016/j.applthermaleng.2017.09.052","pdf":"https://doi.org/10.1016/j.applthermaleng.2017.09.052","citations":26,"abstract":null},{"id":"2018-benchmarking-admm-in-nonconvex-nlps","title":"Benchmarking ADMM in Nonconvex NLPs","year":2018,"type":"journal","venue":"Computers & Chemical Engineering","topics":["optimization-algorithms"],"authors":["Jose S. Rodriguez","Bethany L. Nicholson","Carl D. Laird","Ví­ctor M. Zavala"],"authorKeys":["j-rodriguez","lab:bethany-nicholson","c-laird","v-zavala"],"doi":"10.1016/j.compchemeng.2018.08.036","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2018.08.036","pdf":"https://www.osti.gov/servlets/purl/1472254","citations":27,"abstract":null},{"id":"2018-computing-economic-optimal-and-stable-equilibria","title":"Computing Economic-Optimal and Stable Equilibria for Droop-Controlled Microgrids","year":2018,"type":"chapter-report","venue":"arXiv (Cornell University)","topics":["energy-systems","control"],"authors":["Sungho Shin","Ví­ctor M. Zavala"],"authorKeys":["lab:sungho-shin","v-zavala"],"doi":"10.48550/arXiv.2002.09802","preprint":null,"url":"https://arxiv.org/abs/2002.09802","pdf":"https://arxiv.org/pdf/2002.09802","citations":0,"abstract":"We consider the problem of computing equilibria (steady-states) for droop-controlled, islanded, AC microgrids that are both economic-optimal and dynamically stable. This work is motivated by the observation that classical optimal power flow (OPF) formulations used for economic optimization might provide equilibria that are not reachable by low-level controllers (i.e., closed-loop unstable). This arises because OPF problems only enforce steady-state conditions and do not capture the dynamics. We explain this behavior by using a port-Hamiltonian microgrid representation. To overcome the limitations of OPF, the port-Hamiltonian representation can be exploited to derive a bilevel OPF formulation that seeks to optimize economics while enforcing stability. Unfortunately, bilevel optimization with a nonconvex inner problem is difficult to solve in general. As such, we propose an alternative approach (that we call probing OPF), which identifies an economic-optimal and stable equilibrium by probing a neighborhood of equilibria using random perturbations. The probing OPF is advantageous in that it is formulated as a standard nonlinear program, in that it is compatible with existing OPF frameworks, and in that it is applicable to diverse microgrid models. Experiments with the IEEE 118-bus system reveal that few probing points are required to enforce stability."},{"id":"2018-economic-and-environmental-analysis-for-advancing","title":"Economic and Environmental Analysis for Advancing Sustainable Management of Livestock Waste: A Wisconsin Case Study","year":2018,"type":"journal","venue":"ACS Sustainable Chemistry & Engineering","topics":["waste-nutrients"],"authors":["Apoorva M. Sampat","Gerardo J. Ruiz-Mercado","Ví­ctor M. Zavala"],"authorKeys":["lab:apoorva-sampat","g-ruiz","v-zavala"],"doi":"10.1021/acssuschemeng.7b04657","preprint":null,"url":"https://pubs.acs.org/doi/full/10.1021/acssuschemeng.7b04657","pdf":"https://www.ncbi.nlm.nih.gov/pmc/articles/6750747","citations":37,"abstract":"Livestock waste may cause some air quality degradation from ammonia and methane emissions, soil quality detriment due to in-excess nutrients and acidification, and water pollution issues resulting from nutrient and pathogens runoff to water bodies, which leads to eutrophication, algal blooms, and hypoxia. Despite the significant environmental benefits by performing pollution management of these organic materials, the recovery of value-added products from livestock waste is not a current practice due to the high investment costs required and to the low market values being offered for the products that are recovered. Therefore, we present a supply chain design framework to conduct simultaneous economic and environmental analysis of post-livestock organic material to value-added products. The proposed framework captures techno-economic and logistical issues and can accommodate diverse types of policy incentives obtained at federal and state levels, allowing stakeholders to conduct systematic studies on the effect of incentives on economic and environmental viability of different technologies. We apply the framework to a case study for dairy farms in the State of Wisconsin (U.S.). The framework reveals that, from a purely economic perspective, products recovered from dairy waste are not competitive at current market prices. We also find that incorporating current and potential U.S. government incentives in the form of Renewable Identification Numbers (RINs) and phosphorus credits can achieve economic viability of the recovery of liquefied biomethane and nutrient-rich products. On the other hand, current incentives for electricity generation (Renewable Energy Credits or RECs) would not achieve economic viability. The analysis also reveals that the best strategy to manage waste is to synergize the deployment of technologies that conduct simultaneous recovery of liquefied biomethane and nutrients."},{"id":"2017-economic-opportunities-for-industrial-systems-from","title":"Economic opportunities for industrial systems from frequency regulation markets","year":2018,"type":"journal","venue":"Computers & Chemical Engineering","topics":["energy-systems","markets-decisions"],"authors":["Alexander W. Dowling","Ví­ctor M. Zavala"],"authorKeys":["lab:alexander-dowling","v-zavala"],"doi":"10.1016/j.compchemeng.2017.09.018","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2017.09.018","pdf":null,"citations":40,"abstract":null},{"id":"2018-handling-long-horizons-in-mpc-a","title":"Handling Long Horizons in MPC: A Stochastic Programming Approach","year":2018,"type":"conference","venue":"Proceedings of the ... American Control Conference/Proceedings of the American Control Conference","topics":["control","uncertainty"],"authors":["Ranjeet Kumar","Michael J. Wenzel","Matthew J. Ellis","Mohammad N. ElBsat","Kirk H. Drees","Ví­ctor M. Zavala"],"authorKeys":["lab:ranjeet-kumar","m-wenzel","m-ellis","m-elbsat","k-drees","v-zavala"],"doi":"10.23919/acc.2018.8430780","preprint":null,"url":"https://ieeexplore.ieee.org/abstract/document/8430780","pdf":null,"citations":4,"abstract":"We propose an approach to handle long horizons in model predictive control (MPC). The approach is based on the observation that, if periodicity constraints are enforced over short-term stages, the long horizon MPC problem can be cast as a stochastic programming (SP) problem. The SP representation reveals a mechanism to construct a hierarchical MPC scheme under which a high-level (long-horizon) MPC controller provides periodic state targets to guide a low-level (short-term) MPC controller. We show that this hierarchical scheme is optimal under nominal (perfect forecast) conditions and can be extended to handle imperfect forecasts by correcting the targets in real-time. We demonstrate our concepts using a building system with stationary battery storage, where the goal is to use the battery to mitigate monthly demand charges while collecting revenue from hourly frequency regulation markets. We demonstrate that the hierarchical MPC scheme yields improved performance over standard MPC schemes because it can systematically capture long-term effects."},{"id":"2019-optimal-integrated-design-market-participation-and","title":"Integrated Multiscale Design, Market Participation, and Replacement Strategies for Battery Energy Storage Systems","year":2018,"type":"journal","venue":"IEEE Transactions on Sustainable Energy","topics":["energy-systems"],"authors":["Farshud Sorourifar","Ví­ctor M. Zavala","Alexander W. Dowling"],"authorKeys":["f-sorourifar","v-zavala","lab:alexander-dowling"],"doi":"10.1109/tste.2018.2884317","preprint":null,"url":"https://ieeexplore.ieee.org/document/8554185","pdf":null,"citations":68,"abstract":"Increased dependence on non-dispatchable energy sources has created a need for flexible energy storage systems capable of providing peak shaving and ancillary services. This work develops a computational framework to optimize sizing, replacement, and market participation strategies for battery energy storage systems. A multiscale linear programming formulation is proposed that spans real-time market decisions (minutes) to sizing and replacement decisions (years) while explicitly considering capacity loss due to degradation. These optimization problems include millions of variables and constraints, but can be efficiently solved using modern algorithms. Several case studies explore tradeoffs between market participation, degradation, power-to-energy ratio, and replacement strategies using historical energy and ancillary service price data from CAISO. Findings emphasize that simultaneously transacting both energy and ancillary services in day-ahead and real-time markets can provide a four to five fold increase in net present value compared to only buying/selling energy in the day-ahead market. Optimization also reveals market participation strategies that effectively manage degradation leading to an optimal energy-to-power ratio of less than 1 MWh/MW for NaS batteries. Results also show that developing ideal degradation-free batteries would improve net present value by 20%. This emphasizes that judicious management of degradation, sizing, and markets is critical."},{"id":"2018-machine-learning-algorithms-for-liquid-crystals","title":"Machine Learning Algorithms for Liquid Crystal-Based Sensors","year":2018,"type":"journal","venue":"ACS Sensors","topics":["molecular-sensing","machine-learning"],"authors":["Yankai Cao","Huaizhe Yu","Nicholas Lawrence Abbott","Ví­ctor M. Zavala"],"authorKeys":["lab:yankai-cao","h-yu","n-abbott","v-zavala"],"doi":"10.1021/acssensors.8b00100","preprint":null,"url":"https://pubs.acs.org/doi/abs/10.1021/acssensors.8b00100","pdf":null,"citations":76,"abstract":"We present a machine learning (ML) framework to optimize the specificity and speed of liquid crystal (LC)-based chemical sensors. Specifically, we demonstrate that ML techniques can uncover valuable feature information from surface-driven LC orientational transitions triggered by the presence of different gas-phase analytes (and the corresponding optical responses) and can exploit such feature information to train accurate and automatic classifiers. We demonstrate the utility of the framework by designing an experimental LC system that exhibits similar optical responses to a stream of nitrogen containing either 10 ppmv dimethyl-methylphosphonate (DMMP) or 30% relative humidity (RH). The ML framework is used to process and classify thousands of images (optical micrographs) collected during the LC responses and we show that classification (sensing) accuracies of over 99% can be achieved. For the same experimental system, we demonstrate that traditional feature information used in characterizing LC responses (such as average brightness) can only achieve sensing accuracies of 60%. We also find that high accuracies can be achieved by using time snapshots collected early in the LC response, thus providing the ability to create fast sensors. We also show that the ML framework can be used to systematically analyze the quality of information embedded in LC responses and to filter out noise that arises from imperfect LC designs and from sample variations. We evaluate a range of classifiers and feature extraction methods and conclude that linear support vector machines are preferred and that high accuracies can only be achieved by simultaneously exploiting multiple sources of feature information."},{"id":"2018-multi-grid-schemes-for-multi-scale","title":"Multi-Grid Schemes for Multi-Scale Coordination of Energy Systems","year":2018,"type":"chapter-report","venue":"The IMA volumes in mathematics and its applications","topics":["energy-systems","control","optimization-algorithms"],"authors":["Sungho Shin","Ví­ctor M. Zavala"],"authorKeys":["lab:sungho-shin","v-zavala"],"doi":"10.1007/978-1-4939-7822-9_9","preprint":"https://arxiv.org/abs/2002.10680","url":"https://link.springer.com/chapter/10.1007/978-1-4939-7822-9_9","pdf":"https://arxiv.org/pdf/2002.10680","citations":10,"abstract":null},{"id":"2018-optimal-integrated-facility-for-waste-processing","title":"Optimal integrated facility for waste processing","year":2018,"type":"journal","venue":"Process Safety and Environmental Protection","topics":["waste-nutrients"],"authors":["Edgar Martín-Hernández","Apoorva M. Sampat","Ví­ctor M. Zavala","Mariano Martín"],"authorKeys":["e-martin","lab:apoorva-sampat","v-zavala","m-martin"],"doi":"10.1016/j.cherd.2017.11.042","preprint":null,"url":"https://doi.org/10.1016/j.cherd.2017.11.042","pdf":"https://doi.org/10.1016/j.cherd.2017.11.042","citations":31,"abstract":null},{"id":"2017-optimal-pid-controller-tuning-using-stochastic","title":"Optimal PID controller tuning using stochastic programming techniques","year":2018,"type":"journal","venue":"AIChE Journal","topics":["control","uncertainty"],"authors":["Jose A. Renteria","Yankai Cao","Alexander W. Dowling","Ví­ctor M. Zavala"],"authorKeys":["j-renteria","lab:yankai-cao","lab:alexander-dowling","v-zavala"],"doi":"10.1002/aic.16030","preprint":null,"url":"http://onlinelibrary.wiley.com/doi/10.1002/aic.16030/abstract","pdf":null,"citations":14,"abstract":"We argue that stochastic programming provides a powerful framework to tune and analyze the performance limits of controllers. In particular, stochastic programming formulations can be used to identify controller settings that remain robust across diverse scenarios (disturbances, set‐points, and modeling errors) observed in real‐time operations. We also discuss how to use historical data and sampling techniques to construct operational scenarios and inference analysis techniques to provide statistical guarantees on limiting controller performance. Under the proposed framework, it is also possible to use risk metrics to handle extreme (rare) events and stochastic dominance concepts to conduct systematic benchmarking studies. We provide numerical studies to illustrate the concepts and to demonstrate that modern modeling and local/global optimization tools can tackle large‐scale applications. The proposed work also opens the door to data‐based controller tuning strategies that can be implemented in real‐time operations. © 2017 American Institute of Chemical Engineers AIChE J, 64: 2997–3010, 2018"},{"id":"2018-pyomo-dae-a-modeling-and-automatic","title":"pyomo.dae: A modeling and automatic discretization framework for optimization with differential and algebraic equations","year":2018,"type":"journal","venue":"Mathematical Programming Computation","topics":["software","control"],"authors":["Bethany L. Nicholson","John D. Siirola","Jean-Paul Watson","Ví­ctor M. Zavala","Lorenz T. Biegler"],"authorKeys":["lab:bethany-nicholson","j-siirola","j-watson","v-zavala","l-biegler"],"doi":"10.1007/s12532-017-0127-0","preprint":null,"url":"https://doi.org/10.1007/s12532-017-0127-0","pdf":"https://www.osti.gov/servlets/purl/1324250","citations":179,"abstract":null},{"id":"2018-scalable-solution-strategies-for-chance-constrained","title":"Scalable Solution Strategies for Chance-Constrained Nonlinear Programs","year":2018,"type":"journal","venue":"Industrial & Engineering Chemistry Research","topics":["uncertainty","optimization-algorithms"],"authors":["Javier Tovar-Facio","Yankai Cao","José María Ponce-Ortega","Ví­ctor M. Zavala"],"authorKeys":["lab:javier-tovar","lab:yankai-cao","j-ponce","v-zavala"],"doi":"10.1021/acs.iecr.8b00646","preprint":null,"url":"https://pubs.acs.org/doi/abs/10.1021/acs.iecr.8b00646","pdf":null,"citations":7,"abstract":"Probabilistic (chance) constraints are a powerful modeling paradigm that helps decision-makers control risk. Unfortunately, chance constraints (CCs) cannot be handled directly by off-the-shelf optimization solvers and specialized reformulations and solution procedures are often needed. In this work, we review different strategies to tackle large-scale nonlinear programs (NLPs) with CCs. In particular, we use moment matching when the algebraic structure of the moments and of the quantile function of the CC distribution are known. To address more general settings with arbitrary distributions, we use a sigmoidal approximation, which provides a mechanism to achieve exact solutions. We demonstrate that this approach significantly reduces the conservatism of popular approximations such as the conditional value at risk and the scenario (almost surely) approach. A flare system design study is used to illustrate the developments."},{"id":"2018-technologies-and-logistics-for-phosphorus-recovery","title":"Technologies and logistics for phosphorus recovery from livestock waste","year":2018,"type":"journal","venue":"Clean Technologies and Environmental Policy","topics":["waste-nutrients","supply-chains"],"authors":["Apoorva M. Sampat","Edgar Martín-Hernández","Mariano Martín","Ví­ctor M. Zavala"],"authorKeys":["lab:apoorva-sampat","e-martin","m-martin","v-zavala"],"doi":"10.1007/s10098-018-1546-y","preprint":null,"url":"https://link.springer.com/article/10.1007/s10098-018-1546-y","pdf":null,"citations":23,"abstract":null},{"id":"2018-using-stochastic-programming-and-statistical-extrapolation","title":"Using stochastic programming and statistical extrapolation to mitigate long-term extreme loads in wind turbines","year":2018,"type":"journal","venue":"Applied Energy","topics":["uncertainty","energy-systems"],"authors":["Yankai Cao","Ví­ctor M. Zavala","Fernando D’Amato","Fernando D'Amato"],"authorKeys":["lab:yankai-cao","v-zavala","f-damato","f-damato"],"doi":"10.1016/j.apenergy.2018.09.062","preprint":null,"url":"https://doi.org/10.1016/j.apenergy.2018.09.062","pdf":null,"citations":16,"abstract":null},{"id":"2018-valuation-of-water-and-emissions-in","title":"Valuation of water and emissions in energy systems","year":2018,"type":"journal","venue":"Applied Energy","topics":["energy-systems","markets-decisions"],"authors":["Luis Fabián Fuentes-Cortés","Yan Ma","José María Ponce-Ortega","Gerardo J. Ruiz-Mercado","Ví­ctor M. Zavala"],"authorKeys":["lab:luis-fabi-n-fuentes-cort-s","y-ma","j-ponce","g-ruiz","v-zavala"],"doi":"10.1016/j.apenergy.2016.09.030","preprint":null,"url":"https://doi.org/10.1016/j.apenergy.2016.09.030","pdf":"https://www.ncbi.nlm.nih.gov/pmc/articles/6750761","citations":41,"abstract":null},{"id":"2017-a-graph-based-computational-framework-for","title":"A graph-based computational framework for simulation and optimisation of coupled infrastructure networks","year":2017,"type":"journal","venue":"IET Generation Transmission & Distribution","topics":["graph-modeling","energy-systems","software"],"authors":["Jordan Jalving","Shrirang G. Abhyankar","Kibaek Kim","Mark Hereld","Ví­ctor M. Zavala"],"authorKeys":["lab:jordan-jalving","s-abhyankar","lab:kibaek-kim","m-hereld","v-zavala"],"doi":"10.1049/iet-gtd.2016.1582","preprint":null,"url":"http://dx.doi.org/10.1049/iet-gtd.2016.1582","pdf":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1049/iet-gtd.2016.1582","citations":26,"abstract":"The authors present a graph‐based computational framework that facilitates the construction, instantiation, and analysis of large‐scale optimisation and simulation applications of coupled infrastructure networks. The framework integrates the optimisation modelling package PLASMO and the simulation package DMNetwork (built around PETSc ). These tools use a common graph‐based modelling abstraction that enables them to achieve compatibility between interfaces and data structures and facilitates the modular creation and exchange of component models. The authors also describe how to embed these tools within complex computational workflows using SWIFT , which is a tool that facilitates parallel execution of multiple simulation runs and management of input and output data. Finally, the authors discuss how to use these capabilities to target coupled natural gas and electricity systems."},{"id":"2017-a-multi-scale-optimization-framework-for","title":"A multi-scale optimization framework for electricity market participation","year":2017,"type":"journal","venue":"Applied Energy","topics":["energy-systems","markets-decisions"],"authors":["Alexander W. Dowling","Ranjeet Kumar","Ví­ctor M. Zavala"],"authorKeys":["lab:alexander-dowling","lab:ranjeet-kumar","v-zavala"],"doi":"10.1016/j.apenergy.2016.12.081","preprint":null,"url":"https://doi.org/10.1016/j.apenergy.2016.12.081","pdf":null,"citations":132,"abstract":null},{"id":"2017-a-scalable-design-of-experiments-framework","title":"A scalable design of experiments framework for optimal sensor placement","year":2017,"type":"journal","venue":"Journal of Process Control","topics":["bayesian-optimization","uncertainty"],"authors":["Jing Yu","Ví­ctor M. Zavala","Mihai Anitescu"],"authorKeys":["j-yu","v-zavala","m-anitescu"],"doi":"10.1016/j.jprocont.2017.03.011","preprint":null,"url":"https://doi.org/10.1016/j.jprocont.2017.03.011","pdf":"https://doi.org/10.1016/j.jprocont.2017.03.011","citations":25,"abstract":null},{"id":"2017-a-stochastic-electricity-market-clearing-formulation","title":"A stochastic electricity market clearing formulation with consistent pricing properties","year":2017,"type":"journal","venue":"Operations Research","topics":["energy-systems","markets-decisions","uncertainty"],"authors":["Ví­ctor M. Zavala","Kibaek Kim","Mihai Anitescu","John R. Birge"],"authorKeys":["v-zavala","lab:kibaek-kim","m-anitescu","j-birge"],"doi":"10.1287/opre.2016.1576","preprint":null,"url":"https://doi.org/10.1287/opre.2016.1576","pdf":"https://www.osti.gov/servlets/purl/1364657","citations":72,"abstract":"We argue that deterministic market clearing formulations introduce arbitrary distortions between day-ahead and expected real-time prices that bias economic incentives. We extend and analyze a previously proposed stochastic clearing formulation in which the social surplus function induces penalties between day-ahead and real-time quantities. We prove that the formulation yields price bounded price distortions, and we show that adding a similar penalty term to transmission flows and phase angles ensures boundedness throughout the network. We prove that when the price distortions are zero, day-ahead quantities equal a quantile of their real-time counterparts. The undesired
