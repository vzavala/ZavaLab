 effects of price distortions suggest that stochastic settings provide significant benefits over deterministic ones that go beyond social surplus improvements. We propose additional metrics to evaluate these benefits."},{"id":"2017-a-stochastic-optimization-approach-for-the","title":"A stochastic optimization approach for the design of organic fluid mixtures for low-temperature heat recovery","year":2017,"type":"journal","venue":"Applied Energy","topics":["uncertainty","molecular-sensing"],"authors":["M. Magdalena Santos-Rodriguez","Antonio Flores-Tlacuahuac","Ví­ctor M. Zavala"],"authorKeys":["lab:magdalena-santos-rodriguez","a-flores","v-zavala"],"doi":"10.1016/j.apenergy.2017.04.047","preprint":null,"url":"https://doi.org/10.1016/j.apenergy.2017.04.047","pdf":null,"citations":22,"abstract":null},{"id":"2018-algorithmic-innovations-and-software-for-the","title":"Algorithmic innovations and software for the dual decomposition method applied to stochastic mixed-integer programs","year":2017,"type":"journal","venue":"Mathematical Programming Computation","topics":["optimization-algorithms","uncertainty","software"],"authors":["Kibaek Kim","Ví­ctor M. Zavala"],"authorKeys":["lab:kibaek-kim","v-zavala"],"doi":"10.1007/s12532-017-0128-z","preprint":null,"url":"https://link.springer.com/article/10.1007%2Fs12532-017-0128-z","pdf":null,"citations":49,"abstract":null},{"id":"2017-an-augmented-lagrangian-filter-method-for","title":"An augmented lagrangian filter method for real-time embedded optimization","year":2017,"type":"journal","venue":"IEEE Transactions on Automatic Control","topics":["optimization-algorithms","control"],"authors":["Nai-Yuan Chiang","Rui Huang","Ví­ctor M. Zavala"],"authorKeys":["lab:nai-yuan-chiang","r-huang","v-zavala"],"doi":"10.1109/tac.2017.2694806","preprint":null,"url":"https://doi.org/10.1109/TAC.2017.2694806","pdf":"https://www.osti.gov/servlets/purl/1434487","citations":13,"abstract":"We present a filter line-search algorithm for nonconvex continuous optimization that combines an augmented Lagrangian function and a constraint violation metric to accept and reject steps. The approach is motivated by real-time optimization applications that need to be executed on embedded computing platforms with limited memory and processor speeds. The proposed method enables primal-dual regularization of the linear algebra system that in turn permits the use of solution strategies with lower computing overheads. We prove that the proposed algorithm is globally convergent and we demonstrate the developments using a nonconvex real-time optimization application for a building heating, ventilation, and air conditioning system. Our numerical tests are performed on a standard processor and on an embedded platform. We demonstrate that the approach reduces solution times by a factor of over 1000."},{"id":"2017-data-centers-as-dispatchable-loads-to","title":"Data Centers as Dispatchable Loads to Harness Stranded Power","year":2017,"type":"journal","venue":"IEEE Transactions on Sustainable Energy","topics":["energy-systems"],"authors":["Kibaek Kim","Fan Yang","Ví­ctor M. Zavala","Andrew A. Chien"],"authorKeys":["lab:kibaek-kim","f-yang","v-zavala","a-chien"],"doi":"10.1109/tste.2016.2593607","preprint":"https://arxiv.org/abs/1606.00350","url":"https://doi.org/10.1109/TSTE.2016.2593607","pdf":"https://arxiv.org/pdf/1606.00350","citations":67,"abstract":"We analyze how traditional data center placement and optimal placement of dispatchable data centers affect power grid efficiency. We use detailed network models, stochastic optimization formulations, and diverse renewable generation scenarios to perform our analysis. Our results reveal that significant spillage and stranded power will persist in power grids as wind power levels are increased. A counter-intuitive finding is that collocating data centers with inflexible loads next to wind farms has limited impacts on renewable portfolio standard (RPS) goals because it provides limited system-level flexibility. Such an approach can, in fact, increase stranded power and fossil-fueled generation. In contrast, optimally placing data centers that are dispatchable provides system-wide flexibility, reduces stranded power, and improves efficiency. In short, optimally placed dispatchable computing loads can enable better scaling to high RPS. In our case study, we find that these dispatchable computing loads are powered to 60-80% of their requested capacity, indicating that there are significant economic incentives provided by stranded power."},{"id":"2016-economic-assessment-and-optimal-operation-of","title":"Economic assessment and optimal operation of CSP systems with TES in California electricity markets","year":2017,"type":"conference","venue":"AIP conference proceedings","topics":["energy-systems"],"authors":["Alexander W. Dowling","Ana R. Dyreson","Franklin K. Miller","Ví­ctor M. Zavala"],"authorKeys":["lab:alexander-dowling","a-dyreson","f-miller","v-zavala"],"doi":"10.1063/1.4984540","preprint":null,"url":"http://aip.scitation.org/doi/abs/10.1063/1.4984540","pdf":null,"citations":6,"abstract":"The economics and performance of concentrated power (CSP) systems with thermal energy storage (TES) inherently depend on operating policies and the surrounding weather conditions and electricity markets. We present an integrated economic assessment framework to quantify the maximum possible revenues from simultaneous energy and ancillary services sales by CSP systems. The framework includes both discrete start-up/shutdown restrictions and detailed physical models. Analysis of coinci-dental historical market and meteorological data reveals provision of ancillary services increases market revenue 18% to 37% relative to energy-only participation. Surprisingly, only 53% to 62% of these revenues are available through sole participation in the day-ahead market, indicating significant opportunities at faster timescales. Motivated by water-usage concerns and permitting requirements, we also describe a new nighttime radiative-enhanced dry-cooling system with cold-side storage that consumes no water and offers higher effciencies than traditional air-cooled designs. Operation of this new system is complicated by the cold-side storage and inherent coupling between the cooling system and power plant, further motivating integrated economic analysis."},{"id":"2017-economic-assessment-of-concentrated-solar-power","title":"Economic assessment of concentrated solar power technologies: A review","year":2017,"type":"journal","venue":"Renewable and Sustainable Energy Reviews","topics":["energy-systems"],"authors":["Alexander W. Dowling","Tian Zheng","Ví­ctor M. Zavala"],"authorKeys":["lab:alexander-dowling","t-zheng","v-zavala"],"doi":"10.1016/j.rser.2017.01.006","preprint":null,"url":"https://doi.org/10.1016/j.rser.2017.01.006","pdf":null,"citations":151,"abstract":null},{"id":"2017-mpc-as-a-dvi-implications-on","title":"MPC as a DVI: Implications on Sampling Rates and Accuracy","year":2017,"type":"conference","venue":"Proceedings of the IEEE Conference on Decision & Control, including the Symposium on Adaptive Processes","topics":["control"],"authors":["Mihai Anitescu","Ví­ctor M. Zavala"],"authorKeys":["m-anitescu","v-zavala"],"doi":"10.1109/cdc.2017.8263932","preprint":null,"url":"https://doi.org/10.1109/cdc.2017.8263932","pdf":null,"citations":4,"abstract":"We show that closed-loop model predictive control (MPC) can be cast as a differential variational inequality (DVI). The DVI abstraction reveals that standard sampled-data MPC implementations (in which the control law is computed using states that are sampled at predefined sampling intervals) corresponds to an explicit Euler time-stepping scheme applied to the DVI. As expected, this explicit scheme induces large approximation errors (with respect to the optimal solution manifold of the DVI) when long sampling intervals are used. Motivated by this observation, we propose to use an implicit Euler scheme which allows us to use much longer sampling intervals, but note that this scheme requires the solution of a complicated variational inequality at every sampling time. We thus propose to use a predictor-corrector scheme, which can be implemented with off-the-shelf optimization tools and which mimics the performance of the implicit scheme."},{"id":"2017-optimization-formulations-for-multi-product-supply","title":"Optimization formulations for multi-product supply chain networks","year":2017,"type":"journal","venue":"Computers & Chemical Engineering","topics":["supply-chains","markets-decisions"],"authors":["Apoorva M. Sampat","Edgar Martín-Hernández","Mariano Martín","Ví­ctor M. Zavala"],"authorKeys":["lab:apoorva-sampat","e-martin","m-martin","v-zavala"],"doi":"10.1016/j.compchemeng.2017.04.021","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2017.04.021","pdf":"https://doi.org/10.1016/j.compchemeng.2017.04.021","citations":52,"abstract":null},{"id":"2017-redesigning-decision-making-architectures-to-exploit","title":"Redesigning Decision-Making Architectures to Exploit Multi-Scale Electricity Markets","year":2017,"type":"conference","venue":"Foundations of Computer-Aided Process Operations","topics":["energy-systems","markets-decisions"],"authors":["A.W. Dowling","V. M Zavala"],"authorKeys":["lab:alexander-dowling","v-zavala"],"doi":null,"preprint":null,"url":"http://folk.ntnu.no/skoge/prost/proceedings/focapo-cpc-2017/FOCAPO-CPC%202017%20Invited%20Papers/38_FOCAPO_Invited.pdf","pdf":null,"citations":null,"abstract":null},{"id":"2017-resolving-conflicts-among-stakeholders-in-real","title":"Resolving Conflicts Among Stakeholders in Real-Time Operations","year":2017,"type":"conference","venue":"Foundations of Computer-Aided Process Operations","topics":["markets-decisions","control"],"authors":["A.W. Dowling","V. M Zavala"],"authorKeys":["lab:alexander-dowling","v-zavala"],"doi":null,"preprint":null,"url":"http://folk.ntnu.no/skoge/prost/proceedings/focapo-cpc-2017/FOCAPO-CPC%202017%20Contributed%20Papers/51_FOCAPO_Contributed.pdf","pdf":null,"citations":null,"abstract":null},{"id":"2017-robustly-stable-economic-nmpc-for-non","title":"Robustly stable economic NMPC for non-dissipative stage costs","year":2017,"type":"journal","venue":"Journal of Process Control","topics":["control"],"authors":["Devin W. Griffith","Ví­ctor M. Zavala","Lorenz T. Biegler"],"authorKeys":["d-griffith","v-zavala","l-biegler"],"doi":"10.1016/j.jprocont.2017.06.016","preprint":null,"url":"https://doi.org/10.1016/j.jprocont.2017.06.016","pdf":"https://doi.org/10.1016/j.jprocont.2017.06.016","citations":38,"abstract":null},{"id":"2017-scalable-modeling-and-solution-of-stochastic","title":"Scalable modeling and solution of stochastic multiobjective optimization problems","year":2017,"type":"journal","venue":"Computers & Chemical Engineering","topics":["uncertainty","markets-decisions"],"authors":["Yankai Cao","Luis Fabián Fuentes-Cortés","Siyu Chen","Ví­ctor M. Zavala"],"authorKeys":["lab:yankai-cao","lab:luis-fabi-n-fuentes-cort-s","s-chen","v-zavala"],"doi":"10.1016/j.compchemeng.2017.01.021","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2017.01.021","pdf":"https://doi.org/10.1016/j.compchemeng.2017.01.021","citations":21,"abstract":null},{"id":"2017-spatially-explicit-methodology-for-coordinated-manure","title":"Spatially explicit methodology for coordinated manure management in shared watersheds","year":2017,"type":"journal","venue":"Journal of Environmental Management","topics":["waste-nutrients"],"authors":["Mahmoud A. Sharara","Apoorva M. Sampat","Laura Ward Good","Amanda S. Smith","Pamela A Porter","Ví­ctor M. Zavala","Rebecca A. Larson","Troy Michael Runge"],"authorKeys":["m-sharara","lab:apoorva-sampat","l-good","a-smith","p-porter","v-zavala","r-larson","t-runge"],"doi":"10.1016/j.jenvman.2017.01.033","preprint":null,"url":"https://doi.org/10.1016/j.jenvman.2017.01.033","pdf":"https://www.sciencedirect.com/science/article/pii/S0301479717300518/pdf","citations":31,"abstract":"Increased clustering and consolidation of livestock production systems has been linked to adverse impacts on water quality. This study presents a methodology to optimize manure management within a hydrologic region to minimize agricultural phosphorus (P) loss associated with winter manure application. Spatial and non-spatial data representing livestock, crop, soil, terrain and hydrography were compiled to determine manure P production rates, crop P uptake, existing manure storage capabilities, and transportation distances. Field slope, hydrologic soil group (HSG), and proximity to waterbodies were used to classify crop fields according to their runoff risk for winter-applied manure. We use these data to construct a comprehensive optimization model that identifies optimal location, size, and transportation strategy to achieve environmental and economic goals. The environmental goal was the minimization of daily hauling of manure to environmentally sensitive crop fields, i.e., those classified as high P-loss fields, whereas the economic goal was the minimization of the transportation costs across the entire study area. A case study encompassing two contiguous 10-digit hydrologic unit subwatersheds (HUC-10) in South Central Wisconsin, USA was developed to demonstrate the proposed methodology. Additionally, scenarios representing different management decisions (storage facility maximum volume, and project capital) and production conditions (increased milk production and 20-year future projection) were analyzed to determine their impact on optimal decisions."},{"id":"2016-a-computational-framework-for-identifiability-and","title":"A Computational Framework for Identifiability and Ill-Conditioning Analysis of Lithium-Ion Battery Models","year":2016,"type":"journal","venue":"Industrial & Engineering Chemistry Research","topics":["energy-systems","optimization-algorithms"],"authors":["Diana C. López","Günter Wozny","Antonio Flores-Tlacuahuac","Ruben Cesar Vasquez-Medrano","Ví­ctor M. Zavala"],"authorKeys":["d-lopez","g-wozny","a-flores","r-vasquez","v-zavala"],"doi":"10.1021/acs.iecr.5b03910","preprint":null,"url":"http://pubs.acs.org/doi/abs/10.1021/acs.iecr.5b03910","pdf":null,"citations":37,"abstract":"The lack of informative experimental data and the complexity of first-principles battery models make the recovery of kinetic, transport, and thermodynamic parameters complicated. We present a computational framework that combines sensitivity, singular value, and Monte Carlo analysis to explore how different sources of experimental data affect parameter structural ill-conditioning and identifiability. Our study is conducted on a modified version of the Doyle–Fuller–Newman model. We demonstrate that the use of voltage discharge curves only enables the identification of a small parameter subset, regardless of the number of experiments considered. Furthermore, we show that the inclusion of a single electrolyte concentration measurement significantly aids identifiability and mitigates ill-conditioning."},{"id":"2016-a-framework-for-multi-stakeholder-decision","title":"A framework for multi-stakeholder decision-making and conflict resolution","year":2016,"type":"journal","venue":"Computers & Chemical Engineering","topics":["markets-decisions","uncertainty"],"authors":["Alexander W. Dowling","Gerardo J. Ruiz-Mercado","Ví­ctor M. Zavala"],"authorKeys":["lab:alexander-dowling","g-ruiz","v-zavala"],"doi":"10.1016/j.compchemeng.2016.03.034","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2016.03.034","pdf":"https://doi.org/10.1016/j.compchemeng.2016.03.034","citations":83,"abstract":null},{"id":"2016-a-high-performance-computing-framework-for","title":"A high-performance computing framework for analyzing the economic impacts of wind correlation","year":2016,"type":"journal","venue":"Electric Power Systems Research","topics":["energy-systems","uncertainty"],"authors":["Cosmin G. Petra","Ví­ctor M. Zavala","Elías D. Niño-Ruiz","Mihai Anitescu"],"authorKeys":["c-petra","v-zavala","e-nino","m-anitescu"],"doi":"10.1016/j.epsr.2016.08.010","preprint":null,"url":"https://doi.org/10.1016/j.epsr.2016.08.010","pdf":"https://doi.org/10.1016/j.epsr.2016.08.010","citations":5,"abstract":null},{"id":"2016-an-inertia-free-filter-line-search","title":"An inertia-free filter line-search algorithm for large-scale nonlinear programming","year":2016,"type":"journal","venue":"Computational Optimization and Applications","topics":["optimization-algorithms"],"authors":["Nai-Yuan Chiang","Ví­ctor M. Zavala"],"authorKeys":["lab:nai-yuan-chiang","v-zavala"],"doi":"10.1007/s10589-015-9820-y","preprint":null,"url":"https://link.springer.com/article/10.1007/s10589-015-9820-y","pdf":null,"citations":29,"abstract":null},{"id":"2016-clustering-based-preconditioning-for-stochastic-programs","title":"Clustering-based preconditioning for stochastic programs","year":2016,"type":"journal","venue":"Computational Optimization and Applications","topics":["optimization-algorithms","uncertainty"],"authors":["Yankai Cao","Carl D. Laird","Ví­ctor M. Zavala"],"authorKeys":["lab:yankai-cao","c-laird","v-zavala"],"doi":"10.1007/s10589-015-9813-x","preprint":null,"url":"https://link.springer.com/article/10.1007/s10589-015-9813-x","pdf":null,"citations":22,"abstract":null},{"id":"2016-economic-nonlinear-model-predictive-control-for","title":"Economic nonlinear model predictive control for mechanical pulping processes","year":2016,"type":"conference","venue":"Proceedings of the ... American Control Conference/Proceedings of the American Control Conference","topics":["control"],"authors":["Hui Tian","Qiugang Lu","R. Bhushan Gopaluni","Ví­ctor M. Zavala","James A. Olson"],"authorKeys":["h-tian","lab:qiugang-lu","r-gopaluni","v-zavala","j-olson"],"doi":"10.1109/acc.2016.7525179","preprint":null,"url":"http://ieeexplore.ieee.org/abstract/document/7525179/","pdf":null,"citations":6,"abstract":"In this paper we present an economic model predictive control (econ MPC) strategy for a two-stage (primary and secondary refining) Mechanical Pulping (MP) process. The MP process is a complex multi-input multi-output (MIMO) nonlinear process with strong interactions among the variables. In order to guarantee both stability and convergence of the closed-loop nonlinear MP process, two different econ MPC schemes are proposed: one with penalty on the increment of the input and one with penalty on the offset of the input from its steady-state target. We demonstrate that both econ MPC schemes achieve significant amount of energy reduction in terms of the specific energy consumed by the process while ensuring closed-loop stability and convergence to a nearby steady-state. In addition, we show that more energy reduction can be achieved by using the econ MPC with penalty on the input increment compared with the other scheme. Simulation results also demonstrate the potential benefits of using econ MPC over the standard MPC technique."},{"id":"2016-emerging-optimal-control-models-and-solvers","title":"Emerging Optimal Control Models and Solvers for Interconnected Natural Gas and Electricity Networks","year":2016,"type":"chapter-report","venue":"Springer eBooks","topics":["energy-systems","control"],"authors":["Nai-Yuan Chiang","Ví­ctor M. Zavala"],"authorKeys":["lab:nai-yuan-chiang","v-zavala"],"doi":"10.1007/978-3-319-28752-2_4","preprint":null,"url":"https://link.springer.com/chapter/10.1007/978-3-319-28752-2_4","pdf":null,"citations":1,"abstract":null},{"id":"2016-evaluation-of-manure-storage-capital-projects","title":"Evaluation of Manure Storage Capital Projects in the Yahara River Watershed","year":2016,"type":"chapter-report","venue":"Technical Report for Dane County, WI","topics":["waste-nutrients"],"authors":["R. Larson","M. Sharara","L. Good","T. Porter","V.M. Zavala","A. Sampat","A Smith"],"authorKeys":["r-larson","m-sharara","l-good","t-porter","v-zavala","lab:apoorva-sampat","lab:alexander-smith"],"doi":null,"preprint":null,"url":null,"pdf":null,"citations":null,"abstract":null},{"id":"2016-integrated-design-and-control-of-multigeneration","title":"Integrated design and control of multigeneration systems for building complexes","year":2016,"type":"journal","venue":"Energy","topics":["energy-systems","control"],"authors":["Luis Fabián Fuentes-Cortés","Alexander W. Dowling","Carlos Rubio-Maya","Ví­ctor M. Zavala","José María Ponce-Ortega"],"authorKeys":["lab:luis-fabi-n-fuentes-cort-s","lab:alexander-dowling","c-rubio","v-zavala","j-ponce"],"doi":"10.1016/j.energy.2016.05.093","preprint":null,"url":"https://doi.org/10.1016/j.energy.2016.05.093","pdf":null,"citations":38,"abstract":null},{"id":"2016-large-scale-optimal-control-of-interconnected","title":"Large-scale optimal control of interconnected natural gas and electrical transmission systems","year":2016,"type":"journal","venue":"Applied Energy","topics":["energy-systems","control"],"authors":["Nai-Yuan Chiang","Ví­ctor M. Zavala"],"authorKeys":["lab:nai-yuan-chiang","v-zavala"],"doi":"10.1016/j.apenergy.2016.01.017","preprint":null,"url":"https://doi.org/10.1016/j.apenergy.2016.01.017","pdf":"https://doi.org/10.1016/j.apenergy.2016.01.017","citations":73,"abstract":null},{"id":"2016-large-scale-stochastic-mixed-integer-programming","title":"Large-Scale Stochastic Mixed-Integer Programming Algorithms for Power Generation Scheduling","year":2016,"type":"chapter-report","venue":"Springer eBooks","topics":["energy-systems","uncertainty","optimization-algorithms"],"authors":["Kibaek Kim","Ví­ctor M. Zavala"],"authorKeys":["lab:kibaek-kim","v-zavala"],"doi":"10.1007/978-3-319-28752-2_18","preprint":null,"url":"https://link.springer.com/chapter/10.1007/978-3-319-28752-2_18","pdf":null,"citations":7,"abstract":null},{"id":"2016-managing-conflicts-among-decision-makers-in","title":"Managing Conflicts Among Decision Makers in Multiobjective Design and Operations","year":2016,"type":"chapter-report","venue":"Elsevier eBooks","topics":["markets-decisions"],"authors":["Ví­ctor M. Zavala"],"authorKeys":["v-zavala"],"doi":"10.1016/b978-0-12-802032-6.00007-4","preprint":null,"url":"https://doi.org/10.1016/B978-0-12-802032-6.00007-4","pdf":null,"citations":7,"abstract":null},{"id":"2016-multiobjective-economic-model-predictive-control-of","title":"Multiobjective economic model predictive control of mechanical pulping processes","year":2016,"type":"conference","venue":"Proceedings of the IEEE Conference on Decision & Control, including the Symposium on Adaptive Processes","topics":["control"],"authors":["Hui Tian","Qiugang Lu","R. Bhushan Gopaluni","Ví­ctor M. Zavala"],"authorKeys":["h-tian","lab:qiugang-lu","r-gopaluni","v-zavala"],"doi":"10.1109/cdc.2016.7798881","preprint":null,"url":"http://ieeexplore.ieee.org/abstract/document/7798881/","pdf":null,"citations":3,"abstract":"We present a multiobjective economic model predictive control (m-econ MPC) strategy to mitigate high electrical energy demands of a two-stage mechanical pulping (MP) process. The nonlinear MP process considered in this paper consists of a primary and a secondary refiner. In the proposed m-econ MPC technique, economic performance is optimized during dynamic transitions while a stabilizing constraint is used to ensure convergence to steady-state operating points. Through simulations, we demonstrate that the m-econ MPC can reduce the energy consumed by mechanical pulping processes by up to 27%."},{"id":"2016-new-architectures-for-hierarchical-predictive-control","title":"New Architectures for Hierarchical Predictive Control","year":2016,"type":"conference","venue":"IFAC-PapersOnLine","topics":["control"],"authors":["Ví­ctor M. Zavala"],"authorKeys":["v-zavala"],"doi":"10.1016/j.ifacol.2016.07.214","preprint":null,"url":"https://doi.org/10.1016/j.ifacol.2016.07.214","pdf":"https://doi.org/10.1016/j.ifacol.2016.07.214","citations":27,"abstract":"We analyze the structure of the Euler-Lagrange (EL) conditions of a long-horizon optimal control problem. The analysis reveals that the conditions can be solved by using block Gauss-Seidel (GS) schemes. We prove that such schemes can be implemented in the primal space by solving sequences of short-horizon optimal control problems. This analysis also reveals that a traditional receding-horizon (RH) scheme is equivalent to performing a single GS sweep. We have also found that we can use adjoint information from a coarse long-horizon problem to construct terminal penalties that correct the policies of the RH scheme. We observe that this scheme can be interpreted as a hierarchical controller in which a coarse high-level controller transfers long-horizon information to a low-level, short-horizon controller of fine resolution. The results open the door to a new family of hierarchical control architectures that can handle multiple time scales systematically."},{"id":"2016-stochastic-optimization-of-sub-hourly-economic","title":"Stochastic Optimization of Sub-Hourly Economic Dispatch With Wind Energy","year":2016,"type":"journal","venue":"IEEE Transactions on Power Systems","topics":["energy-systems","uncertainty"],"authors":["Harsha Gangammanavar","Suvrajeet Sen","Ví­ctor M. Zavala"],"authorKeys":["h-gangammanavar","s-sen","v-zavala"],"doi":"10.1109/tpwrs.2015.2410301","preprint":null,"url":"http://ieeexplore.ieee.org/document/7065337/","pdf":null,"citations":106,"abstract":"We present a stochastic programming framework for a multiple timescale economic dispatch problem to address integration of renewable energy resources into power systems. This framework allows certain slow-response energy resources to be controlled at an hourly timescale, while fast-response resources, including renewable resources, and related network decisions can be controlled at a sub-hourly timescale. To this end, we study two models motivated by actual scheduling practices of system operators. Using an external simulator as driver for sub-hourly wind generation, we optimize these economic dispatch models using stochastic decomposition, a sample-based approach for stochastic programming. Computational experiments, conducted on the IEEE-RTS96 system and the Illinois system, reveal that optimization with sub-hourly dispatch not only results in lower expected operational costs, but also predicts these costs with far greater accuracy than with models allowing only hourly dispatch. Our results also demonstrate that when compared with standard approaches using the extensive formulation of stochastic programming, the sequential sampling approach of stochastic decomposition provides better predictions with much less computational time."},{"id":"2015-a-multiobjective-optimization-perspective-on-the","title":"A multiobjective optimization perspective on the stability of economic MPC","year":2015,"type":"conference","venue":"IFAC-PapersOnLine","topics":["control","markets-decisions"],"authors":["Ví­ctor M. Zavala"],"authorKeys":["v-zavala"],"doi":"10.1016/j.ifacol.2015.09.096","preprint":null,"url":"https://doi.org/10.1016/j.ifacol.2015.09.096","pdf":"https://doi.org/10.1016/j.ifacol.2015.09.096","citations":42,"abstract":"We interpret economic MPC as a scheme that trades off economic performance and stability. We use this notion to design an economic MPC controller that exploits the inherent robustness of a stable auxiliary MPC controller to enhance economic performance. Specifically, we incorporate a flexible stabilizing constraint to the economic MPC formulation that preserves stability of the auxiliary controller. We use multiobjective optimization concepts to argue that the dual variable of the stabilizing constraint can be interpreted as a price of stability and we establish an equivalence between the proposed controller and regularized economic MPC controllers. We demonstrate that nontrivial gains in economic performance can be achieved without compromising stability."},{"id":"2015-nonlinear-programming-strategies-on-high-performance","title":"Nonlinear programming strategies on high-performance computers","year":2015,"type":"conference","venue":"Proceedings of the IEEE Conference on Decision & Control, including the Symposium on Adaptive Processes","topics":["optimization-algorithms"],"authors":["Jia Kang","Nai-Yuan Chiang","Carl D. Laird","Ví­ctor M. Zavala"],"authorKeys":["j-kang","lab:nai-yuan-chiang","c-laird","v-zavala"],"doi":"10.1109/cdc.2015.7402938","preprint":null,"url":"http://ieeexplore.ieee.org/abstract/document/7402938/","pdf":null,"citations":25,"abstract":"In this tutorial we discuss fundamental concepts that enable the solution of large-scale structured nonlinear programming problems on high-performance computers. We focus on linear algebra parallelization strategies and discuss how such strategies influence the choice of algorithmic frameworks capable of enforcing global convergence and deal with nonconvexities. We also discuss how the characteristics of different computing architectures influence the choice of algorithmic strategies."},{"id":"2014-analyzing-the-effects-of-comfort-relaxation","title":"Analyzing the effects of comfort relaxation on energy demand flexibility of buildings: A multiobjective optimization approach","year":2014,"type":"journal","venue":"Energy and Buildings","topics":["energy-systems","control"],"authors":["Pilar Morales","Antonio Flores-Tlacuahuac","Ví­ctor M. Zavala"],"authorKeys":["p-morales","a-flores","v-zavala"],"doi":"10.1016/j.enbuild.2014.09.040","preprint":null,"url":"https://doi.org/10.1016/j.enbuild.2014.09.040","pdf":"https://doi.org/10.1016/j.enbuild.2014.09.040","citations":39,"abstract":null},{"id":"2014-evaluating-storage-systems-for-scientific-data","title":"Evaluating Storage Systems for Scientific Data in the Cloud","year":2014,"type":"conference","venue":"Proceedings of the 5th ACM Workshop on Scientific Cloud Computing","topics":["optimization-algorithms"],"authors":["Ketan C. Maheshwari","Justin M. Wozniak","Hao Yang","Daniel S. Katz","Matei Ripeanu","Ví­ctor M. Zavala","Michael Wilde"],"authorKeys":["k-maheshwari","j-wozniak","h-yang","d-katz","m-ripeanu","v-zavala","m-wilde"],"doi":"10.1145/2608029.2608034","preprint":null,"url":"https://dl.acm.org/citation.cfm?id=2608034","pdf":null,"citations":5,"abstract":"Infrastructure-as-a-Service (IaaS) clouds are an appealing resource for scientific computing. However, the bare-bones presentation of raw Linux virtual machines leaves much to the application developer. For many cloud applications, effective data handling is critical to efficient application execution. This paper investigates the capabilities of a variety of POSIX-accessible distributed storage systems to manage data access patterns resulting from workflow application executions in the cloud. We leverage the expressivity of the Swift parallel scripting framework to benchmark the performance of a number of storage systems using synthetic workloads and three real-world applications. We characterize two representative commercial storage systems (Amazon S3 and HDFS, respectively) and two emerging research-based storage systems (Chirp/Parrot and MosaStore). We find the use of aggregated node-local resources effective and economical compared with remotely located S3 storage. Our experiments show that applications run at scale with MosaStore show up to 30\\% improvement in makespan time compared with those run with S3. We also find that storage-system driven application deployments in the cloud results in better runtime performance compared with an on-demand data-staging driven approach."},{"id":"2014-inference-of-building-occupancy-signals-using","title":"Inference of building occupancy signals using moving horizon estimation and Fourier regularization","year":2014,"type":"journal","venue":"Journal of Process Control","topics":["control","energy-systems"],"authors":["Ví­ctor M. Zavala"],"authorKeys":["v-zavala"],"doi":"10.1016/j.jprocont.2013.09.020","preprint":null,"url":"https://doi.org/10.1016/j.jprocont.2013.09.020","pdf":null,"citations":13,"abstract":null},{"id":"2014-measurement-and-verification-of-building-systems","title":"Measurement and verification of building systems under uncertain data: A Gaussian process modeling approach","year":2014,"type":"journal","venue":"Energy and Buildings","topics":["energy-systems","uncertainty"],"authors":["Michael C. Burkhart","Yeonsook Heo","Ví­ctor M. Zavala"],"authorKeys":["m-burkhart","lab:yeonsook-heo","v-zavala"],"doi":"10.1016/j.enbuild.2014.01.048","preprint":null,"url":"https://doi.org/10.1016/j.enbuild.2014.01.048","pdf":null,"citations":69,"abstract":null},{"id":"2014-scalable-nonlinear-programming-via-exact-differentiable","title":"Scalable nonlinear programming via exact differentiable penalty functions and trust-region Newton methods","year":2014,"type":"journal","venue":"SIAM Journal on Optimization","topics":["optimization-algorithms"],"authors":["Ví­ctor M. Zavala","Mihai Anitescu"],"authorKeys":["v-zavala","m-anitescu"],"doi":"10.1137/120888181","preprint":null,"url":"http://epubs.siam.org/doi/abs/10.1137/120888181","pdf":null,"citations":17,"abstract":"We present an approach for nonlinear programming based on the direct minimization of an exact differentiable penalty function using trust-region Newton techniques. The approach provides desirable features required for scalability: it can detect and exploit directions of negative curvature, it is superlinearly convergent, and it enables the scalable computation of the Newton step through iterative linear algebra. Moreover, it presents features that are desirable for parametric optimization problems that must be solved in a latency-limited environment, as is the case for model predictive control and mixed-integer nonlinear programming. These features are fast detection of activity, efficient warm starting, and progress on a primal-dual merit function at every iteration. We note that other algorithmic approaches fail to satisfy at least one of these features. We derive general convergence results for our approach and demonstrate its behavior through numerical studies."},{"id":"2014-stochastic-optimal-control-model-for-natural","title":"Stochastic optimal control model for natural gas networks","year":2014,"type":"journal","venue":"Computers & Chemical Engineering","topics":["energy-systems","uncertainty","control"],"authors":["Ví­ctor M. Zavala"],"authorKeys":["v-zavala"],"doi":"10.1016/j.compchemeng.2014.02.002","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2014.02.002","pdf":null,"citations":76,"abstract":null},{"id":"2014-structured-nonconvex-optimization-of-large-scale","title":"Structured nonconvex optimization of large-scale energy systems using PIPS-NLP","year":2014,"type":"conference","venue":"Power Systems Computation Conference","topics":["optimization-algorithms","energy-systems","software"],"authors":["Nai-Yuan Chiang","Cosmin G. Petra","Ví­ctor M. Zavala"],"authorKeys":["lab:nai-yuan-chiang","c-petra","v-zavala"],"doi":"10.1109/pscc.2014.7038374","preprint":null,"url":"http://ieeexplore.ieee.org/abstract/document/7038374/","pdf":null,"citations":48,"abstract":"We present PIPS-NLP, a software library for the solution of large-scale structured nonconvex optimization problems on high-performance computers. We discuss the features of the implementation in the context of electrical power and gas network systems. We illustrate how different model structures arise in these domains and how these can be exploited to achieve high computational efficiency. Using computational studies from security-constrained ACOPF and line-pack dispatch in natural gas networks, we demonstrate robustness and scalability."},{"id":"2013-cost-effective-measurement-and-verification-method","title":"Cost-Effective Measurement and Verification Method for Determining Energy Savings under Uncertainty","year":2013,"type":"conference","venue":"Proceedings of ASHRAE Annual Conference","topics":["energy-systems","markets-decisions"],"authors":["Y. Heo","D. Graziano","V.M. Zavala","P. Dickinson","M. Kamrath","M Kirshenbaum"],"authorKeys":["lab:yeonsook-heo","d-graziano","v-zavala","p-dickinson","m-kamrath","m-kirshenbaum"],"doi":null,"preprint":null,"url":null,"pdf":null,"citations":null,"abstract":null},{"id":"2013-stochastic-optimization-approach-to-water-management","title":"Stochastic optimization approach to water management in cooling-constrained power plants","year":2013,"type":"journal","venue":"Applied Energy","topics":["energy-systems","uncertainty"],"authors":["Juan M. Salazar","Urmila M. Diwekar","Emil M. Constantinescu","Ví­ctor M. Zavala"],"authorKeys":["j-salazar","u-diwekar","e-constantinescu","v-zavala"],"doi":"10.1016/j.apenergy.2013.05.077","preprint":null,"url":"https://doi.org/10.1016/j.apenergy.2013.05.077","pdf":null,"citations":24,"abstract":null},{"id":"2012-gaussian-process-modeling-for-measurement-and","title":"Gaussian process modeling for measurement and verification of building energy savings","year":2012,"type":"journal","venue":"Energy and Buildings","topics":["energy-systems","uncertainty"],"authors":["Yeonsook Heo","Ví­ctor M. Zavala"],"authorKeys":["lab:yeonsook-heo","v-zavala"],"doi":"10.1016/j.enbuild.2012.06.024","preprint":null,"url":"https://doi.org/10.1016/j.enbuild.2012.06.024","pdf":null,"citations":172,"abstract":null},{"id":"2013-real-time-optimization-strategies-for-building","title":"Real-Time Optimization Strategies for Building Systems","year":2012,"type":"journal","venue":"Industrial & Engineering Chemistry Research","topics":["energy-systems","control"],"authors":["Ví­ctor M. Zavala"],"authorKeys":["v-zavala"],"doi":"10.1021/ie3008727","preprint":null,"url":"http://pubs.acs.org/doi/abs/10.1021/ie3008727","pdf":null,"citations":80,"abstract":"We analyze different optimization strategies for real-time energy management in building systems. We have found that exploiting building-wide multivariable interactions between CO 2, humidity, pressure, occupancy, and temperature leads to significant reductions of energy intensity. Our analysis indicates that it is possible to obtain drastic energy savings compared with traditional control strategies. The exploitation of the thermal comfort zone has been found to be the most relevant factor driving energy savings. We discuss strategies to handle multiple competing objectives as well as economic functions and we analyze financial incentives provided by real-time prices and existing market designs. Numerical experiments are provided to support the claims."},{"id":"2012-real-time-resolution-of-conflicting-objectives","title":"Real-time resolution of conflicting objectives in building energy management: an utopia-tracking approach","year":2012,"type":"conference","venue":"5th national conference of IBPSA-USA","topics":["control","markets-decisions"],"authors":["V.M Zavala"],"authorKeys":["v-zavala"],"doi":"10.26868/30680611.2012.01a_1_zavala","preprint":null,"url":"http://www.ibpsa-usa.org/index.php/ibpusa/article/view/407","pdf":null,"citations":null,"abstract":null},{"id":"2012-stability-of-multiobjective-predictive-control-a","title":"Stability of multiobjective predictive control: A utopia-tracking approach","year":2012,"type":"journal","venue":"Automatica","topics":["control","markets-decisions"],"authors":["Ví­ctor M. Zavala","Antonio Flores-Tlacuahuac"],"authorKeys":["v-zavala","a-flores"],"doi":"10.1016/j.automatica.2012.06.066","preprint":null,"url":"https://doi.org/10.1016/j.automatica.2012.06.066","pdf":null,"citations":150,"abstract":null},{"id":"2010-a-computational-framework-for-uncertainty-quantification","title":"A computational framework for uncertainty quantification and stochastic optimization in unit commitment with wind power generation","year":2011,"type":"journal","venue":"IEEE Transactions on Power Systems","topics":["energy-systems","uncertainty"],"authors":["Emil M. Constantinescu","Ví­ctor M. Zavala","Matthew Rocklin","Sangmin Lee","Mihai Anitescu"],"authorKeys":["e-constantinescu","v-zavala","m-rocklin","s-lee","m-anitescu"],"doi":"10.1109/tpwrs.2010.2048133","preprint":null,"url":"http://ieeexplore.ieee.org/document/5467169/","pdf":null,"citations":259,"abstract":"We present a computational framework for integrating a state-of-the-art numerical weather prediction (NWP) model in stochastic unit commitment/economic dispatch formulations that account for wind power uncertainty. We first enhance the NWP model with an ensemble-based uncertainty quantification strategy implemented in a distributed-memory parallel computing architecture. We discuss computational issues arising in the implementation of the framework and validate the model using real wind-speed data obtained from a set of meteorological stations. We build a simulated power system to demonstrate the developments."},{"id":"2011-a-game-theoretical-model-predictive-control","title":"A game-theoretical model predictive control framework for electricity markets","year":2011,"type":"conference","venue":"Allerton Conference on Communication, Control, and Computing","topics":["energy-systems","markets-decisions","control"],"authors":["Aswin Kannan","Ví­ctor M. Zavala"],"authorKeys":["a-kannan","v-zavala"],"doi":"10.1109/allerton.2011.6120315","preprint":null,"url":"http://ieeexplore.ieee.org/abstract/document/6120315/","pdf":"https://zenodo.org/record/1264184","citations":8,"abstract":"We present a game-theoretical model predictive control (MPC) framework for competitive electricity markets. We demonstrate that an MPC construct can be used to systematically analyze the effects of ramp constraints, initial conditions, dynamic disturbances, forecast horizon length, market manipulation, and bidding frequency on market performance. We illustrate the capabilities of the framework using a numerical case study."},{"id":"2011-adjoint-sensitivity-analysis-for-numerical-weather","title":"Adjoint Sensitivity Analysis for Numerical Weather Prediction: Applications to Power Grid Optimization","year":2011,"type":"conference","venue":"Proceedings of International Workshop on High Performance Computing, Networking and Analytics for the Power Grid","topics":["energy-systems","uncertainty"],"authors":["A. Cioaca","V.M. Zavala","E.M Constantinescu"],"authorKeys":["a-cioaca","v-zavala","e-constantinescu"],"doi":"10.1145/2096123.2096133","preprint":null,"url":"https://dl.acm.org/citation.cfm?id=2096133","pdf":null,"citations":null,"abstract":null},{"id":"2011-convergence-analysis-of-a-parallel-newton","title":"Convergence analysis of a parallel Newton scheme for dynamic power grid simulations","year":2011,"type":"conference","venue":"International Conference for High Performance Computing, Networking, Storage and Analysis","topics":["energy-systems","optimization-algorithms"],"authors":["Brett A. Robbins","Ví­ctor M. Zavala"],"authorKeys":["b-robbins","v-zavala"],"doi":"10.1145/2096123.2096127","preprint":null,"url":"https://dl.acm.org/citation.cfm?id=2096127","pdf":null,"citations":4,"abstract":"We analyze the convergence properties of a parallel Newton scheme for differential systems. The scheme concurrently solves the time-coupled nonlinear systems arising from the application of implicit discretization schemes. We have found that the scheme acts as a tracking algorithm that converges to a moving manifold given by the solution of the nonlinear system at the current time step parameterized in the iterating solution of the previous step. This property explains why the method can significantly reduce the number of iterations compared with the sequential Newton method that marches forward in time. The method exhibits a theoretical lower bound on the number of iterations equal to the number of discretization points. A numerical study using a detailed dynamic power grid model is provided to demonstrate the scalability of the method."},{"id":"2011-new-insights-into-the-dynamic-stability","title":"New Insights into the Dynamic Stability of Wholesale Electricity Markets","year":2011,"type":"conference","venue":"Proceedings of IEEE International Symposium on Computer-Aided Control System Design","topics":["energy-systems","markets-decisions"],"authors":["Ví­ctor M. Zavala","Mihai Anitescu"],"authorKeys":["v-zavala","m-anitescu"],"doi":"10.1109/cacsd.2011.6044562","preprint":null,"url":"http://ieeexplore.ieee.org/abstract/document/6044562/","pdf":null,"citations":5,"abstract":"We summarize some recent results on the dynamic stability of wholesale electricity markets. We discuss how to construct control-theoretic market analysis frameworks using concepts of market efficiency, Lyapunov stability, and predictive control. Such frameworks can be used to design, analyze, and monitor the stability and robustness properties of different market designs. In particular, we discuss how short forecast horizons, incomplete gaming, and physical ramping constraints can give rise to stability issues."},{"id":"2011-proactive-energy-management-for-high-performance","title":"Proactive Energy Management for High-Performance Buildings: Exploiting and Motivating Sensor Technologies","year":2011,"type":"conference","venue":"Proceedings of Future of Instrumentation International Workshop","topics":["energy-systems","control"],"authors":["Ví­ctor M. Zavala"],"authorKeys":["v-zavala"],"doi":"10.1109/fiiw.2011.6476835","preprint":null,"url":"http://ieeexplore.ieee.org/abstract/document/6476835/","pdf":null,"citations":1,"abstract":"We discuss how sensor technologies have enabled the development of proactive energy management (EM) systems. At the same time, we discuss how these emerging EM systems motivate the development of new sensor technologies. Proactive EM systems integrate advances in weather forecasting, sensors, predictive models, and real-time optimization algorithms to anticipate uncertain factors that affect energy performance and costs and make real-time set-point corrections (supply conditions, ventilation rates, thermostats) to modulate them. Ongoing deployment studies have found that up to 30% HVAC energy savings are achievable with this type of technology. We describe extensions of these systems to exploit emerging sensor technologies including occupancy, ventilation, and air quality sensors."},{"id":"2011-scalable-stochastic-optimization-of-complex-energy","title":"Scalable stochastic optimization of complex energy systems","year":2011,"type":"conference","venue":"International Conference for High Performance Computing, Networking, Storage and Analysis","topics":["uncertainty","optimization-algorithms","energy-systems"],"authors":["Miles Lubin","Cosmin G. Petra","Mihai Anitescu","Ví­ctor M. Zavala"],"authorKeys":["m-lubin","c-petra","m-anitescu","v-zavala"],"doi":"10.1145/2063384.2063470","preprint":null,"url":"https://dl.acm.org/citation.cfm?id=2063470","pdf":null,"citations":54,"abstract":"We present a scalable approach and implementation for solving stochastic programming problems, with application to the optimization of complex energy systems under uncertainty. Stochastic programming is used to make decisions in the present while incorporating a model of uncertainty about future events (scenarios). These problems present serious computational difficulties as the number of scenarios becomes large and the complexity of the system and planning horizons increase, necessitating the use of parallel computing. Our novel hybrid parallel implementation PIPS is based on interior-point methods and uses a Schur complement technique to obtain a scenario-based decomposition of the linear algebra. PIPS is applied to a stochastic economic dispatch problem that uses hourly wind forecasts and a detailed physical power flow model. Solving this problem is necessary for efficient integration of wind power with the Illinois power grid and real-time energy market. Strong scaling efficiency of 96% is obtained on 32 racks (131,072 cores) of the \"Intrepid\" Blue Gene/P system at Argonne National Laboratory."},{"id":"2010-achieving-higher-frequencies-in-large-scale","title":"Achieving higher frequencies in large-scale nonlinear model predictive control","year":2010,"type":"conference","venue":"Proceedings of the IEEE Conference on Decision & Control, including the Symposium on Adaptive Processes","topics":["control","optimization-algorithms"],"authors":["Ví­ctor M. Zavala","Mihai Anitescu"],"authorKeys":["v-zavala","m-anitescu"],"doi":"10.1109/cdc.2010.5717498","preprint":null,"url":"http://ieeexplore.ieee.org/abstract/document/5717498/","pdf":null,"citations":0,"abstract":"We present new insights into how to achieve higher frequencies in large-scale nonlinear predictive control using truncated-like schemes. The basic idea is that, instead of solving the full nonlinear optimization (NLO) problem at each sampling time, we solve a single, truncated quadratic optimization (QO) problem. We present conditions guaranteeing stability of the approximation error for truncated schemes using generalized equation concepts. In addition, we propose a preliminary scheme using an augmented Lagrangian reformulation of the NLO and projected successive overrelaxation to solve the underlying QO. This strategy enables early termination of the QO solution because it can perform linear algebra and active-set identification tasks simultaneously. A simple numerical case study is provided."},{"id":"2010-advances-in-moving-horizon-estimation-for","title":"Advances in moving horizon estimation for nonlinear systems","year":2010,"type":"conference","venue":"Proceedings of the IEEE Conference on Decision & Control, including the Symposium on Adaptive Processes","topics":["control"],"authors":["A. Alessandri","Marco Baglietto","Giorgio Battistelli","Ví­ctor M. Zavala"],"authorKeys":["a-alessandri","m-baglietto","g-battistelli","v-zavala"],"doi":"10.1109/cdc.2010.5718126","preprint":null,"url":"http://ieeexplore.ieee.org/abstract/document/5718126/","pdf":null,"citations":74,"abstract":"In the last decade, moving horizon estimation (MHE) has emerged as a powerful technique for tackling the problem of estimating the state of a dynamic system in the presence of nonlinearities and disturbances. MHE is based on the idea of minimizing an estimation cost function defined on a sliding window composed of a finite number of time stages. The cost function is usually made up of two contributions: a prediction error computed on a recent batch of inputs and outputs; an arrival cost that serves the purpose of summarizing the past data. However, the diffusion of such techniques has been hampered by: i) the difficulty in choosing the arrival cost so as to ensure stability of the overall estimation scheme; ii) the request of an adequate computational effort on line. In this paper, both problems are addressed and possible solutions are proposed. First, by means of a novel stability analysis, it is constructively shown that under very general observability conditions a quadratic arrival cost is sufficient to ensure the stability of the estimation error provided that the weight matrix is adequately chosen. Second, a novel approximate MHE algorithm is proposed that is based on nonlinear programming sensitivity calculations. The approximate MHE algorithm has the same stability properties of the optimal one which make the overall approach suitable to be applied in real settings. Preliminary simulation results confirm the effectiveness of proposed method."},{"id":"2010-computational-and-economic-limitations-of-dispatch","title":"Computational and economic limitations of dispatch operations in the next-generation power grid","year":2010,"type":"conference","venue":"IEEE Conference on Innovative Technologies for an Efficient and Reliable Electricity Supply","topics":["energy-systems"],"authors":["Ví­ctor M. Zavala","Audun Botterud","Emil M. Constantinescu","Jianhui Wang"],"authorKeys":["v-zavala","a-botterud","e-constantinescu","j-wang"],"doi":"10.1109/citres.2010.5619768","preprint":null,"url":"http://ieeexplore.ieee.org/abstract/document/5619768/","pdf":null,"citations":12,"abstract":"We study the interactions between computational and economic performance of dispatch operations under highly dynamic environments. In particular, we discuss the need for extending the forecast horizon of the dispatch formulation in order to anticipate steep variations of renewable power and highly elastic loads. We present computational strategies to solve the increasingly larger optimization problems in real time. To illustrate the developments, we use a detailed dispatch model of the entire Illinois system with out-of-state wind generation."},{"id":"2010-computationally-efficient-approximate-moving-horizon-state","title":"Computationally Efficient, Approximate Moving Horizon State Estimation for Nonlinear Systems","year":2010,"type":"conference","venue":"IFAC Proceedings Volumes","topics":["control"],"authors":["A. Alessandri","Marco Baglietto","Giorgio Battistelli","Ví­ctor M. Zavala"],"authorKeys":["a-alessandri","m-baglietto","g-battistelli","v-zavala"],"doi":"10.3182/20100901-3-it-2016.00273","preprint":null,"url":"https://doi.org/10.3182/20100901-3-IT-2016.00273","pdf":null,"citations":0,"abstract":null},{"id":"2010-economic-impacts-of-advanced-weather-forecasting","title":"Economic impacts of advanced weather forecasting on energy system operations","year":2010,"type":"conference","venue":"IEEE Conference on Innovative Smart Grid Technologies","topics":["energy-systems","uncertainty"],"authors":["Ví­ctor M. Zavala","Emil M. Constantinescu","Mihai Anitescu"],"authorKeys":["v-zavala","e-constantinescu","m-anitescu"],"doi":"10.1109/isgt.2010.5434772","preprint":null,"url":"http://ieeexplore.ieee.org/abstract/document/5434772/","pdf":null,"citations":18,"abstract":"We analyze the impacts of adopting advanced weather forecasting systems at different levels of the decision-making hierarchy of the power grid. Using case studies, we show that state-of-the-art numerical weather prediction (NWP) models can provide high-precision forecasts and uncertainty information that can significantly enhance the performance of planning, scheduling, energy management, and feedback control systems. In addition, we assess the forecasting capabilities of the Weather Research and Forecast (WRF) model in several application domains."},{"id":"2010-proactive-energy-management-for-next-generation","title":"Proactive energy management for next-generation building systems","year":2010,"type":"conference","venue":"IBPSA-USA Building Simulation Conference (SimBuild)","topics":["energy-systems","control"],"authors":["Ví­ctor M. Zavala","Jianhui Wang","Sven Leyffer","Emil M. Constantinescu","Mihai Anitescu","Guenter Conzelmann"],"authorKeys":["v-zavala","j-wang","s-leyffer","e-constantinescu","m-anitescu","g-conzelmann"],"doi":"10.26868/30680611.2010.ts07b-01-zavala","preprint":null,"url":"http://ibpsa-usa.org/index.php/ibpusa/article/view/311","pdf":"https://publications.ibpsa.org/proceedings/simbuild/2010/papers/simbuild2010_TS07B-01-Zavala.pdf","citations":24,"abstract":"We present a proactive energy management framework that integrates predictive dynamic building models and day-ahead forecasts of disturbances affecting efficiency and costs. This enables an efficient management of resources and an accurate prediction of the daily electricity demand profile. The strategy is based on the on-line solution of mixed-integer nonlinear programming problems. The framework is able to integrate forecasts of weather conditions, fuel prices, heat gains, and utility demands. We claim that a large adoption level of this proactive technology can improve the predictability of the overall electricity demand at high-level power grid operations."},{"id":"2010-real-time-nonlinear-optimization-as-a","title":"Real-time nonlinear optimization as a generalized equation","year":2010,"type":"journal","venue":"SIAM Journal on Control and Optimization","topics":["optimization-algorithms","control"],"authors":["Ví­ctor M. Zavala","Mihai Anitescu"],"authorKeys":["v-zavala","m-anitescu"],"doi":"10.1137/090762634","preprint":null,"url":"http://epubs.siam.org/doi/abs/10.1137/090762634","pdf":null,"citations":93,"abstract":"We establish results for the problem of tracking a time-dependent manifold arising in real-time optimization by casting this as a parametric generalized equation. We demonstrate that if points along a solution manifold are consistently strongly regular, it is possible to track the manifold approximately by solving a single linear complementarity problem (LCP) at each time step. We derive sufficient conditions guaranteeing that the tracking error remains bounded to second order with the size of the time step even if the LCP is solved only approximately. We use these results to derive a fast, augmented Lagrangian tracking algorithm and demonstrate the developments through a numerical case study."},{"id":"2010-stability-analysis-of-an-approximate-scheme","title":"Stability analysis of an approximate scheme for moving horizon estimation","year":2010,"type":"journal","venue":"Computers & Chemical Engineering","topics":["control"],"authors":["Ví­ctor M. Zavala"],"authorKeys":["v-zavala"],"doi":"10.1016/j.compchemeng.2010.02.033","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2010.02.033","pdf":null,"citations":32,"abstract":null},{"id":"2009-advanced-step-nonlinear-model-predictive-control","title":"Advanced step nonlinear model predictive control for air separation units","year":2009,"type":"journal","venue":"Journal of Process Control","topics":["control"],"authors":["Rui Huang","Ví­ctor M. Zavala","Lorenz T. Biegler"],"authorKeys":["r-huang","v-zavala","l-biegler"],"doi":"10.1016/j.jprocont.2008.07.006","preprint":null,"url":"https://doi.org/10.1016/j.jprocont.2008.07.006","pdf":null,"citations":131,"abstract":null},{"id":" itescu"],"authorKeys":["v-zavala","e-constantinescu","t-krause","m-anitescu"],"doi":"10.1016/j.jprocont.2009.07.004","preprint":null,"url":"https://doi.org/10.1016/j.jprocont.2009.07.004","pdf":null,"citations":90,"abstract":null},{"id":"2009-optimization-based-strategies-for-the-operation-2","title":"Optimization-based strategies for the operation of low-density polyethylene tubular reactors: Moving horizon estimation","year":2009,"type":"journal","venue":"Computers & Chemical Engineering","topics":["control"],"authors":["Ví­ctor M. Zavala","Lorenz T. Biegler"],"authorKeys":["v-zavala","l-biegler"],"doi":"10.1016/j.compchemeng.2008.10.008","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2008.10.008","pdf":null,"citations":55,"abstract":null},{"id":"2009-optimization-based-strategies-for-the-operation","title":"Optimization-based strategies for the operation of low-density polyethylene tubular reactors: nonlinear model predictive control","year":2009,"type":"journal","venue":"Computers & Chemical Engineering","topics":["control"],"authors":["Ví­ctor M. Zavala","Lorenz T. Biegler"],"authorKeys":["v-zavala","l-biegler"],"doi":"10.1016/j.compchemeng.2009.04.008","preprint":null,"url":"https://doi.org/10.1016/j.compchemeng.2009.04.008","pdf":null,"citations":76,"abstract":null},{"id":"2009-the-advanced-step-nmpc-controller-optimality","title":"The advanced-step NMPC controller: Optimality, stability and robustness","year":2009,"type":"journal","venue":"Automatica","topics":["control"],"authors":["Ví­ctor M. Zavala","Lorenz T. Biegler"],"authorKeys":["v-zavala","l-biegler"],"doi":"10.1016/j.automatica.2008.06.011","preprint":null,"url":"https://doi.org/10.1016/j.automatica.2008.06.011","pdf":null,"citations":417,"abstract":null},{"id":"2008-a-fast-moving-horizon-estimation-algorithm","title":"A fast moving horizon estimation algorithm based on nonlinear programming sensitivity","year":2008,"type":"journal","venue":"Journal of Process Control","topics":["control","optimization-algorithms"],"authors":["Ví­ctor M. Zavala","Carl D. Laird","Lorenz T. Biegler"],"authorKeys":["v-zavala","c-laird","l-biegler"],"doi":"10.1016/j.jprocont.2008.06.003","preprint":null,"url":"https://doi.org/10.1016/j.jprocont.2008.06.003","pdf":null,"citations":156,"abstract":null},{"id":"2008-fast-implementations-and-rigorous-models-can","title":"Fast implementations and rigorous models: Can both be accommodated in NMPC?","year":2008,"type":"journal","venue":"International Journal of Robust and Nonlinear Control","topics":["control"],"authors":["Ví­ctor M. Zavala","Carl D. Laird","Lorenz T. Biegler"],"authorKeys":["v-zavala","c-laird","l-biegler"],"doi":"10.1002/rnc.1250","preprint":null,"url":"http://onlinelibrary.wiley.com/doi/10.1002/rnc.1250/abstract","pdf":null,"citations":69,"abstract":"Abstract In less than two decades, nonlinear model predictive control has evolved from a conceptual framework to an attractive, general approach for the control of constrained nonlinear processes. These advances were realized both through better understanding of stability and robustness properties as well as improved algorithms for dynamic optimization. This study focuses on recent advances in optimization formulations and algorithms, particularly for the simultaneous collocation‐based approach. Here, we contrast this approach with competing approaches for online application and discuss further advances to deal with applications of increasing size and complexity. To address these challenges, we adapt the real‐time iteration concept, developed in the context of multiple shooting (Real‐Time PDE‐Constrained Optimization. SIAM: Philadelphia, PA, 2007; 25–52, 3–24), to a collocation‐based approach with a full‐space nonlinear programming solver. We show that straightforward sensitivity calculations from the Karush–Kuhn–Tucker system also lead to a real‐time iteration strategy, with both direct and shifted variants. This approach is demonstrated on a large‐scale polymer process, where online calculation effort is reduced by over two orders of magnitude. Copyright © 2007 John Wiley & Sons, Ltd."},{"id":"2008-interior-point-point-decomposition-approaches-for","title":"Interior-point decomposition approaches for parallel solution of large-scale nonlinear parameter estimation problems","year":2008,"type":"journal","venue":"Chemical Engineering Science","topics":["optimization-algorithms"],"authors":["Ví­ctor M. Zavala","Carl D. Laird","Lorenz T. Biegler"],"authorKeys":["v-zavala","c-laird","l-biegler"],"doi":"10.1016/j.ces.2007.05.022","preprint":null,"url":"https://doi.org/10.1016/j.ces.2007.05.022","pdf":null,"citations":112,"abstract":null},{"id":"2007-a-fast-computational-framework-for-large","title":"A Fast Computational Framework for Large-Scale Moving Horizon Estimation","year":2007,"type":"conference","venue":"IFAC Proceedings Volumes","topics":["control"],"authors":["Ví­ctor M. Zavala","Carl D. Laird","Lorenz T. Biegler"],"authorKeys":["v-zavala","c-laird","l-biegler"],"doi":"10.3182/20070606-3-mx-2915.00122","preprint":null,"url":"https://doi.org/10.3182/20070606-3-MX-2915.00122","pdf":null,"citations":29,"abstract":null},{"id":"2007-the-advanced-step-nmpc-controller","title":"The Advanced Step NMPC Controller","year":2007,"type":"conference","venue":"Proceedings of the IEEE Workshop on Advanced Process Control Applications for Industry, Vancouver, Canada","topics":["control"],"authors":["V. M. Zavala","L.T Biegler"],"authorKeys":["v-zavala","l-biegler"],"doi":null,"preprint":null,"url":null,"pdf":null,"citations":null,"abstract":null},{"id":"2006-fast-solvers-and-rigorous-models-can","title":"Fast solvers and rigorous models: can both be accommodated in NMPC","year":2006,"type":"conference","venue":"IFAC Workshop on Nonlinear Model Predictive Control for Fast Systems","topics":["control"],"authors":["V. M. Zavala","C.D. Laird","L.T Biegler"],"authorKeys":["v-zavala","c-laird","l-biegler"],"doi":null,"preprint":null,"url":null,"pdf":null,"citations":null,"abstract":null},{"id":"2006-large-scale-parameter-estimation-in-low","title":"Large-scale parameter estimation in low-density polyethylene tubular reactors","year":2006,"type":"journal","venue":"Industrial & Engineering Chemistry Research","topics":["optimization-algorithms"],"authors":["Ví­ctor M. Zavala","Lorenz T. Biegler"],"authorKeys":["v-zavala","l-biegler"],"doi":"10.1021/ie060338n","preprint":null,"url":"http://pubs.acs.org/doi/abs/10.1021/ie060338n","pdf":null,"citations":53,"abstract":"We propose a simultaneous approach for the solution of the associated DAE-constrained parameter estimation problem. Parameter estimation is an essential task in the development and on-line update of first-principles models for low-density polyethylene tubular reactors, consisting of nonlinear and stiff differential−algebraic equations (DAE). Our approach discretizes the reactor model equations in space, leading to a large-scale nonlinear program (NLP) that can be solved efficiently with state-of-the-art general-purpose NLP solvers. In doing so, more efficient estimation strategies can be considered, enabling the solution of challenging estimation problems including multiple data and large parameters sets. This approach is efficient in handling advanced regression problems such as the errors-in-variables-measured (EVM) formulation. The methodology is fast, robust, and reliable and can be used both for off-line and on-line purposes. Moreover, substantial improvements on the reactor model predictions have been obtained over previous approaches, making the model amenable for real-time optimization and control tasks."},{"id":"2006-the-bifurcation-behavior-of-a-polyurethane","title":"The bifurcation behavior of a polyurethane continuous stirred tank reactor","year":2006,"type":"journal","venue":"Chemical Engineering Science","topics":["control"],"authors":["Víctor Zavala-Tejeda","Antonio Flores-Tlacuahuac","Eduardo Vivaldo-Lima"],"authorKeys":["v-zavala","a-flores","e-vivaldo"],"doi":"10.1016/j.ces.2006.08.040","preprint":null,"url":"https://www.sciencedirect.com/science/article/pii/S0009250906005306","pdf":null,"citations":13,"abstract":null},{"id":"2005-complex-nonlinear-behavior-in-the-full","title":"Complex Nonlinear Behavior in the Full-Scale High-Impact Polystyrene Process","year":2005,"type":"journal","venue":"Industrial & Engineering Chemistry Research","topics":["control"],"authors":["Antonio Flores-Tlacuahuac","Víctor Zavala-Tejeda","Enrique Saldívar-Guerra"],"authorKeys":["a-flores","v-zavala","e-saldivar"],"doi":"10.1021/ie049418m","preprint":null,"url":"http://pubs.acs.org/doi/full/10.1021/ie049418m","pdf":null,"citations":15,"abstract":"In this work, the open-loop nonlinear bifurcation analysis of the high-impact polystyrene process is carried out and used for optimal design, operation, and control analysis. The process can be described by a set of seven continuous stirred tank reactors (CSTRs) connected in series. Process design was carried out using an optimization approach; the nominal optimal operating point is open-loop unstable and agrees with typical industrial operating conditions. For the seven CSTRs cascade, as much as 398 steady states were found, but only 11 are considered as industrially feasible; 9 of them are open-loop unstable. Both input and output multiplicities were found, and implications on optimal grade transitions and process control are discussed. A simple cascade control system was used to demonstrate that linear PI controllers add patterns of nonlinear behavior previously not present in the process."},{"id":"2005-dynamic-optimization-of-a-semi-batch","title":"Dynamic optimization of a semi-batch reactor for polyurethane production","year":2005,"type":"journal","venue":"Chemical Engineering Science","topics":["control"],"authors":["Ví­ctor M. Zavala","Antonio Flores-Tlacuahuac","Eduardo Vivaldo-Lima"],"authorKeys":["v-zavala","a-flores","e-vivaldo"],"doi":"10.1016/j.ces.2005.01.020","preprint":null,"url":"https://doi.org/10.1016/j.ces.2005.01.020","pdf":null,"citations":40,"abstract":null},{"id":"thesis-victor-m-zavala-phd","title":"Computational Strategies for the Optimal Operation of Large-scale Chemical Processes","year":2008,"type":"thesis","venue":"PhD thesis, Carnegie Mellon University","topics":["control","optimization-algorithms"],"authors":["Victor M. Zavala"],"authorKeys":["v-zavala"],"doi":null,"preprint":null,"url":"https://www.proquest.com/docview/304666651?pq-origsite=gscholar&fromopenview=true","pdf":null,"citations":null,"abstract":null},{"id":"thesis-blake-lopez-phd","title":"Systems Engineering Approaches for Chemical Engineering Education","year":2025,"type":"thesis","venue":"PhD thesis, University of Wisconsin–Madison","topics":["education","graph-modeling"],"authors":["Blake Lopez"],"authorKeys":["lab:blake-lopez"],"doi":null,"preprint":null,"url":"https://www.proquest.com/docview/3250272898","pdf":null,"citations":null,"abstract":null},{"id":"thesis-blake-lopez-msc","title":"Optimization Framework for the Analysis of Decarbonization Pathways","year":2022,"type":"thesis","venue":"MSc thesis, University of Wisconsin–Madison","topics":["energy-systems","supply-chains"],"authors":["Blake Lopez"],"authorKeys":["lab:blake-lopez"],"doi":null,"preprint":null,"url":null,"pdf":null,"citations":null,"abstract":null},{"id":"thesis-jaron-thompson-phd","title":"Modeling and Optimization of Synthetic Microbial Communities","year":2025,"type":"thesis","venue":"PhD thesis, University of Wisconsin–Madison","topics":["biological-systems","machine-learning"],"authors":["Jaron Thompson"],"authorKeys":["lab:jaron-thompson"],"doi":null,"preprint":null,"url":null,"pdf":null,"citations":null,"abstract":null},{"id":"thesis-bo-xun-wang-phd","title":"Systems Analysis Tools for Sustainable Plastics Manufacturing","year":2025,"type":"thesis","venue":"PhD thesis, University of Wisconsin–Madison","topics":["plastics","supply-chains"],"au
